# SonarCloud configuration for this repository.
#
# THE FILENAME IS LOAD-BEARING. Analysis runs via the SonarCloud GitHub App
# (automatic analysis), which reads `.sonarcloud.properties`. It does NOT read
# `sonar-project.properties` -- that file is for scanner-CLI runs, which this
# estate does not do, so exclusions placed there are silently ignored and the
# analysis proceeds as though the file were absent.
#
# .github/workflows/sonarqube-hdf-emit.yml only fetches the results afterwards
# and converts them to OHDF; it does not configure the analysis.
#
# ---- Why duplication detection is off for controls/ -------------------------
#
# This profile implements a benchmark one control per file, and the benchmark's
# own structure makes those files near-identical: the same scope guard, the same
# attestation resolution, the same describe shape, with only the resource and
# the assertion differing. Every profile repository here is built that way
# deliberately -- each profile stands alone rather than inheriting from a shared
# base, so that cloning one repository gives you something you can run.
#
# Measured on main, essentially all of this repository's duplicated lines are in
# controls/. libraries/, tools/ and .github/workflows/ carry almost none, which
# is the part of the codebase where duplication would actually indicate a
# problem worth fixing.
#
# The concrete failure this addresses: a change touching one comment line across
# many control files reported 36-88% duplication on new code while raising ZERO
# issues. Those lines were pre-existing and deliberate; editing them merely
# reclassified them as new code, so the gate was reporting the design, not a
# regression.
#
# SCOPE: this disables the duplication metric for controls/ and nothing else.
# It is deliberately NOT `sonar.exclusions` -- every other rule still runs on
# control files, so real defects in control logic are still reported, and
# duplication is still measured everywhere else in the repository.
sonar.cpd.exclusions=controls/**
