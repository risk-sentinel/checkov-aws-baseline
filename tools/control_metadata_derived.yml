  nist:
  - CP-9
  - SI-12
  nist_r4:
  - CP-9
  - SI-12
  nist_source: agent-drafted
  rationale: Automated backups are the only recovery path for a destructive write or a ransomware event
    on the cluster. A one-day window means the damage has to be noticed within a day; a week of retention
    gives a realistic detection interval to restore from.
  severity: medium
  what: backup_retention_period is at least 7 days
CKV_AWS_362:
  cci:
  - CCI-000366
  impact: 0.3
  ksi:
  - KSI-CMT-INV
  nist:
  - CM-8
  - AU-12
  nist_r4:
  - CM-8
  - AU-12
  nist_source: agent-drafted
  rationale: Snapshots that do not carry the cluster's tags fall out of the inventory the estate is governed
    by, so ownership, data classification and retention policies that key on tags stop applying to the
    copies of the data even though they still apply to the source.
  severity: low
CKV_AWS_363:
  cci:
  - CCI-001227
  - CCI-002605
  impact: 0.5
  ksi:
  - KSI-CMT-VTD
  nist:
  - SI-2
  - SI-2 (5)
  nist_r4:
  - SI-2
  - SI-2 (5)
  nist_source: agent-drafted
  rationale: 'A deprecated Lambda runtime stops receiving security patches for the language runtime and
    the OS packages beneath it, and AWS eventually blocks first updates and then invocations. The deployed
    runtime is the one that matters: a function created before its runtime was deprecated keeps running
    on it until someone changes it, with no Terraform change to notice.'
  severity: medium
CKV_AWS_366:
  cci:
  - CCI-000213
  - CCI-002233
  impact: 0.7
  ksi:
  - KSI-IAM-CTL
  nist: &id015
  - AC-3
  - AC-6
  nist_r4: *id015
  nist_source: category-derived
  rationale: Ensure AWS Cognito identity pool does not allow unauthenticated guest access. Anchors derived
    from the check's iam category, not reviewed control by control.
  severity: high
CKV_AWS_37:
  cci:
  - CCI-000169
  - CCI-000172
  impact: 0.5
  ksi:
  - KSI-MLA-LOG
  nist:
  - AU-2
  - AU-12
  nist_r4:
  - AU-2
  - AU-12
  nist_source: agent-drafted
  rationale: The control plane is where authentication decisions and API authorisations are made, and
    the audit and authenticator logs are the only record of them. A cluster with partial logging cannot
    answer who called what after the fact.
  severity: medium
  what: enabled_cluster_log_types contains all of api, audit, authenticator, controllerManager and scheduler
CKV_AWS_377:
  cci:
  - CCI-000366
  - CCI-000213
  impact: 0.5
  ksi:
  - KSI-CMT-CFG
  nist:
  - CM-6
  - AC-3
  nist_r4:
  - CM-6
  - AC-3
  nist_source: agent-drafted
  rationale: Without the transfer lock, a registrar transfer needs only the auth code, and a transferred
    domain takes the DNS zone -- and with it mail delivery and every certificate issued by DNS validation
    -- to whoever initiated it. Recovering a domain after the fact is a dispute process, not a rollback.
  severity: medium
CKV_AWS_378:
  cci:
  - CCI-002418
  - CCI-002421
  impact: 0.5
  ksi:
  - KSI-SVC-CET
  nist:
  - SC-8
  - SC-8 (1)
  nist_r4:
  - SC-8
  - SC-8 (1)
  nist_source: agent-drafted
  rationale: A target group registered on HTTP carries requests — including the session cookies and bearer
    tokens the load balancer just decrypted — in cleartext across the VPC to the target. The perimeter
    TLS termination protects the internet leg only; anything with a foothold on the path inside reads
    the rest.
  severity: medium
CKV_AWS_383:
  cci:
  - CCI-002664
  - CCI-001097
  impact: 0.5
  ksi:
  - KSI-SVC-VRI
  nist:
  - SI-4
  - AC-4
  - SC-7
  nist_r4:
  - SI-4
  - AC-4
  - SC-7
  nist_source: agent-drafted
  rationale: A guardrail is the only place the agent's input and output filtering is enforced. Without
    one attached, prompt content and model responses pass through unfiltered no matter what the application
    layer intends.
  severity: medium
