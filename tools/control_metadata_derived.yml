  nist_source: agent-drafted
  rationale: Neptune storage encryption can only be set when the cluster is created, so an unencrypted
    graph database stays unencrypted for its whole life. The graph itself is usually identity and relationship
    data, and it sits on volumes and in automated snapshots that outlive the cluster.
