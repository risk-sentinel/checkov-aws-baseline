  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: A snapshot outlives the cluster it came from and holds the same data. Under an AWS-owned
    key the account cannot audit who used the key, cannot revoke it, and cannot prove the snapshot became
    unreadable when it was retired.
  severity: medium
CKV_AWS_279:
  cci:
