  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: A DAX cluster holds a copy of the table items it caches, and encryption at rest is off unless
    it was set at creation. The cached copy is then the unencrypted one even where the source table is
    encrypted.
  severity: high
CKV_AWS_48:
  cci: *id009
  impact: 0.5
  ksi: *id010
  nist: *id002
  nist_r4: *id002
  nist_source: category-derived
  rationale: Ensure MQ Broker logging is enabled. Anchors derived from the check's logging category, not
