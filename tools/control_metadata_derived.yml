  nist_r4:
  - SC-8
  - SC-8 (1)
  nist_source: agent-drafted
  rationale: Cluster nodes shuffle whole partitions of the dataset between each other over the VPC network.
    Unencrypted, that traffic exposes the data to anything with a foothold in the subnet, which is a much
    lower bar than access to the cluster itself.
  severity: high
  what: the security configuration sets EnableInTransitEncryption
CKV_AWS_359:
  cci:
  - CCI-000764
  - CCI-000196
  impact: 0.5
  ksi:
  - KSI-IAM-CTL
  nist:
  - IA-2
  - IA-5
  nist_r4:
  - IA-2
  - IA-5
  nist_source: agent-drafted
  rationale: Without IAM database authentication the cluster is reached with a static password that lives
    in application configuration and does not expire. With it enabled, access is a short-lived token tied
    to an IAM principal, so revocation and audit happen in one place.
