  - CCI-001199
  - CCI-002475
  impact: 0.7
  ksi:
  - KSI-SVC-CER
  nist:
  - SC-28
  - SC-28 (1)
  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: DocumentDB storage is unencrypted by default and encryption cannot be turned on after creation
    -- the cluster has to be restored into a new encrypted one. Finding this on a deployed cluster is
    finding a migration, which is why it matters that it is found early.
  severity: high
CKV_AWS_81:
  cci:
  - CCI-002418
  - CCI-002421
  impact: 0.7
  ksi:
  - KSI-SVC-CET
  nist:
  - SC-8
  - SC-8 (1)
  nist_r4:
  - SC-8
  - SC-8 (1)
  nist_source: agent-drafted
  rationale: A client_broker setting of PLAINTEXT or TLS_PLAINTEXT keeps a cleartext listener open on
    every broker, so a producer misconfiguration silently sends the topic's payload unencrypted across
    the VPC. Requiring TLS removes the option rather than relying on every client to choose it.
  severity: high
  what: encryption_info is set and encryption_in_transit does not weaken client_broker or in_cluster
CKV_AWS_82:
  cci:
  - CCI-000382
  - CCI-000213
  impact: 0.5
  ksi:
  - KSI-CMT-CFG
  nist:
  - CM-7
  - AC-3
  nist_r4:
  - CM-7
  - AC-3
  nist_source: agent-drafted
  rationale: Unless the workgroup configuration is enforced, a client can override the result location
    and the encryption settings per query, so the encryption the workgroup declares is advisory rather
    than binding.
  severity: medium
CKV_AWS_83:
  cci:
