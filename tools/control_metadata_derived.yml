CKV_AWS_44:
  cci:
  - CCI-001199
  - CCI-002475
  impact: 0.7
  ksi:
  - KSI-SVC-CER
  nist:
  - SC-28
  - SC-28 (1)
  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: Neptune storage encryption can only be set when the cluster is created, so an unencrypted
    graph database stays unencrypted for its whole life. The graph itself is usually identity and relationship
    data, and it sits on volumes and in automated snapshots that outlive the cluster.
  severity: high
CKV_AWS_47:
  cci:
  - CCI-001199
  - CCI-002475
  impact: 0.7
  ksi:
  - KSI-SVC-CER
  nist:
  - SC-28
  - SC-28 (1)
  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: A DAX cluster holds a copy of the table items it caches, and encryption at rest is off unless
    it was set at creation. The cached copy is then the unencrypted one even where the source table is
    encrypted.
  severity: high
CKV_AWS_48:
  cci: *id009
  impact: 0.5
  ksi: *id010
  nist: *id002
  nist_r4: *id002
  nist_source: category-derived
  rationale: Ensure MQ Broker logging is enabled. Anchors derived from the check's logging category, not
    reviewed control by control.
  severity: medium
CKV_AWS_5:
  cci:
  - CCI-001199
  - CCI-002475
  impact: 0.7
  ksi:
  - KSI-SVC-CER
  nist:
  - SC-28
  - SC-28 (1)
  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: A search domain holds a denormalised copy of whatever it indexes, which is usually the same
    records the source database encrypts. Without encryption at rest the domain's underlying storage and
    its automated snapshots are readable by anyone who reaches them.
  severity: high
CKV_AWS_58:
  cci:
  - CCI-001199
  - CCI-002475
  impact: 0.7
  ksi:
  - KSI-SVC-CER
  nist:
  - SC-28
  - SC-28 (1)
  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: Without envelope encryption a Kubernetes Secret is stored in etcd as base64, which is an
    encoding and not a protection. Anyone who can read the cluster's backing store, or restore it from
    a backup, reads every credential in it.
  severity: high
CKV_AWS_6:
  cci:
  - CCI-002418
  - CCI-002421
  impact: 0.7
  ksi:
  - KSI-SVC-CET
  nist:
  - SC-8
  - SC-8 (1)
  nist_r4:
  - SC-8
  - SC-8 (1)
  nist_source: agent-drafted
  rationale: 'Shard replication and query fan-out cross the network in the clear unless node-to-node encryption
    is on, so a domain that terminates TLS at its endpoint can still be read off the wire between its
    own nodes. Note this is asserted on every domain: Checkov exempts single-instance domains, where the
    traffic is real as soon as the domain is scaled out.'
  severity: high
  what: node-to-node encryption is enabled on any domain with more than one instance
CKV_AWS_67:
  cci:
