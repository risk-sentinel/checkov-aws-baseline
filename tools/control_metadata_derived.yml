  nist_r4:
  - AU-9
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: Without SSE-KMS the log objects are readable by anyone who can read the bucket. With a CMK,
    reading them additionally requires a decrypt grant on the key, so bucket access alone does not disclose
    the audit record.
