  - SC-12
  nist_r4:
  - SC-28
  - SC-28 (1)
  - SC-12
  nist_source: agent-drafted
  rationale: A snapshot copy is a second, independently retained image of the database. Encrypting it
    under a managed key keeps the ability to revoke access to the copy without deleting it, which is the
    only lever available once a snapshot has been shared or moved to another region.
  severity: high
CKV_AWS_278:
  cci:
  - CCI-001199
