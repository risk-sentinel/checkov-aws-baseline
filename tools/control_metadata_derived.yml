  nist:
  - SC-28
  - SC-28 (1)
  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: A cluster snapshot holds a full copy of the database and outlives the cluster it came from.
    If it is unencrypted, the data is readable by anyone who can restore it or who gains access to the
    snapshot store, without ever touching the running database.
  severity: high
  stronger: Checkov reads the declared snapshot resource. This reads DescribeDBClusterSnapshots, so snapshots
    created by hand or by a retention policy -- the ones Terraform never declared -- are assessed too.
CKV_AWS_148:
