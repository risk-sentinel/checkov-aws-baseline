  nist_source: agent-drafted
  rationale: A retention period of zero turns automated backups off entirely, so a dropped table or a
    corrupted write has no point to recover from. The window is the only thing standing between a mistake
    and permanent data loss, and it cannot be added retroactively.
  severity: medium
  what: backup_retention_period is set to between 1 and 35 days
