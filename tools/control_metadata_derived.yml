  nist_r4:
  - SC-7
  - CM-7
  nist_source: agent-drafted
  rationale: A default VPC ships with a public subnet in every availability zone, an internet gateway
    and a security group that allows all traffic between its members. An instance launched without an
    explicit subnet lands there.
  severity: medium
  stronger: Checkov flags the Terraform resource. AWS creates a default VPC in every region of a new account
    regardless of Terraform, so this asserts against the VPCs that exist rather than against the ones
    HCL mentions.
  what: any aws_default_vpc resource is declared at all
