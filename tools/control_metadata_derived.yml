CKV_AWS_36:
  cci:
  - CCI-000162
  - CCI-002696
  impact: 0.5
  ksi:
  - KSI-MLA-LOG
  nist:
  - AU-9
  - SI-7
  nist_r4:
  - AU-9
  - SI-7
  nist_source: agent-drafted
  rationale: Log file validation writes a signed digest of each delivered log file. Without it, a log
    file that was altered or removed after delivery is indistinguishable from one that was never written.
  severity: medium
CKV_AWS_360:
  cci:
  - CCI-000535
  - CCI-001678
  impact: 0.5
  ksi:
  - KSI-RPL-ABO
  nist:
  - CP-9
  - SI-12
  nist_r4:
  - CP-9
  - SI-12
  nist_source: agent-drafted
  rationale: The default retention of one day means a bad write discovered on Monday about a Friday deployment
    is unrecoverable. Seven days covers a weekend plus the time it takes for a data problem to be reported.
  severity: medium
CKV_AWS_361:
  cci:
  - CCI-000535
  - CCI-001678
  impact: 0.5
  ksi:
  - KSI-RPL-ABO
  nist:
  - CP-9
  - SI-12
  nist_r4:
  - CP-9
  - SI-12
  nist_source: agent-drafted
  rationale: Automated backups are the only recovery path for a destructive write or a ransomware event
    on the cluster. A one-day window means the damage has to be noticed within a day; a week of retention
    gives a realistic detection interval to restore from.
  severity: medium
  what: backup_retention_period is at least 7 days
CKV_AWS_362:
