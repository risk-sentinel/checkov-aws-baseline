  - CCI-002475
  impact: 0.7
  ksi:
  - KSI-SVC-CER
  nist:
  - SC-28
  - SC-28 (1)
  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: A search domain holds a denormalised copy of whatever it indexes, which is usually the same
    records the source database encrypts. Without encryption at rest the domain's underlying storage and
    its automated snapshots are readable by anyone who reaches them.
  severity: high
CKV_AWS_58:
  cci:
  - CCI-001199
  - CCI-002475
  impact: 0.7
  ksi:
  - KSI-SVC-CER
  nist:
  - SC-28
  - SC-28 (1)
  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: Without envelope encryption a Kubernetes Secret is stored in etcd as base64, which is an
    encoding and not a protection. Anyone who can read the cluster's backing store, or restore it from
    a backup, reads every credential in it.
  severity: high
CKV_AWS_6:
  cci:
  - CCI-002418
  - CCI-002421
  impact: 0.7
  ksi:
  - KSI-SVC-CET
  nist:
  - SC-8
  - SC-8 (1)
  nist_r4:
  - SC-8
  - SC-8 (1)
  nist_source: agent-drafted
  rationale: 'Shard replication and query fan-out cross the network in the clear unless node-to-node encryption
    is on, so a domain that terminates TLS at its endpoint can still be read off the wire between its
    own nodes. Note this is asserted on every domain: Checkov exempts single-instance domains, where the
    traffic is real as soon as the domain is scaled out.'
  severity: high
  what: node-to-node encryption is enabled on any domain with more than one instance
CKV_AWS_67:
