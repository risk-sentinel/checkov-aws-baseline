CKV_AWS_26:
  cci:
  - CCI-001199
  - CCI-002475
  impact: 0.7
  ksi:
  - KSI-SVC-CER
  nist:
  - SC-28
  - SC-28 (1)
  nist_r4:
  - SC-28
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: Messages sit in the topic between publish and delivery, and topics routinely carry identifiers,
    tokens and operational detail from the systems that publish to them. Server-side encryption puts that
    at-rest window under a key whose use is logged and can be revoked.
  severity: high
CKV_AWS_266:
  cci:
  - CCI-001199
  - CCI-002475
  impact: 0.7
  ksi:
