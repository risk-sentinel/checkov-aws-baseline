CKV_AWS_119:
  cci:
  - CCI-002475
  impact: 0.5
  ksi:
  - KSI-SVC-KMG
  nist:
  - SC-12
  - SC-28 (1)
  nist_r4:
  - SC-12
  - SC-28 (1)
  nist_source: agent-drafted
  rationale: A table on the AWS-owned default key is encrypted, but the key is invisible -- it has no
    key policy to read, no grants to audit, and no CloudTrail record of its use. Moving to a KMS key puts
    the table's encryption under the same key policy and usage log as everything else.
  severity: medium
  what: server_side_encryption is enabled with a kms_key_arn, rather than the AWS-owned default key
