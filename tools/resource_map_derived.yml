        \ spec's rotation_enabled field. That shape CANNOT FAIL. AwsApiAssets#dig_path resolves a field\
        \ as `node[key.to_sym] || node[key]`, so a member whose value is `false` evaluates to `false ||\
        \ nil` => nil; render_api then emits `.reject { |a| a[:rotation_enabled].nil? }` for a value comparison,\
