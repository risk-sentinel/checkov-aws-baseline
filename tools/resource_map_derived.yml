        \ the control would render Not Applicable or 100% pass. The stock pair has no such problem: aws_secretsmanager_secrets\
        \ registers arns (field :arn) off ListSecrets (no required args), aws_secretsmanager_secret requires\
        \ secret_id (an ARN is a valid SecretId) and runs create_resource_methods over DescribeSecret,\
        \ whose RotationEnabled member is confirmed in botocore. A secret that never had rotation configured\
