# How a Terraform resource type becomes something this profile can assess.
#
# Keyed by (check, terraform type) rather than by check, because the argument a
# check inspects varies by type -- CKV_AWS_88 reads associate_public_ip_address
# on an instance and network_interfaces[0].associate_public_ip_address on a
# launch template. A map keyed only by check would inspect the wrong field for
# one of them and still look right.
#
# reader    the InSpec resource that enumerates every deployed asset of this type
# field     the row attribute answering this check
# satisfies how the field is judged: equals / not_equals / empty / any_of
# note      only where the deployed assertion is not a restatement of the IaC one
#
# Seeded with the aws_instance tranche. Everything else in the catalogue is
# unmapped, which is what tools/lint_catalog_drift.py counts -- an unmapped
# check has no control, and that is visible rather than assumed.
#
# Removed after tools/lint_api_paths.rb resolved its path against the SDK model:
#   CKV_AWS_272: read code_signing_config_arn off lambda:ListFunctions, which
#     returns FunctionConfiguration and does not carry that member. The field was
#     nil for every function, and because `not_empty` deliberately does not
#     nil-filter, every Lambda in the account FAILED a check nothing had assessed.

readers:
  aws_instance:              {resource: aws_compute_assets, type: aws_instance}
  aws_launch_template:       {resource: aws_compute_assets, type: aws_launch_template}
  aws_launch_configuration:  {resource: aws_compute_assets, type: aws_launch_configuration}

