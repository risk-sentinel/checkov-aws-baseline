  CKV_AWS_81:
    aws_msk_cluster:
      terraform: |
        resource "aws_msk_cluster" "events" {
          cluster_name           = "events"
          kafka_version          = "3.6.0"
          number_of_broker_nodes = 3

          broker_node_group_info {
            instance_type   = "kafka.m5.large"
            client_subnets  = var.private_subnet_ids
            security_groups = [aws_security_group.msk.id]
            storage_info {
              ebs_storage_info { volume_size = 100 }
            }
          }

          encryption_info {
            encryption_at_rest_kms_key_arn = aws_kms_key.msk.arn
            encryption_in_transit {
              client_broker = "TLS"    # not TLS_PLAINTEXT, not PLAINTEXT
              in_cluster    = true
            }
          }
        }
      cli: |
        aws kafka update-security --cluster-arn <arn> --current-version <version> --encryption-info '{"EncryptionInTransit":{"ClientBroker":"TLS","InCluster":true}}'
      note: >-
        UpdateSecurity performs a rolling broker restart. Any producer or
        consumer still connecting on the plaintext port stops working the moment
        it completes, so move the clients first.

  CKV_AWS_291:
    aws_msk_cluster:
      terraform: |
        resource "aws_msk_cluster" "events" {
          cluster_name           = "events"
          kafka_version          = "3.6.0"
          number_of_broker_nodes = 3

          broker_node_group_info {
            instance_type   = "kafka.m5.large"
            client_subnets  = var.private_subnet_ids
            security_groups = [aws_security_group.msk.id]

            connectivity_info {
              public_access {
                type = "DISABLED"
              }
            }

            storage_info {
              ebs_storage_info { volume_size = 100 }
            }
          }

          encryption_info {
            encryption_in_transit {
              client_broker = "TLS"
              in_cluster    = true
            }
          }
        }
      cli: |
        aws kafka update-connectivity --cluster-arn <arn> --current-version <version> --connectivity-info '{"PublicAccess":{"Type":"DISABLED"}}'
      note: >-
        Turning public access off releases the brokers' elastic IPs, so any
        client bootstrapping against the public endpoint must be moved into the
        VPC (or onto a VPC connection) before the update.

  CKV_AWS_319:
    aws_cloudwatch_metric_alarm:
      terraform: |
        resource "aws_cloudwatch_metric_alarm" "high_5xx" {
          alarm_name          = "app-high-5xx"
          namespace           = "AWS/ApplicationELB"
          metric_name         = "HTTPCode_Target_5XX_Count"
          statistic           = "Sum"
          period              = 300
          evaluation_periods  = 2
          threshold           = 10
          comparison_operator = "GreaterThanThreshold"
          treat_missing_data  = "notBreaching"

          actions_enabled = true                       # the default; state it
          alarm_actions   = [aws_sns_topic.alerts.arn]
          ok_actions      = [aws_sns_topic.alerts.arn]
        }
      cli: |
        aws cloudwatch enable-alarm-actions --alarm-names app-high-5xx
      note: >-
        Enabling actions on an alarm that has no alarm_actions changes nothing
        observable. Check that the action list is non-empty at the same time.

  CKV_AWS_338:
    aws_cloudwatch_log_group:
      terraform: |
        resource "aws_cloudwatch_log_group" "app" {
          name              = "/aws/app/api"
          retention_in_days = 365        # 0 means never expire, also acceptable
          kms_key_id        = aws_kms_key.logs.arn
        }
      cli: |
        aws logs put-retention-policy --log-group-name /aws/app/api --retention-in-days 365
      note: >-
        Raising retention does not bring back events already aged out; it only
        governs what is kept from now on. CloudWatch Logs accepts a fixed set of
        values -- 365 and 400 are the ones at or just above a year.

  CKV_AWS_121:
    aws_config_configuration_aggregator:
      terraform: |
        resource "aws_config_configuration_aggregator" "org" {
          name = "org-aggregator"

          organization_aggregation_source {
            all_regions = true                       # API: AllAwsRegions
            role_arn    = aws_iam_role.config_aggregator.arn
          }
        }
      cli: |
        aws configservice put-configuration-aggregator --configuration-aggregator-name org-aggregator --organization-aggregation-source RoleArn=<role-arn>,AllAwsRegions=true
      note: >-
        The aggregator only collects what the recorders in each region actually
        record. Turning all_regions on does not enable AWS Config anywhere -- a
        region with no recorder still contributes nothing.

  CKV_AWS_377:
    aws_route53domains_registered_domain:
      terraform: |
        resource "aws_route53domains_registered_domain" "example" {
          domain_name   = "example.com"
          transfer_lock = true
          auto_renew    = true
        }
      cli: |
        aws route53domains enable-domain-transfer-lock --domain-name example.com --region us-east-1
      note: >-
        The transfer lock cannot be set during the first 60 days after
        registration or after a transfer in; the API rejects it until the domain
        leaves that window.


skipped:

  # --- S3 -------------------------------------------------------------------
  CKV_AWS_143: >-
    aws_s3_bucket has no object-lock reader. The vendored resource wraps
    get_bucket_acl, _logging, _versioning, _encryption, _policy, _lifecycle and
    public-access-block, but not GetObjectLockConfiguration, and the
    configuration is per-bucket so no plural can carry it either.

  CKV_AWS_181: >-
    S3 objects cannot be enumerated for an account. aws_s3_bucket_objects
    requires bucket_name (validate_parameters(required: %i(bucket_name)) plus an
    explicit raise), and aws_s3_bucket_object requires bucket_name AND key, so
    neither can be the `enumerate` half of a stock mapping. An object copy also
    leaves no distinguishable deployed artefact -- it is just an object.

  CKV_AWS_186: >-
    Same as CKV_AWS_181: no account-wide object enumeration exists, and an
    object's SSEKMSKeyId is only reachable through a per-key get_object.

  CKV_AWS_300: >-
    aws_s3_bucket exposes bucket_lifecycle_rules as an array of rule structs.
    The check needs "some rule has abort_incomplete_multipart_upload AND status
    Enabled AND an empty filter", which none of equals / not_empty / empty /
    greater_than / in_list can express against a struct array.

  CKV_AWS_375: >-
    aws_s3_bucket#bucket_acl returns the raw grants array. The check needs
    "no grant whose permission is FULL_CONTROL or READ_ACP has a grantee URI of
    the AllUsers group" -- a per-element predicate over two fields, which the
    satisfies verbs cannot state. `public?` is close but is a different
    assertion (it also folds in the policy status) and is already CKV_AWS_20.

  CKV_AWS_392: >-
    Two independent blockers. (1) s3control ListAccessPoints requires AccountId,
    so it cannot be an api spec `list`. (2) The vendored aws_s3_access_points /
    aws_s3_access_point resources are misnamed: they call
    list_bucket_metrics_configurations and get_bucket_metrics_configuration --
    S3 metrics configurations, not access points -- and the plural also requires
    bucket_name. Neither reader answers this check. Worth reporting upstream.

  CKV_AWS_53: >-
    aws_s3_bucket exposes only prevent_public_access?, which is the AND of all
    four block-public-access flags; the individual flags are not readable. Using
    it for the block_public_acls check would fail a bucket that sets
    block_public_acls correctly but leaves restrict_public_buckets off -- a
    false positive against this specific check id. The conjunction is already
    asserted by the shipped CKV2_AWS_6 mapping, so no coverage is lost.

  CKV_AWS_54: >-
    Same as CKV_AWS_53: only the four-way conjunction prevent_public_access? is
    exposed, so a block_public_policy control built on it would fail buckets
    that satisfy this check. Covered by CKV2_AWS_6.

  CKV_AWS_55: >-
    Same as CKV_AWS_53: ignore_public_acls is not individually readable through
    aws_s3_bucket. Covered by CKV2_AWS_6.

  CKV_AWS_56: >-
    Same as CKV_AWS_53: restrict_public_buckets is not individually readable
    through aws_s3_bucket. Covered by CKV2_AWS_6.

  CKV_AWS_70: >-
    Requires parsing the bucket policy document -- statement effects,
    principals and condition operators. Not expressible in either schema.

  CKV_AWS_93: >-
    Requires parsing the bucket policy document for a Deny statement over
    s3:PutBucketPolicy with a wildcard principal. Not expressible in either
    schema.

  # --- RDS ------------------------------------------------------------------
  CKV_AWS_198: >-
    The assertion is "the collection is empty", not "each member satisfies a
    predicate". Both schemas are enumerate-then-assert-per-item and have no
    collection-level form, and no satisfies verb always fails. The reader exists
    and works (aws_rds_db_security_groups, column db_security_group_names), so
    this becomes mappable the day the schema grows a collection assertion.

  CKV_AWS_23: >-
    Two reasons. The deployed group-level half is vacuous: EC2's
    CreateSecurityGroup requires Description, so every deployed security group
    has one. The per-rule half is unreachable: rule descriptions live in
    ip_permissions[].ip_ranges[].description, which aws_security_group does not
    surface as a scalar property. Four of the seven declared Terraform types
    (db/elasticache/redshift security groups, security_group_rule) are also
    EC2-Classic-era or rule-only and have no standalone deployed object here.

  CKV_AWS_245: >-
    Mappable in mechanism but vacuous in outcome. The api spec would work --
    rds DescribeDBInstanceAutomatedBackups takes no required arguments,
    collection db_instance_automated_backups, id db_instance_identifier, arn
    db_instance_automated_backups_arn, field kms_key_id -- but the only
    available assertion is not_empty, and the api reader drops nil fields from
    scope before asserting. An unencrypted replicated backup has a nil KmsKeyId,
    so it would leave scope and the control would render Not Applicable rather
    than failing. That is the silence-as-success shape, so it is not shipped.

  CKV_AWS_250: >-
    Needs a multi-branch version comparison (>= 14, or 13.x with x > 2, or 12.x
    with x > 6, ...) parsed out of engine_version, gated on engine being
    postgres or aurora-postgresql. Neither an applicability gate nor a version
    predicate exists in the schema.

  CKV_AWS_302: >-
    A DB snapshot's sharing lives in a separate call. aws_rds_snapshot_attributes
    is a FilterTable whose attribute_values column is an array of arrays
    ([["all"]] when public, [[]] when not), so `empty` does not even match the
    not-shared case. The check also forbids only the literal "all" while
    permitting named account ids, and there is no membership-negation verb.

  CKV_AWS_388: >-
    The check is "engine_version is NOT one of 10.11, 10.12, 10.13, 11.6, 11.7,
    11.8" for aurora-postgresql. in_list tests membership; there is no
    not_in_list, and inverting it into an allow-list would mean enumerating
    every safe Aurora PostgreSQL version, which goes stale on every release.

  # --- EMR ------------------------------------------------------------------
  CKV_AWS_114: >-
    An applicability-gated check: Checkov returns UNKNOWN for a cluster with no
    kerberos_attributes and only asserts realm on clusters that have them.
    DescribeCluster omits KerberosAttributes entirely for a non-Kerberos
    cluster, so kerberos_attributes_realm is nil -- and the STOCK template has
    no nil guard, so every non-Kerberos cluster in the account would fail.

  CKV_AWS_171: >-
    aws_emr_security_configuration parses the configuration JSON but publishes
    only three computed booleans (encryption_at_rest, encryption_in_transit,
    local_disk_encryption). The S3 EncryptionMode, which is where "SSE-KMS"
    appears, is not among them.

  CKV_AWS_350: >-
    EnableEbsEncryption sits inside LocalDiskEncryptionConfiguration and the
    vendored resource collapses that whole block into a single presence boolean
    (local_disk_encryption). The EBS flag is not exposed, and a local disk
    configuration can be present with EBS encryption off.

  CKV_AWS_390: >-
    emr GetBlockPublicAccessConfiguration returns a single structure, not a
    list. The api spec's `collection` is passed to Array(page.public_send(...)),
    and Array() over an Aws::Structure yields its member VALUES, not one item.
    It is a per-region singleton, which neither schema models.

  # --- Network ACLs ---------------------------------------------------------
  CKV_AWS_229: >-
    Needs a per-entry test over cidr_block, rule_action, egress and a port
    range. aws_network_acl offers has_ingress?(cidr_block:, rule_action:) --
    a keyword-argument predicate with no port parameter -- and the schema's
    `property` is a bare method name that takes no arguments.

  CKV_AWS_230: >-
    Same as CKV_AWS_229: no argument-taking property, and no port dimension on
    the vendored predicate.

  CKV_AWS_231: >-
    Same as CKV_AWS_229.

  CKV_AWS_232: >-
    Same as CKV_AWS_229.

  CKV_AWS_352: >-
    Checkov only asks whether an ingress rule declares from_port at all, which
    is a property of the HCL, not of the deployed NACL: every deployed entry has
    a port range (or a protocol for which one is meaningless). There is nothing
    to assess on a deployed network ACL.

  # --- FSx ------------------------------------------------------------------
  CKV_AWS_178: >-
    Vacuous against the deployed state. FSx is encrypted at rest unconditionally
    and DescribeFileSystems always returns a KmsKeyId -- AWS-managed if none was
    specified -- so `kms_key_id not_empty` can never fail. Telling a
    customer-managed key from the aws/fsx AWS-managed key needs a second KMS
    lookup on the key's alias or manager, which neither schema can express.
    (DescribeFileSystems itself is fine as a `list`: no required arguments,
    collection file_systems, id file_system_id, arn resource_arn.)

  CKV_AWS_179: >-
    Same as CKV_AWS_178, for the Windows file system type.

  CKV_AWS_190: >-
    Same as CKV_AWS_178, for the Lustre file system type. DescribeFileSystems
    also has no type filter, so a per-type spec would enumerate every FSx file
    system and label them all Lustre.

  CKV_AWS_203: >-
    Same as CKV_AWS_178, for the OpenZFS file system type.

  # --- CloudFront -----------------------------------------------------------
  CKV_AWS_259: >-
    No response-headers-policy reader exists, and one cannot be declared: the
    cloudfront ListResponseHeadersPolicies response nests its items under
    DistributionList-style wrapping (ResponseHeadersPolicyList.Items), while the
    api spec's `collection` is a single top-level field name passed to
    public_send. The check also needs four fields at once (max age >= 31536000
    AND include_subdomains AND preload AND override).

  CKV_AWS_310: >-
    Origin groups are not exposed by aws_cloudfront_distribution, and the api
    route is closed for the same nesting reason as CKV_AWS_259
    (ListDistributions returns DistributionList.Items). The check also needs a
    count over group members, which no satisfies verb provides.

  CKV_AWS_374: >-
    restrictions.geo_restriction.restriction_type is not among the readers
    aws_cloudfront_distribution publishes, and the api route is closed by the
    DistributionList.Items nesting. Reachable only via a custom reader.

  # --- ELB ------------------------------------------------------------------
  CKV_AWS_127: >-
    aws_elb#certificate_id is an ARRAY of ssl_certificate_id, one per listener,
    and the check needs every listener to have one AND for it to be an ACM ARN.
    No per-element or prefix test exists in the schema.

  CKV_AWS_376: >-
    The check reads each listener's instance_protocol. aws_elb publishes
    `protocols`, which is the FRONTEND listener protocol
    (listener.protocol), not instance_protocol -- a different field with a
    different meaning. Mapping to it would assert something the check does not.
    It is also an array needing a per-element test.

  # --- SNS / ECR policies ---------------------------------------------------
  CKV_AWS_169: >-
    Requires parsing the topic's Policy attribute for internet-accessible
    actions (Checkov delegates to cloudsplaining). Policy-document analysis is
    outside both schemas.

  CKV_AWS_385: >-
    Requires walking every Allow statement's AWS principals for external account
    ARNs and checking whether each carries a condition. Policy-document
    analysis, and a cross-resource one at that.

  CKV_AWS_32: >-
    Requires parsing the ECR repository policy for internet-accessible actions.
    aws_ecr_repository_policy exposes has_statement?(criteria) and a statements
    array, but the predicate takes arguments and the array needs per-element
    logic.

  # --- MSK ------------------------------------------------------------------
  CKV_AWS_80: >-
    The check passes if ANY of broker_logs.cloudwatch_logs, .firehose or .s3 is
    enabled. A mapping names exactly one field and one verb, so a disjunction
    across three fields cannot be stated. All three booleans are published in
    the new aws_msk_cluster api spec, so this becomes a one-line mapping if the
    schema grows an any_of form.

  # --- QLDB -----------------------------------------------------------------
  CKV_AWS_170: >-
    Amazon QLDB has been retired and its service model is no longer present in
    the current AWS SDKs -- botocore 1.43.24 does not know the service, and the
    aws-sdk-qldb Ruby gem is correspondingly absent from the image. There is no
    client to enumerate ledgers with, and no vendored inspec-aws resource
    either.

  CKV_AWS_172: >-
    Same as CKV_AWS_170: no QLDB service model in the current SDKs.

  # --- ACM ------------------------------------------------------------------
  CKV_AWS_233: >-
    lifecycle.create_before_destroy is a Terraform meta-argument governing
    apply-time ordering. It has no representation in any AWS API, so there is
    nothing in the deployed state to read.

  CKV_AWS_234: >-
    ACM ListCertificates returns a CertificateSummary that carries no
    CertificateTransparencyLoggingPreference; the field is only on
    DescribeCertificate, which requires CertificateArn and so cannot be an api
    spec `list`. The existing aws_acm_certificate spec has the same ceiling.

  # --- Comprehend -----------------------------------------------------------
  CKV_AWS_267: >-
    Mappable in mechanism but vacuous in outcome, exactly as CKV_AWS_245.
    comprehend ListEntityRecognizers takes no required arguments and returns
    ModelKmsKeyId per recogniser, but the only fitting verb is not_empty, and
    the api reader rejects nil fields before asserting -- so a recogniser with
    no model KMS key leaves scope and the control renders Not Applicable instead
    of failing.

  CKV_AWS_268: >-
    Same as CKV_AWS_267, for VolumeKmsKeyId.

  # --- Misc -----------------------------------------------------------------
  CKV_AWS_192: >-
    wafv2 ListWebACLs requires Scope (REGIONAL or CLOUDFRONT), so it cannot be
    an api spec `list`. The check also needs to walk the ACL's rule statements
    for the Log4Shell message-lookup pattern, which is nested-structure logic
    rather than a field test.

  CKV_AWS_219: >-
    codepipeline ListPipelines returns only name, version, type, mode and
    timestamps. The artifact store's encryption key is on GetPipeline, which
    requires `name`, so the field is not reachable from a no-argument list.

  CKV_AWS_262: >-
    kendra ListIndices returns no encryption fields. ServerSideEncryptionConfiguration
    .KmsKeyId is on DescribeIndex, which requires Id, so it is not reachable
    from a no-argument list.

  CKV_AWS_295: >-
    The deployed state cannot answer this check even in principle. SecretKey is
    write-only in DataSync: DescribeLocationObjectStorage returns AccessKey but
    never the secret. The check is about a secret being present in the HCL,
    which is an IaC-only property. DescribeLocationObjectStorage also requires
