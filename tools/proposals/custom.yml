    mapping: 'aws_sqs_queue_policy: same enumeration and policy as CKV_AWS_72.'
  CKV_AWS_388:
    verb: not_in_list + where
    semantics: 'not_in_list already exists in matcher_for but has never been used. enumerate.where: a
      column/value filter applied to the plural resource''s FilterTable (or to the api reader''s rows)
      before the per-asset assertion runs. Checkov''s custom checks are full of ''this rule only applies
      when engine == X''; today that scoping has nowhere to live, and folding it into the assertion makes
      an inapplicable asset FAIL. Without it the choice is a false finding or a mapping that silently
      drops the condition.'
    mapping: 'aws_db_instance: engine_version not_in_list [10.11, 10.12, 10.13, 11.6, 11.7, 11.8], scoped
      by where engine == ''aurora-postgresql''. The where clause is NOT optional here: MariaDB 10.11 is
      a real, current, supported version, so an unscoped not_in_list would raise a false finding on every
      MariaDB 10.11 instance in the estate.'
  CKV_AWS_391:
