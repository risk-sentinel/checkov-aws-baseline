# Checkov CUSTOM-LOGIC AWS checks, translated to deployed-asset assertions.
#
# Scope: every check in tools/checkov_catalog.yml with kind: custom that is not
# already in tools/resource_map.yml or tools/resource_map_derived.yml. That is
# 104 checks, not the ~41 the task estimated -- the 124 custom checks in the
# catalogue minus the 20 already mapped.
#
# Every one of the 104 appears exactly once below:
#
#   mappings     6  A -- ready to merge
#   needs_verb  88  B -- the deployed assertion is expressible, the schema is not
#   unreachable 10  C -- no reader can answer it in this image
#
# Two facts about the renderer shaped almost every verdict, and neither is in
# the schema documentation:
#
#   1. `satisfies` is richer than the five documented verbs. matcher_for()
#      already implements equals, not_equals, empty, not_empty, greater_than,
#      less_than, at_least, at_most, in_list, not_in_list, includes, excludes
#      and matches. Only equals, not_empty, empty, greater_than, in_list,
#      at_least and at_most are exercised by the committed maps. The A mappings
#      below use not_equals and empty, both implemented and both unexercised, so
#      they should be exec-checked on first run.
#
#   2. A nil field means opposite things depending on the reader. render_api and
#      render() reject rows whose field is nil for every value comparison, so an
#      absent field renders Not Applicable. render_stock applies NO nil filter,
#      so an absent field is asserted on and the vendored resources answer it
#      with NullResponse -- whose `==` returns other.nil? but whose
#      method_missing returns self. So on a stock mapping `should eq true` fails
#      an absent field (correct) while `should be <= 90` PASSES it (a silent
#      false pass, and the reason CKV_AWS_304 is B rather than A below).

mappings:
  CKV_AWS_23:
    aws_security_group_rule:
      reader: api
      field: description
      satisfies: not_empty
      note: 'Checkov requires a description on the security group and on every ingress/egress block. EC2
        refuses to create a security group without a description, so the group half is always satisfied
        on a deployed estate and the rule half is the whole question. ec2:DescribeSecurityGroupRules takes
        no required arguments and returns every rule in the region as its own object with SecurityGroupRuleId,
        IsEgress and Description (confirmed in botocore ec2 SecurityGroupRule), so one enumeration answers
        both directions. Stronger than Checkov: it sees rules added in the console or by another tool,
        which no HCL scan can.'
  CKV_AWS_175:
    aws_waf_web_acl:
      reader: stock
      scope: global
      enumerate:
        resource: aws_waf_web_acls
        ids: web_acl_ids
      assert:
        resource: aws_waf_web_acl
        arg: web_acl_id
        property: rules_rule_ids
        satisfies: not_empty
      note: 'waf:GetWebACL always returns a Rules list; the vendored resource exposes it as rules_rule_ids.
        An empty list is exactly Checkov''s FAILED case. Mapped on the classic type because wafv2:ListWebACLs
        REQUIRES a Scope argument (REGIONAL or CLOUDFRONT), which the enumeration contract forbids --
        see needs_verb for the aws_wafv2_web_acl half. aws_waf_web_acls flattens its id column with style:
        :simple, so the ids are Strings, not the nested arrays that broke other plurals.'
  CKV_AWS_210:
    aws_batch_job_definition:
      reader: stock
      enumerate:
        resource: aws_batch_job_definitions
        ids: job_definition_names
      assert:
        resource: aws_batch_job_definition
        arg: job_definition_name
        property: container_properties.privileged
        satisfies: not_equals
        value: true
      note: 'botocore batch ContainerProperties carries `privileged`; the Ruby SDK snake-cases the JobDefinition
        member to container_properties, and create_resource_methods turns the nested hash into a probe,
        so container_properties.privileged is reachable. not_equals rather than equals false on purpose:
        AWS omits the member entirely when it was never set, and the vendored resource answers a missing
        member with NullResponse, whose == returns other.nil?. `should eq false` would therefore fail
        every non-privileged job definition; `should_not eq true` passes it and still fails a genuinely
        privileged one. Note describe_job_definitions returns every revision of a name and the resource
        reads job_definitions[0], so a name whose latest revision is clean can still be assessed on an
        older one -- conservative, not wrong.'
  CKV_AWS_315:
    aws_autoscaling_group:
      reader: stock
      enumerate:
        resource: aws_auto_scaling_groups
        ids: names
      assert:
        resource: aws_auto_scaling_group
        arg: auto_scaling_group_name
        property: launch_configuration_name
        satisfies: empty
      note: 'Checkov passes when either launch_template or mixed_instances_policy.launch_template is present
        -- two fields joined by OR, which the schema cannot express. The deployed equivalent is single-field
        because botocore autoscaling AutoScalingGroup carries LaunchConfigurationName, LaunchTemplate
        and MixedInstancesPolicy as mutually exclusive members: an ASG that is not on a launch configuration
        reports LaunchConfigurationName as absent. So `launch_configuration_name is empty` is the exact
        complement of Checkov''s disjunction, not an approximation. Caveat: the vendored aws_auto_scaling_group
        calls .split('','') on vpc_zone_identifier without a nil guard, so an ASG with no VPC subnets
        (EC2-Classic only) would raise.'
  CKV_AWS_317:
    aws_elasticsearch_domain:
      reader: stock
      enumerate:
        resource: aws_elasticsearchservice_domains
        ids: domain_names
      assert:
        resource: aws_elasticsearchservice_domain
        arg: domain_name
        property: log_publishing_options.AUDIT_LOGS.enabled
        satisfies: equals
        value: true
      note: 'botocore es ElasticsearchDomainStatus carries LogPublishingOptions as a map keyed by log
        type, whose values are LogPublishingOption{CloudWatchLogsLogGroupArn, Enabled}. The Ruby SDK returns
        String keys, and create_resource_methods defines a singleton method per key, so log_publishing_options.AUDIT_LOGS.enabled
        resolves. A domain that never enabled any log publishing omits the member, which answers NullResponse
        and fails `should eq true` -- the correct verdict, and stock mappings apply no nil filter, so
        absence is assessed rather than skipped. HAZARD worth an exec run: if the API ever returns LogPublishingOptions
        as an EMPTY map rather than omitting it, create_method returns the bare {} and .AUDIT_LOGS raises
        NoMethodError. That errors the control (visible) rather than passing it (silent), but it should
        be confirmed against a real domain before this is trusted.'
  CKV_AWS_350:
    aws_emr_security_configuration:
      reader: stock
      enumerate:
        resource: aws_emr_security_configurations
        ids: security_configuration_names
      assert:
        resource: aws_emr_security_configuration
        arg: security_configuration_name
        property: local_disk_encryption
        satisfies: equals
        value: true
      note: 'emr:DescribeSecurityConfiguration returns the configuration as a JSON STRING; the vendored
        resource parses it and precomputes local_disk_encryption as EncryptionConfiguration/AtRestEncryptionConfiguration/LocalDiskEncryptionConfiguration
        present and non-empty. Checkov additionally requires EnableAtRestEncryption true and reads the
        EnableEbsEncryption leaf specifically, so a configuration that declares the LocalDiskEncryptionConfiguration
        block with EnableEbsEncryption false would pass here and fail Checkov. That is the one residual
        gap; the reader exposes no finer field. Second caveat: the vendored resource indexes parsed_json[''EncryptionConfiguration'']
        without a nil guard, so a security configuration that carries only InstanceMetadataServiceConfiguration
        raises.'
api_specs:
  aws_security_group_rule:
    client: Aws::EC2::Client
    gem: aws-sdk-ec2
    list: describe_security_group_rules
    collection: security_group_rules
    id: security_group_rule_id
    arn: security_group_rule_arn
    fields:
      description: description
      group_id: group_id
      is_egress: is_egress
      ip_protocol: ip_protocol
      from_port: from_port
      to_port: to_port
      cidr_ipv4: cidr_ipv4
      cidr_ipv6: cidr_ipv6
    scope: regional
metadata:
  CKV_AWS_23:
    severity: low
    impact: 0.3
    nist:
    - CM-6
    - CM-7 (1)
    nist_r4:
    - CM-6
    - CM-7 (1)
    cci:
    - CCI-000366
    - CCI-000381
    ksi:
    - KSI-CNA-NDS
    nist_source: agent-drafted
    rationale: An undescribed firewall rule cannot be reviewed. Nobody can say whose it is, what it was
      opened for, or whether the reason still holds, so the periodic review that is supposed to close
      stale openings degrades into a guess and the rule survives every review it should not have.
  CKV_AWS_175:
    severity: medium
    impact: 0.5
    nist:
    - SC-7
    - SI-4
    nist_r4:
    - SC-7
    - SI-4
    cci:
    - CCI-001097
    - CCI-000169
    ksi:
    - KSI-CNA-NDS
    nist_source: agent-drafted
    rationale: A web ACL with no rules inspects nothing. It is attached, it appears in the architecture
      diagram and it shows up as a control in the SSP, and every request reaching the protected resource
      passes it untouched.
  CKV_AWS_210:
    severity: high
    impact: 0.7
    nist:
    - AC-6
    - CM-7
    nist_r4:
    - AC-6
    - CM-7
    cci:
    - CCI-000225
    - CCI-000381
    ksi:
    - KSI-CNA-NDS
    nist_source: agent-drafted
    rationale: A privileged container has the host's capabilities and device access. Whatever isolation
      the job was placed in stops mattering, and a compromise of the job becomes a compromise of the instance
      running it and of every other job on it.
  CKV_AWS_315:
    severity: low
    impact: 0.3
    nist:
    - CM-2
    - CM-2 (2)
    nist_r4:
    - CM-2
    - CM-2 (2)
    cci:
    - CCI-000293
    - CCI-000366
    ksi:
    - KSI-CMT-CFG
    nist_source: agent-drafted
    rationale: 'Launch configurations are immutable and undeletable-in-place: changing the baseline means
      creating a new one and re-pointing the group, so the version that instances actually launch from
      drifts from the one under change control. Launch templates version the baseline in the service itself,
      which is what makes the running fleet''s configuration auditable.'
  CKV_AWS_317:
    severity: medium
    impact: 0.5
    nist:
    - AU-2
    - AU-12
    nist_r4:
    - AU-2
    - AU-12
    cci:
    - CCI-000169
    - CCI-000172
    ksi:
    - KSI-MLA-LOG
    nist_source: agent-drafted
    rationale: Audit logs are the only record of who queried or changed the index. Without them a search-domain
      compromise leaves no evidence of what was read, so the incident cannot be scoped and the breach-notification
      decision has nothing to rest on.
  CKV_AWS_350:
    severity: medium
    impact: 0.5
    nist:
    - SC-28
    - SC-28 (1)
    nist_r4:
    - SC-28
    - SC-28 (1)
    cci:
    - CCI-001199
    - CCI-002475
    ksi:
    - KSI-SVC-CER
    nist_source: agent-drafted
    rationale: EMR spills intermediate results, shuffle data and HDFS blocks to the cluster's local disks.
      Those disks hold the same data as the source store while the job runs, so leaving them unencrypted
      keeps a plaintext copy of the dataset on every node for the life of the cluster.
fixes:
  CKV_AWS_23:
    aws_security_group_rule:
      terraform: "resource \"aws_vpc_security_group_ingress_rule\" \"app_https\" {\n  security_group_id\
        \ = aws_security_group.app.id\n  description       = \"HTTPS from the public ALB only\"\n  ip_protocol\
        \       = \"tcp\"\n  from_port         = 443\n  to_port           = 443\n  referenced_security_group_id\
        \ = aws_security_group.alb.id\n}\n"
      cli: 'aws ec2 modify-security-group-rules --group-id <sg-id> --security-group-rules SecurityGroupRuleId=<sgr-id>,SecurityGroupRule=''{Description="HTTPS
        from the public ALB only",IpProtocol=tcp,FromPort=443,ToPort=443,ReferencedGroupId=<sg-id>}''

        '
      note: modify-security-group-rules replaces the whole rule, so every field must be resupplied or
        it is reset. Read the rule with describe-security-group-rules first and echo its current values
        back with the description added.
  CKV_AWS_175:
    aws_waf_web_acl:
      terraform: "resource \"aws_wafv2_web_acl\" \"app\" {\n  name  = \"app\"\n  scope = \"REGIONAL\"\n\
        \n  default_action {\n    allow {}\n  }\n\n  rule {\n    name     = \"aws-managed-common\"\n \
        \   priority = 1\n\n    override_action {\n      none {}\n    }\n\n    statement {\n      managed_rule_group_statement\
        \ {\n        name        = \"AWSManagedRulesCommonRuleSet\"\n        vendor_name = \"AWS\"\n \
        \     }\n    }\n\n    visibility_config {\n      cloudwatch_metrics_enabled = true\n      metric_name\
        \                = \"aws-managed-common\"\n      sampled_requests_enabled   = true\n    }\n  }\n\
        \n  visibility_config {\n    cloudwatch_metrics_enabled = true\n    metric_name              \
        \  = \"app\"\n    sampled_requests_enabled   = true\n  }\n}\n"
      cli: 'aws wafv2 update-web-acl --scope REGIONAL --id <id> --name <name> --lock-token <token> --default-action
        Allow={} --visibility-config file://vis.json --rules file://rules.json

        '
      note: Classic WAF (aws_waf_web_acl) is the type this control reads because wafv2's list call requires
        a Scope argument the enumerator cannot supply. New ACLs should be wafv2; the remediation above
        is the wafv2 form.
  CKV_AWS_210:
    aws_batch_job_definition:
      terraform: "resource \"aws_batch_job_definition\" \"etl\" {\n  name = \"etl\"\n  type = \"container\"\
        \n\n  container_properties = jsonencode({\n    image      = \"${var.ecr_registry}/etl:1.4.2\"\n\
        \    jobRoleArn = aws_iam_role.etl_task.arn\n    privileged = false\n    resourceRequirements\
        \ = [\n      { type = \"VCPU\", value = \"2\" },\n      { type = \"MEMORY\", value = \"4096\"\
        \ },\n    ]\n  })\n}\n"
      cli: 'aws batch register-job-definition --job-definition-name etl --type container --container-properties
        file://container.json

        '
      note: 'Job definitions are immutable: there is no in-place fix. register-job-definition creates
        a new revision, and every job queue and submission that names the old revision must be re-pointed
        before the old one is deregistered.'
  CKV_AWS_315:
    aws_autoscaling_group:
      terraform: "resource \"aws_launch_template\" \"app\" {\n  name_prefix   = \"app-\"\n  image_id \
        \     = var.ami_id\n  instance_type = \"m6i.large\"\n\n  metadata_options {\n    http_tokens =\
        \ \"required\"\n  }\n}\n\nresource \"aws_autoscaling_group\" \"app\" {\n  name               \
        \ = \"app\"\n  min_size            = 2\n  max_size            = 6\n  desired_capacity    = 2\n\
        \  vpc_zone_identifier = var.private_subnet_ids\n\n  launch_template {\n    id      = aws_launch_template.app.id\n\
        \    version = \"$Latest\"\n  }\n}\n"
      cli: 'aws autoscaling update-auto-scaling-group --auto-scaling-group-name app --launch-template
        LaunchTemplateId=<lt-id>,Version=''$Latest''

        '
      note: The switch takes effect for instances launched after it. Existing instances keep the launch
        configuration's settings until they are replaced, so pair this with an instance refresh if the
        baseline change is the point.
  CKV_AWS_317:
    aws_elasticsearch_domain:
      terraform: "resource \"aws_cloudwatch_log_group\" \"search_audit\" {\n  name              = \"/aws/opensearch/app/audit\"\
        \n  retention_in_days = 365\n}\n\nresource \"aws_opensearch_domain\" \"app\" {\n  domain_name\
        \ = \"app\"\n\n  advanced_security_options {\n    enabled = true\n  }\n\n  log_publishing_options\
        \ {\n    log_type                 = \"AUDIT_LOGS\"\n    cloudwatch_log_group_arn = aws_cloudwatch_log_group.search_audit.arn\n\
        \    enabled                  = true\n  }\n}\n"
      cli: 'aws opensearch update-domain-config --domain-name app --log-publishing-options ''AUDIT_LOGS={CloudWatchLogsLogGroupArn=<log-group-arn>,Enabled=true}''

        '
      note: Audit logging requires fine-grained access control (advanced_security_options) to be enabled
        first; the API rejects the log-publishing change otherwise. The log group's resource policy must
        also allow es.amazonaws.com to write to it.
  CKV_AWS_350:
    aws_emr_security_configuration:
      terraform: "resource \"aws_emr_security_configuration\" \"cluster\" {\n  name = \"cluster-encryption\"\
        \n\n  configuration = jsonencode({\n    EncryptionConfiguration = {\n      EnableAtRestEncryption\
        \ = true\n      AtRestEncryptionConfiguration = {\n        S3EncryptionConfiguration = {\n   \
        \       EncryptionMode  = \"SSE-KMS\"\n          AwsKmsKey       = aws_kms_key.emr.arn\n     \
        \   }\n        LocalDiskEncryptionConfiguration = {\n          EncryptionKeyProviderType = \"\
        AwsKms\"\n          AwsKmsKey                 = aws_kms_key.emr.arn\n          EnableEbsEncryption\
        \       = true\n        }\n      }\n      EnableInTransitEncryption = true\n      InTransitEncryptionConfiguration\
        \ = {\n        TLSCertificateConfiguration = {\n          CertificateProviderType = \"PEM\"\n\
        \          S3Object                = \"s3://${var.certs_bucket}/emr-certs.zip\"\n        }\n \
        \     }\n    }\n  })\n}\n"
      cli: 'aws emr create-security-configuration --name cluster-encryption --security-configuration file://security-configuration.json

        '
      note: Security configurations are immutable and are bound at cluster creation. Fixing one means
        creating a new configuration and launching replacement clusters against it; a running cluster
        cannot be moved onto it.
needs_verb:
  CKV2_AWS_70:
    verb: policy_document(no_wildcard_principal) + parent_child(3 levels)
    semantics: 'policy_document(<sub_predicate>): fetch a resource-based or trust policy, JSON-parse it,
      and evaluate a named predicate over Statement[]. It is not a field comparison and never will be
      -- the unit of judgement is a statement, and the verdict depends on Effect, Principal, Action and
      Condition together. Sub-predicates the 17 policy checks need, in the order they pay off: no_wildcard_principal
      (Effect Allow, Principal ''*'' or Principal.AWS containing ''*'', no Condition); no_wildcard_action
      (Effect Allow and Action containing ''*''); no_admin_star_star (Allow with ''*'' in both Action
      and Resource); no_cross_account_principal_without_condition (Allow whose Principal.AWS is a specific
      arn:aws:iam:: ARN and which carries no Condition); no_account_root_principal (Allow whose Principal.AWS
      matches 12 digits or arn:aws:iam::<acct>:root); gh_oidc_sub_safe (Federated principal on token.actions.githubusercontent.com
      must carry a Condition constraining :sub to a repo:<org>/<repo> value, not ''*'', not a bare claim,
      not an abusable claim). Every one of these is a pure function of a parsed document, so they belong
      in one shared library that the mapping names by predicate.'
    mapping: 'aws_api_gateway_method: enumerate apigateway:GetRestApis -> GetResources(restApiId) -> GetMethod(restApiId,
      resourceId, httpMethod). Only OPTIONS methods with AuthorizationType NONE and ApiKeyRequired false
      are in scope, and the verdict then comes from the REST API''s endpointConfiguration.types (PRIVATE
      passes) or its resource policy. Three chained parent ids and a policy parse.'
  CKV_AWS_24:
    verb: none_of
    semantics: 'any_of / all_of / none_of(<field>, [<condition>...]): apply a conjunction of field comparisons
      to each element of a collection-valued field and roll the element verdicts up. Today the schema
      extracts ONE scalar by dotted path and compares it once; a dotted path that crosses an array returns
      the array, and no comparison in matcher_for means anything against it. The condition list must support
      the existing satisfies verbs on the element''s own sub-paths, so a condition is {path, satisfies,
      value} and the roll-up verb says whether one, all or none must match.'
    mapping: 'aws_security_group: enumerate aws_security_groups.group_ids -> ec2:DescribeSecurityGroups
      IpPermissions[], and assert none_of(ip_permissions, [from_port <= 22, to_port >= 22, ip_ranges any
      cidr_ip == ''0.0.0.0/0'' or ipv_6_ranges any cidr_ipv_6 == ''::/0'']). Port -1 in Checkov means
      ''protocol -1 with the full 0-65535 range''. The vendored aws_security_group already implements
      this as allow_in?(port:, ipv4_range:), but it is a PREDICATE TAKING ARGUMENTS and the schema''s
      `property` is a bare method name, so it is unreachable from a mapping. An alternative that needs
      no collection walk at all: enumerate ec2:DescribeSecurityGroupRules (no required args -- the same
      new spec CKV_AWS_23 uses) so each RULE is its own asset, and then the assertion is a per-asset conjunction
      rather than a collection walk.'
  CKV_AWS_25:
    verb: none_of
    semantics: 'any_of / all_of / none_of(<field>, [<condition>...]): apply a conjunction of field comparisons
      to each element of a collection-valued field and roll the element verdicts up. Today the schema
      extracts ONE scalar by dotted path and compares it once; a dotted path that crosses an array returns
      the array, and no comparison in matcher_for means anything against it. The condition list must support
      the existing satisfies verbs on the element''s own sub-paths, so a condition is {path, satisfies,
      value} and the roll-up verb says whether one, all or none must match.'
    mapping: 'aws_security_group: enumerate aws_security_groups.group_ids -> ec2:DescribeSecurityGroups
      IpPermissions[], and assert none_of(ip_permissions, [from_port <= 3389, to_port >= 3389, ip_ranges
      any cidr_ip == ''0.0.0.0/0'' or ipv_6_ranges any cidr_ipv_6 == ''::/0'']). Port -1 in Checkov means
      ''protocol -1 with the full 0-65535 range''. The vendored aws_security_group already implements
      this as allow_in?(port:, ipv4_range:), but it is a PREDICATE TAKING ARGUMENTS and the schema''s
      `property` is a bare method name, so it is unreachable from a mapping. An alternative that needs
      no collection walk at all: enumerate ec2:DescribeSecurityGroupRules (no required args -- the same
      new spec CKV_AWS_23 uses) so each RULE is its own asset, and then the assertion is a per-asset conjunction
      rather than a collection walk.'
  CKV_AWS_27:
    verb: any_of
    semantics: 'any_of / all_of / none_of(<field>, [<condition>...]): apply a conjunction of field comparisons
      to each element of a collection-valued field and roll the element verdicts up. Today the schema
      extracts ONE scalar by dotted path and compares it once; a dotted path that crosses an array returns
      the array, and no comparison in matcher_for means anything against it. The condition list must support
      the existing satisfies verbs on the element''s own sub-paths, so a condition is {path, satisfies,
      value} and the roll-up verb says whether one, all or none must match.'
    mapping: 'aws_sqs_queue: any_of -- sqs_managed_enabled == ''true'' OR kms_master_key_id present. Both
      come from GetQueueAttributes and the vendored aws_sqs_queue already exposes both, so this is purely
      the missing disjunction. A single-field mapping would be wrong in both directions: SSE-SQS is on
      by default for new queues so kms_master_key_id alone under-reports, and a CMK-encrypted queue reports
      SqsManagedSseEnabled false so that field alone would fail it.'
  CKV_AWS_31:
    verb: all_of
    semantics: 'any_of / all_of / none_of(<field>, [<condition>...]): apply a conjunction of field comparisons
      to each element of a collection-valued field and roll the element verdicts up. Today the schema
      extracts ONE scalar by dotted path and compares it once; a dotted path that crosses an array returns
      the array, and no comparison in matcher_for means anything against it. The condition list must support
      the existing satisfies verbs on the element''s own sub-paths, so a condition is {path, satisfies,
      value} and the roll-up verb says whether one, all or none must match.'
    mapping: 'aws_elasticache_replication_group: all_of -- transit_encryption_enabled true AND (auth_token_enabled
      true OR user_group_ids non-empty). The vendored resource exposes encrypted_at_transit? but not the
      auth-token half, so this needs both the verb and one more field off elasticache:DescribeReplicationGroups
      (AuthTokenEnabled, UserGroupIds -- both confirmed members). Deployed is stronger: AuthTokenEnabled
      reports whether a token is actually in force, where the HCL only shows that one was passed at create
      time.'
  CKV_AWS_32:
    verb: policy_document(no_wildcard_principal)
    semantics: 'policy_document(<sub_predicate>): fetch a resource-based or trust policy, JSON-parse it,
