      matches 12 digits or arn:aws:iam::<acct>:root); gh_oidc_sub_safe (Federated principal on token.actions.githubusercontent.com
      must carry a Condition constraining :sub to a repo:<org>/<repo> value, not ''*'', not a bare claim,
      not an abusable claim). Every one of these is a pure function of a parsed document, so they belong
      in one shared library that the mapping names by predicate. Sub-predicate: for each statement whose
      Principal.Service ends in .amazonaws.com, a Condition on AWS:SourceArn or AWS:SourceAccount must
      be present.'
