    mapping: 'aws_elb: none_of(listener_descriptions, [listener.instance_protocol in [''HTTP'',''TCP'']])
      AND all_of(listeners whose instance_protocol is HTTPS/SSL, [ssl_certificate_id present]). Two roll-ups
      over the same collection; same unreachable listener array as CKV_AWS_127.'
  CKV_AWS_380:
    verb: parent_child + date_older_than
    semantics: 'parent_child enumeration: an api_specs entry whose `list` operation requires a parent
      id, supplied by walking a second, argument-free list call first. Concretely the spec grows `parent:
      {list, collection, id}` and `list_args: {<param>: <parent id field>}`, and one row is produced per
      child with the parent id carried on the row so the control can name it. This is the single biggest
      structural gap: roughly a fifth of the remaining custom checks are blocked on it and nothing else.
      The rule that an enumeration takes no required arguments is what makes it a gap rather than an oversight
      -- the shape is expressible, it just is not expressed yet. Plus date_older_than: extract a YYYY-MM
      pair from a name and assert it is less than N months old. A regex verb cannot do this -- the threshold
      moves with the clock, so a `matches` pattern would have to be edited every quarter.'
    mapping: 'aws_transfer_server: same enumeration as CKV_AWS_357; field security_policy_name, which
      encodes its vintage (TransferSecurityPolicy-2018-11 is the AWS default and is the failing case).'
  CKV_AWS_382:
    verb: none_of
    semantics: 'any_of / all_of / none_of(<field>, [<condition>...]): apply a conjunction of field comparisons
      to each element of a collection-valued field and roll the element verdicts up. Today the schema
      extracts ONE scalar by dotted path and compares it once; a dotted path that crosses an array returns
      the array, and no comparison in matcher_for means anything against it. The condition list must support
      the existing satisfies verbs on the element''s own sub-paths, so a condition is {path, satisfies,
      value} and the roll-up verb says whether one, all or none must match.'
    mapping: 'aws_security_group: identical shape to CKV_AWS_277 but over egress rules -- none_of(ip_permissions_egress,
      [protocol ''-1'' or 0-65535 range, cidr 0.0.0.0/0]). The same DescribeSecurityGroupRules-per-rule
      alternative applies, filtered on is_egress true.'
  CKV_AWS_385:
    verb: policy_document(no_cross_account_principal_without_condition)
    semantics: 'policy_document(<sub_predicate>): fetch a resource-based or trust policy, JSON-parse it,
      and evaluate a named predicate over Statement[]. It is not a field comparison and never will be
      -- the unit of judgement is a statement, and the verdict depends on Effect, Principal, Action and
      Condition together. Sub-predicates the 17 policy checks need, in the order they pay off: no_wildcard_principal
      (Effect Allow, Principal ''*'' or Principal.AWS containing ''*'', no Condition); no_wildcard_action
      (Effect Allow and Action containing ''*''); no_admin_star_star (Allow with ''*'' in both Action
      and Resource); no_cross_account_principal_without_condition (Allow whose Principal.AWS is a specific
      arn:aws:iam:: ARN and which carries no Condition); no_account_root_principal (Allow whose Principal.AWS
      matches 12 digits or arn:aws:iam::<acct>:root); gh_oidc_sub_safe (Federated principal on token.actions.githubusercontent.com
      must carry a Condition constraining :sub to a repo:<org>/<repo> value, not ''*'', not a bare claim,
      not an abusable claim). Every one of these is a pure function of a parsed document, so they belong
      in one shared library that the mapping names by predicate.'
    mapping: 'aws_sns_topic_policy: same enumeration and policy as CKV_AWS_169; predicate is Allow whose
      Principal.AWS is a concrete arn:aws:iam:: ARN and which carries no Condition. Reading this deployed
      is materially stronger: the account number in the ARN can be compared against the organisation,
      which the HCL scan cannot do.'
