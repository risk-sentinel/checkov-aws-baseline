    aws_eks_cluster:
      terraform: |
        resource "aws_eks_cluster" "main" {
          name     = "main"
          role_arn = aws_iam_role.cluster.arn
          version  = "1.31"

          encryption_config {
            resources = ["secrets"]

            provider {
              key_arn = aws_kms_key.eks.arn
            }
          }

          vpc_config {
            subnet_ids = var.private_subnet_ids
          }
        }
      cli: |
        aws eks associate-encryption-config --cluster-name <cluster> --encryption-config '[{"resources":["secrets"],"provider":{"keyArn":"<key-arn>"}}]'
      note: >-
        Association is one-way and cannot be undone or repointed at another key,
        and existing Secrets are only re-encrypted when they are next written —
        run a rewrite of every Secret after associating.

