# batch1 — 73 Checkov AWS checks triaged against the vendored inspec-aws pack
# (vendor/8d70ebd.../libraries) and the botocore service models shipped with the
# checkov 3.3.16 venv, which is the authority used here for API field names and
# for whether a list operation takes required arguments.
#
# 16 mapped / 57 skipped. Every skip names the specific thing that blocks it.

mappings:

  # ---------------------------------------------------------------------------
  # Elasticsearch / OpenSearch
  #
  # inspec-aws ships the LEGACY es-API resources: aws_elasticsearchservice_domains
  # (ListDomainNames, no required parameters, registers :domain_names) and
  # aws_elasticsearchservice_domain(domain_name:) which calls
  # DescribeElasticsearchDomain and hands domain_status.to_h to
  # create_resource_methods. That endpoint still enumerates and describes
  # OpenSearch domains, so ONE reader answers both Terraform types.
  #
  # Nested structures become AwsResourceProbe objects, so a dotted property is a
  # real method chain and rspec-its splits it. A member AWS omits is not defined
  # at all -> method_missing -> NullResponse, whose nil?/empty? are true and
  # whose == is `other.nil?`. So an absent member fails `eq true` and fails
  # `should_not be_empty`, which is the correct direction for every mapping here.
  # ---------------------------------------------------------------------------
  CKV_AWS_5:
    aws_elasticsearch_domain: &es_encrypt_at_rest
      reader: stock
      enumerate: {resource: aws_elasticsearchservice_domains, ids: domain_names}
      assert:
        resource: aws_elasticsearchservice_domain
        arg: domain_name
        property: "encryption_at_rest_options.enabled"
        satisfies: equals
        value: true
      note: >-
        Terraform writes encrypt_at_rest { enabled }; the API returns
        EncryptionAtRestOptions.Enabled -> encryption_at_rest_options.enabled.
        Confirmed from the botocore es/DescribeElasticsearchDomain output shape.
    aws_opensearch_domain: *es_encrypt_at_rest

  CKV_AWS_6:
    aws_elasticsearch_domain: &es_n2n
      reader: stock
      enumerate: {resource: aws_elasticsearchservice_domains, ids: domain_names}
      assert:
        resource: aws_elasticsearchservice_domain
        arg: domain_name
        property: "node_to_node_encryption_options.enabled"
        satisfies: equals
        value: true
      note: >-
        Terraform writes node_to_node_encryption { enabled }; the API returns
        NodeToNodeEncryptionOptions.Enabled. STRICTER than the IaC check:
        Checkov passes a domain whose cluster_config.instance_count <= 1 without
        looking at node-to-node encryption at all. A single-node domain that has
        it disabled passes Checkov and fails here. That divergence is stated in
        the rationale so it renders into the control.
    aws_opensearch_domain: *es_n2n

  CKV_AWS_83:
    aws_elasticsearch_domain: &es_https
      reader: stock
      enumerate: {resource: aws_elasticsearchservice_domains, ids: domain_names}
      assert:
        resource: aws_elasticsearchservice_domain
        arg: domain_name
        property: "domain_endpoint_options.enforce_https"
        satisfies: equals
        value: true
      note: >-
        API member is EnforceHTTPS (all caps), which aws-sdk-ruby renders as
        enforce_https — not enforce_h_t_t_p_s.
    aws_opensearch_domain: *es_https

  CKV_AWS_228:
    aws_elasticsearch_domain: &es_tls
      reader: stock
      enumerate: {resource: aws_elasticsearchservice_domains, ids: domain_names}
      assert:
        resource: aws_elasticsearchservice_domain
        arg: domain_name
        property: "domain_endpoint_options.tls_security_policy"
        satisfies: in_list
        value: ['Policy-Min-TLS-1-2-2019-07', 'Policy-Min-TLS-1-2-PFS-2023-10']
      note: >-
        in_list, not equals, because render_stock() still carries its own inline
        matcher chain and has NOT been moved onto matcher_for()/ruby_literal():
        it emits `should eq {str(value).lower()}`, so a string value would render
        as a bare, lowercased Ruby identifier. No stock mapping in the repo
        currently passes a string, so this is a latent trap rather than a live
        bug; in_list quotes its values in both code paths and is safe either way.
    aws_opensearch_domain: *es_tls

  CKV_AWS_137:
    aws_elasticsearch_domain: &es_vpc
      reader: stock
      enumerate: {resource: aws_elasticsearchservice_domains, ids: domain_names}
      assert:
        resource: aws_elasticsearchservice_domain
        arg: domain_name
        property: "vpc_options.vpc_id"
        satisfies: not_empty
      note: >-
        API member is VPCOptions.VPCId -> vpc_options.vpc_id. A public-endpoint
        domain omits VPCOptions entirely, so the chain yields NullResponse and
        `should_not be_empty` fails, which is the intended verdict. vpc_id is a
        String, so `empty?` is String#empty? and not the probe trap described
        under CKV_AWS_84 in `skipped`.
    aws_opensearch_domain: *es_vpc

  CKV_AWS_248:
    aws_elasticsearch_domain: &es_sg
      reader: stock
      enumerate: {resource: aws_elasticsearchservice_domains, ids: domain_names}
      assert:
        resource: aws_elasticsearchservice_domain
        arg: domain_name
        property: "vpc_options.security_group_ids"
        satisfies: not_empty
      note: >-
        SecurityGroupIds is a list of strings, which AwsResourceDynamicMethods
        returns as a raw Ruby Array (scalar-element arrays are not wrapped in
        probes), so `empty?` is Array#empty? and the assertion is real.
    aws_opensearch_domain: *es_sg

  # ---------------------------------------------------------------------------
  # Lambda — aws_lambdas (ListFunctions, no required parameters, registers
  # :names) -> aws_lambda(lambda_name:) which calls GetFunction and feeds
  # configuration.to_h to create_resource_methods.
  #
  # Deliberately STOCK and not the existing `aws_lambda_function` api spec:
  # API_TEMPLATE rejects every asset whose field is nil before asserting, so an
  # api-reader `not_empty` check can never fail. Both of these are `not_empty`.
  # ---------------------------------------------------------------------------
  CKV_AWS_116:
    aws_lambda_function:
      reader: stock
      enumerate: {resource: aws_lambdas, ids: names}
      assert:
        resource: aws_lambda
        arg: lambda_name
        property: "dead_letter_config.target_arn"
        satisfies: not_empty
      note: >-
        Terraform writes dead_letter_config { target_arn }; the API member is
        DeadLetterConfig.TargetArn -> dead_letter_config.target_arn, confirmed
        from botocore lambda/GetFunction. Absent for a function with no DLQ, so
        the chain is NullResponse and the assertion fails.

  CKV_AWS_117:
    aws_lambda_function:
      reader: stock
      enumerate: {resource: aws_lambdas, ids: names}
      assert:
        resource: aws_lambda
        arg: lambda_name
        property: "vpc_config.vpc_id"
        satisfies: not_empty
      note: >-
        Checkov asserts the presence of the vpc_config BLOCK. The deployed
        equivalent is VpcConfig.VpcId, which AWS populates only when the
        function is actually attached to a VPC — a function with an empty
        vpc_config block satisfies Checkov and fails here, correctly.

  # ---------------------------------------------------------------------------
  # EKS — aws_eks_clusters (ListClusters + DescribeCluster per cluster; no
  # required parameters) -> aws_eks_cluster(cluster_name:).
  #
  # aws_eks_clusters populates its filter table from the response
  # (populate_filter_table_from_response), which pluralises every response key,
  # so the cluster hash's :name becomes the :names column. tools/lint_resource_map.py
  # will report this as statically unverifiable rather than as an error.
  # ---------------------------------------------------------------------------
  CKV_AWS_37:
    aws_eks_cluster:
      reader: stock
      enumerate: {resource: aws_eks_clusters, ids: names}
      assert:
        resource: aws_eks_cluster
        arg: cluster_name
        property: "disabled_logging_types"
        satisfies: empty
      note: >-
        Asserted as the COMPLEMENT. Checkov requires all five of api, audit,
        authenticator, controllerManager and scheduler to appear in
        enabled_cluster_log_types; the schema has no "contains all of" satisfies.
        DescribeCluster returns logging.clusterLogging with every type marked
        enabled or disabled, and aws_eks_cluster pre-computes both sides as
        attr_readers. "nothing is disabled" is exactly "all five are enabled",
        with no list to keep in sync.

  CKV_AWS_58:
    aws_eks_cluster:
      reader: stock
      enumerate: {resource: aws_eks_clusters, ids: names}
      assert:
        resource: aws_eks_cluster
        arg: cluster_name
        property: "encryption_config"
        satisfies: not_empty
      note: >-
        Checkov's expected value is the stringified list "['secrets']", which
        cannot become a Ruby literal. Asserted instead on the presence of
        encryptionConfig, which is faithful because "secrets" is the only
        resource EKS envelope encryption supports — a non-empty encryptionConfig
        IS secrets encryption. It is a list of structures, so
        AwsResourceDynamicMethods returns an Array of probes and `empty?` is
        Array#empty?; absent entirely it is NullResponse, whose empty? is true.

  # ---------------------------------------------------------------------------
  # Athena — aws_athena_work_groups (ListWorkGroups, no required parameters,
  # registers :names) -> aws_athena_work_group(work_group:) over GetWorkGroup.
  # Note the argument is `work_group`, not `work_group_name` and not `name`.
  # ---------------------------------------------------------------------------
  CKV_AWS_159:
    aws_athena_workgroup:
      reader: stock
      enumerate: {resource: aws_athena_work_groups, ids: names}
      assert:
        resource: aws_athena_work_group
        arg: work_group
        property: "configuration.result_configuration.encryption_configuration.encryption_option"
        satisfies: not_empty
      note: >-
        Terraform nests this as configuration/result_configuration/
        encryption_configuration/encryption_option and so does the API
        (Configuration.ResultConfiguration.EncryptionConfiguration.EncryptionOption),
        so the path is identical here. The leaf is a String; an unencrypted
        workgroup omits EncryptionConfiguration and the chain is NullResponse.

  CKV_AWS_82:
    aws_athena_workgroup:
      reader: stock
      enumerate: {resource: aws_athena_work_groups, ids: names}
      assert:
        resource: aws_athena_work_group
        arg: work_group
        property: "configuration.enforce_workgroup_configuration"
        satisfies: equals
        value: true

  # ---------------------------------------------------------------------------
  # Step Functions — aws_stepfunctions_state_machines (ListStateMachines,
  # registers :state_machine_arns) -> aws_stepfunctions_state_machine(
  # state_machine_arn:) over DescribeStateMachine.
  # ---------------------------------------------------------------------------
  CKV_AWS_284:
    aws_sfn_state_machine:
      reader: stock
      enumerate: {resource: aws_stepfunctions_state_machines, ids: state_machine_arns}
      assert:
        resource: aws_stepfunctions_state_machine
        arg: state_machine_arn
        property: "tracing_configuration.enabled"
        satisfies: equals
        value: true
      note: >-
        Terraform writes tracing_configuration { enabled }; the API member is
        tracingConfiguration.enabled (Step Functions models members in
        lowerCamelCase) -> tracing_configuration.enabled.
        Stock rather than the existing aws_sfn_state_machine api spec, whose
        list_state_machines summary carries only name/arn/type and cannot answer
        either of these two checks.

  CKV_AWS_285:
    aws_sfn_state_machine:
      reader: stock
      enumerate: {resource: aws_stepfunctions_state_machines, ids: state_machine_arns}
      assert:
        resource: aws_stepfunctions_state_machine
        arg: state_machine_arn
        property: "logging_configuration.include_execution_data"
        satisfies: equals
        value: true

  # ---------------------------------------------------------------------------
  # GuardDuty — aws_guardduty_detectors (ListDetectors, registers :detector_ids)
  # -> aws_guardduty_detector(detector_id:) over GetDetector.
  # ---------------------------------------------------------------------------
  CKV_AWS_238:
    aws_guardduty_detector:
      reader: stock
      enumerate: {resource: aws_guardduty_detectors, ids: detector_ids}
      assert:
        resource: aws_guardduty_detector
        arg: detector_id
        property: "enabled?"
        satisfies: equals
        value: true
      note: >-
        DIVERGENCE. Terraform's argument is the boolean `enable`; there is no
        such API field. GetDetector returns Status, a string enum
        ENABLED|DISABLED (botocore guardduty/GetDetector). aws_guardduty_detector
        defines enabled? as status.upcase == "ENABLED", so the predicate is used
        rather than the raw field — which also avoids the string-value problem
        described under CKV_AWS_228.

  # ---------------------------------------------------------------------------
  # Transit Gateway — the pack ships aws_transit_gateway(transit_gateway_id:)
  # but NO plural, so there is nothing to enumerate with. DescribeTransitGateways
  # takes no required arguments, so a declarative api spec covers it.
  # ---------------------------------------------------------------------------
  CKV_AWS_331:
    aws_ec2_transit_gateway:
      reader: api
      field: auto_accept_shared_attachments
      satisfies: in_list
      value: ['disable']
      note: >-
        The Terraform argument and the API member are both named
        auto_accept_shared_attachments / AutoAcceptSharedAttachments, but the
        API nests it under Options, hence the dotted path in the spec.
        Expressed as in_list ['disable'] rather than "not enable" because the
        schema has no not_in_list; the enum has exactly two values, so the
        allow-list form is exact rather than approximate. The field is always
        present, so API_TEMPLATE's nil-rejection does not hollow it out.

  # ---------------------------------------------------------------------------
  # MemoryDB snapshots and Bedrock agents — both api, both `not_empty`, which is
  # safe here: nil_filter_for() omits the nil-reject for not_empty/empty
  # precisely so a presence check stays failable.
  # ---------------------------------------------------------------------------
  CKV_AWS_278:
    aws_memorydb_snapshot:
      reader: api
      field: kms_key_arn
      satisfies: not_empty
      note: >-
        DIVERGENCE. Terraform's argument is kms_key_arn; the API member is
        KmsKeyId (botocore memorydb/DescribeSnapshots). The field name here is
        kept as kms_key_arn to match the check's vocabulary, and the api spec
        maps it onto the real member. MemoryDB returns KmsKeyId only when a
        customer-managed key was used — the default is an AWS-owned key that is
        not reported — so not_empty does discriminate, which is the same basis
        as the repo's existing CKV_AWS_191 ElastiCache mapping.

  CKV_AWS_383:
    aws_bedrockagent_agent:
      reader: api
      field: guardrail_identifier
      satisfies: not_empty
      note: >-
        guardrailConfiguration.guardrailIdentifier is present in the ListAgents
        SUMMARY (confirmed against the botocore bedrock-agent model), so no
        per-agent GetAgent call is needed. Caveat: no existing api spec uses
        aws-sdk-bedrockagent, so gem presence in the sparc-auditor image is
        unverified here. A missing gem raises LoadError, which aws_api_assets
        converts to an unreadable region and an empty row set — the control then
        renders Not Applicable rather than erroring, so this must be confirmed on
        a live exec, not from `check`.

api_specs:

  # NEW — no stock plural exists for transit gateways.
  aws_ec2_transit_gateway:
    gem: aws-sdk-ec2
    client: Aws::EC2::Client
    list: describe_transit_gateways      # botocore ec2/DescribeTransitGateways: no required members
    collection: transit_gateways
    id: transit_gateway_id
    arn: transit_gateway_arn
    scope: regional
    fields:
      auto_accept_shared_attachments: options.auto_accept_shared_attachments
      default_route_table_association: options.default_route_table_association
      dns_support: options.dns_support
      state: state

  # NEW — the pack ships no MemoryDB snapshot resource at all.
  aws_memorydb_snapshot:
    gem: aws-sdk-memorydb                # already required by aws_memorydb_cluster
    client: Aws::MemoryDB::Client
    list: describe_snapshots             # botocore memorydb/DescribeSnapshots: no required members
    collection: snapshots
    id: name
    arn: arn                             # API member is "ARN"; aws-sdk-ruby names it arn
    scope: regional
    fields:
      kms_key_arn: kms_key_id            # TF kms_key_arn -> API KmsKeyId
      status: status
      source: source

  # NEW — no stock resource; ListAgents is the only no-argument enumeration.
  # Gem presence in the image is UNVERIFIED; see the note on CKV_AWS_383.
  aws_bedrockagent_agent:
    gem: aws-sdk-bedrockagent
    client: Aws::BedrockAgent::Client
    list: list_agents                    # botocore bedrock-agent/ListAgents: no required members
    collection: agent_summaries          # API member agentSummaries
    id: agent_id
    scope: regional
    fields:
      guardrail_identifier: guardrail_configuration.guardrail_identifier
      guardrail_version: guardrail_configuration.guardrail_version
      agent_status: agent_status

metadata:

  CKV_AWS_5:
    severity: high
    impact: 0.7
    nist: ['SC-28', 'SC-28 (1)']
    nist_r4: ['SC-28', 'SC-28 (1)']
    cci: ['CCI-001199', 'CCI-002475']
    ksi: ['KSI-SVC-CER']
    rationale: >-
      A search domain holds a denormalised copy of whatever it indexes, which is
      usually the same records the source database encrypts. Without encryption
      at rest the domain's underlying storage and its automated snapshots are
      readable by anyone who reaches them.

  CKV_AWS_6:
    what: node-to-node encryption is enabled on any domain with more than one instance
    severity: high
    impact: 0.7
    nist: ['SC-8', 'SC-8 (1)']
    nist_r4: ['SC-8', 'SC-8 (1)']
    cci: ['CCI-002418', 'CCI-002421']
    ksi: ['KSI-SVC-CET']
    rationale: >-
      Shard replication and query fan-out cross the network in the clear unless
      node-to-node encryption is on, so a domain that terminates TLS at its
      endpoint can still be read off the wire between its own nodes. Note this
      is asserted on every domain: Checkov exempts single-instance domains,
      where the traffic is real as soon as the domain is scaled out.

  CKV_AWS_83:
    severity: high
    impact: 0.7
    nist: ['SC-8', 'SC-8 (1)']
    nist_r4: ['SC-8', 'SC-8 (1)']
    cci: ['CCI-002418', 'CCI-002421']
    ksi: ['KSI-SVC-CET']
    rationale: >-
      Without enforce_https the domain answers plaintext HTTP, so credentials
      and query results travel unprotected whenever a client omits the scheme.
      TLS becomes a client-side choice rather than a property of the service.

  CKV_AWS_228:
    severity: medium
    impact: 0.5
    nist: ['SC-8 (1)', 'SC-13']
    nist_r4: ['SC-8 (1)', 'SC-13']
    cci: ['CCI-002421', 'CCI-002450']
    ksi: ['KSI-SVC-CET']
    rationale: >-
      The older endpoint policy still negotiates TLS 1.0 and 1.1. Enforcing HTTPS
      while accepting a deprecated protocol version means the connection is
      encrypted with a cipher suite the organisation has already retired
      everywhere else.

  CKV_AWS_137:
    severity: high
    impact: 0.7
    nist: ['SC-7', 'SC-7 (5)']
    nist_r4: ['SC-7', 'SC-7 (5)']
    cci: ['CCI-001097', 'CCI-002080']
    ksi: ['KSI-CNA-NDS']
    rationale: >-
      A domain outside a VPC has a public endpoint whose only barrier is its
      access policy, so a mistake in that document exposes the index to the
      internet. Inside a VPC the security group and route table bound reachability
      before the policy is consulted at all.

  CKV_AWS_248:
    severity: medium
    impact: 0.5
    nist: ['SC-7', 'SC-7 (5)', 'CM-7']
    nist_r4: ['SC-7', 'SC-7 (5)', 'CM-7']
    cci: ['CCI-001097', 'CCI-000382']
    ksi: ['KSI-CNA-NDS']
    rationale: >-
      A domain placed in a VPC without an explicit security group inherits the
      VPC default group, which permits all traffic between anything else that
      also inherited it. The domain then has no ingress boundary of its own.

  CKV_AWS_116:
    severity: low
    impact: 0.3
    nist: ['SI-11']
    nist_r4: ['SI-11']
    cci: ['CCI-001312']
    ksi: ['KSI-RPL-RCY']
    rationale: >-
      An asynchronous invocation that exhausts its retries is discarded silently
      when there is no dead-letter target. The work is lost and nothing records
      that it existed, so the failure is invisible to both operations and audit.

  CKV_AWS_117:
    severity: medium
    impact: 0.5
    nist: ['SC-7', 'SC-7 (5)']
    nist_r4: ['SC-7', 'SC-7 (5)']
    cci: ['CCI-001097', 'CCI-002080']
    ksi: ['KSI-CNA-NDS']
    rationale: >-
      A function outside a VPC reaches the internet directly and is not subject
      to the account's egress controls, flow logs or endpoint policies, so its
      outbound traffic cannot be observed or constrained alongside everything else.

  CKV_AWS_37:
    what: enabled_cluster_log_types contains all of api, audit, authenticator, controllerManager and scheduler
    severity: medium
    impact: 0.5
    nist: ['AU-2', 'AU-12']
    nist_r4: ['AU-2', 'AU-12']
    cci: ['CCI-000169', 'CCI-000172']
    ksi: ['KSI-MLA-LOG']
    rationale: >-
      The control plane is where authentication decisions and API authorisations
      are made, and the audit and authenticator logs are the only record of them.
      A cluster with partial logging cannot answer who called what after the fact.

  CKV_AWS_58:
    severity: high
    impact: 0.7
    nist: ['SC-28', 'SC-28 (1)']
    nist_r4: ['SC-28', 'SC-28 (1)']
    cci: ['CCI-001199', 'CCI-002475']
    ksi: ['KSI-SVC-CER']
    rationale: >-
      Without envelope encryption a Kubernetes Secret is stored in etcd as base64,
      which is an encoding and not a protection. Anyone who can read the cluster's
      backing store, or restore it from a backup, reads every credential in it.

  CKV_AWS_159:
    severity: high
    impact: 0.7
    nist: ['SC-28', 'SC-28 (1)']
    nist_r4: ['SC-28', 'SC-28 (1)']
    cci: ['CCI-001199', 'CCI-002475']
    ksi: ['KSI-SVC-CER']
    rationale: >-
      Query results are written to S3 as ordinary objects, and they contain the
      rows the query selected. An unencrypted result location leaves a growing
      archive of extracted data protected only by the bucket's own settings.

  CKV_AWS_82:
    severity: medium
    impact: 0.5
    nist: ['CM-7', 'AC-3']
    nist_r4: ['CM-7', 'AC-3']
    cci: ['CCI-000382', 'CCI-000213']
    ksi: ['KSI-CMT-CFG']
    rationale: >-
      Unless the workgroup configuration is enforced, a client can override the
      result location and the encryption settings per query, so the encryption
      the workgroup declares is advisory rather than binding.

  CKV_AWS_284:
    severity: low
    impact: 0.3
    nist: ['AU-2', 'AU-12']
    nist_r4: ['AU-2', 'AU-12']
    cci: ['CCI-000169', 'CCI-000172']
    ksi: ['KSI-MLA-LOG']
    rationale: >-
      Without tracing, a failed execution shows which state errored but not what
      the downstream call did, so the boundary between the workflow's fault and a
      dependency's fault cannot be established from the record.

  CKV_AWS_285:
    severity: medium
    impact: 0.5
    nist: ['AU-2', 'AU-3', 'AU-12']
    nist_r4: ['AU-2', 'AU-3', 'AU-12']
    cci: ['CCI-000130', 'CCI-000169']
    ksi: ['KSI-MLA-LOG']
    rationale: >-
      Execution history is retained for ninety days inside Step Functions and
      then gone. Logging with execution data is what puts the input and output of
      each state into a log group that retention policy and alerting can reach.

  CKV_AWS_238:
    severity: medium
    impact: 0.5
    nist: ['SI-4', 'RA-5']
    nist_r4: ['SI-4', 'RA-5']
    cci: ['CCI-002664']
    ksi: ['KSI-MLA-OSM']
    rationale: >-
      A detector that exists but is suspended keeps its configuration and its
      findings history while analysing nothing, so the account looks monitored in
      an inventory and is not. This is the deployed state Terraform cannot show.

  CKV_AWS_331:
    severity: high
    impact: 0.7
    nist: ['AC-3', 'SC-7', 'CM-7']
    nist_r4: ['AC-3', 'SC-7', 'CM-7']
    cci: ['CCI-000213', 'CCI-001097']
    ksi: ['KSI-CNA-NDS']
    rationale: >-
      With auto-accept on, any account the gateway is shared with can attach a VPC
      and reach everything else on the gateway without anyone in this account
      approving it. Attachment stops being a reviewed decision.

  CKV_AWS_278:
    severity: medium
    impact: 0.5
    nist: ['SC-28', 'SC-28 (1)']
    nist_r4: ['SC-28', 'SC-28 (1)']
    cci: ['CCI-001199', 'CCI-002475']
    ksi: ['KSI-SVC-KMG']
    rationale: >-
      A snapshot outlives the cluster it came from and holds the same data. Under
      an AWS-owned key the account cannot audit who used the key, cannot revoke
      it, and cannot prove the snapshot became unreadable when it was retired.

  CKV_AWS_383:
    severity: medium
    impact: 0.5
    nist: ['SI-4', 'AC-4', 'SC-7']
    nist_r4: ['SI-4', 'AC-4', 'SC-7']
    cci: ['CCI-002664', 'CCI-001097']
    ksi: ['KSI-SVC-VRI']
    rationale: >-
      A guardrail is the only place the agent's input and output filtering is
      enforced. Without one attached, prompt content and model responses pass
      through unfiltered no matter what the application layer intends.

