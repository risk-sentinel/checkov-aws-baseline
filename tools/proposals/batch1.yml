skipped:

  # --- IAM account-level singletons -----------------------------------------
  # GetAccountPasswordPolicy returns ONE policy for the account. inspec-aws ships
  # aws_iam_password_policy with no plural, because there is nothing to
  # enumerate. Schema A requires `enumerate: {resource, ids}` and STOCK_TEMPLATE
  # renders `ids = <plural>.<column>`, so there is no shape for a singleton.
  # These are CIS-standard checks and worth a third reader shape (a singleton
  # variant with no enumerate); they are not blocked by anything on the AWS side.
  #
  # Two live traps for whoever builds that reader: max_password_age_in_days RAISES
  # "this policy does not expire passwords" when max_password_age is 0, and
  # number_of_passwords_to_remember RAISES when password_reuse_prevention is nil.
  # Both must be guarded by expire_passwords? / prevent_password_reuse? first.
  CKV_AWS_9: >-
    aws_iam_account_password_policy is an account singleton (GetAccountPasswordPolicy).
    inspec-aws ships aws_iam_password_policy with no plural, so schema A's
    `enumerate` has no resource to name. Needs a singleton reader shape.
  CKV_AWS_10: >-
    Same singleton problem as CKV_AWS_9. The field is minimum_password_length and
    the assertion would be `>= 14`, which the schema also lacks — greater_than is
    strict, so 14 exactly would fail.
  CKV_AWS_11: Same singleton problem as CKV_AWS_9 (require_lowercase_characters?).
  CKV_AWS_12: Same singleton problem as CKV_AWS_9 (require_numbers?).
  CKV_AWS_13: >-
    Same singleton problem as CKV_AWS_9. Additionally number_of_passwords_to_remember
    RAISES rather than returning nil when reuse prevention is unset.
  CKV_AWS_14: Same singleton problem as CKV_AWS_9 (require_symbols?).
  CKV_AWS_15: Same singleton problem as CKV_AWS_9 (require_uppercase_characters?).
  CKV_AWS_348: >-
    The root user is a singleton read through GetAccountSummary
    (AccountAccessKeysPresent); inspec-aws ships aws_iam_root_user with no plural.
    ListAccessKeys never returns root's keys, so aws_iam_access_keys.usernames
    cannot answer it either.

  # --- IAM policy documents and relationships (pitfall 7) --------------------
  CKV_AWS_40: >-
    A relationship check: it asks whether a policy is attached to a USER rather
    than to a group or role. That is an edge between two resources, not a field
    on one, and neither schema expresses an edge.
  CKV_AWS_60: >-
    Parses the role's assume_role_policy document to see which principals may
    assume it. Policy-document analysis; not expressible as a field assertion.
  CKV_AWS_61: >-
    Parses the trust policy for a wildcarded AWS principal. Policy-document
    analysis.
  CKV_AWS_62: >-
    Parses inline and managed policy documents for Action "*" with Resource "*".
    Policy-document analysis, across five Terraform types.
  CKV_AWS_63: >-
    Parses policy documents for a statement whose Action is "*".
    Policy-document analysis.
  CKV_AWS_274: >-
    Needs the identity of the ATTACHED policy (AdministratorAccess) for each
    attachment, which is an edge from a role/user/group to a policy ARN.
    Relationship check.
  CKV_AWS_273: >-
    scan_resource_conf returns FAILED unconditionally: the assertion is "no IAM
    users exist at all". Schema A renders one describe per enumerated id, so it
    cannot express an empty-collection claim — with zero users it would render
    zero examples and skip.
  CKV_AWS_393: >-
    Parses the GitHub Actions OIDC trust policy for unsafe claims and claim
    ordering. Policy-document analysis.

  # --- Elasticsearch / OpenSearch, remainder ---------------------------------
  CKV_AWS_84: >-
    LogPublishingOptions is a MAP. AwsResourceDynamicMethods wraps a non-empty
    Hash in an AwsResourceProbe, and AwsResourceProbe does not define empty? — its
    method_missing returns a NullResponse INSTANCE, which is truthy. So be_empty
    reports true for a fully-configured domain and `not_empty` would fail exactly
    the domains that comply. There is no scalar field on the domain that answers
    "logging is on", so this needs a reader that inspects the map.
  CKV_AWS_317: >-
    Needs log_publishing_options['AUDIT_LOGS'].enabled. Beyond the probe/empty?
    problem above, create_method returns the RAW Hash (not a probe) when the map
    is empty, so `.AUDIT_LOGS` on a domain with no log publishing raises
    NoMethodError — a control error, not a failure.
  CKV_AWS_247: >-
    Cannot discriminate a CMK. DescribeElasticsearchDomain returns
    EncryptionAtRestOptions.KmsKeyId for the AWS-managed aws/es key as well, so
    `not_empty` would restate CKV_AWS_5 (encryption is on) while claiming to
    verify customer-managed keys. Needs a key-ownership lookup the schema has no
    room for.
  CKV_AWS_318: >-
    A conjunction: dedicated_master_count >= 3 AND zone_awareness_enabled. The
    schema asserts one property, and asserting only the master count would PASS a
    three-master single-AZ domain that Checkov fails.

  # --- Lambda ----------------------------------------------------------------
  CKV_AWS_115: >-
    Reserved concurrency is not in the function configuration. GetFunction returns
    it under a separate Concurrency member that aws_lambda discards (it keeps
    details.configuration only), and ListFunctions omits it entirely; the real
    source is GetFunctionConcurrency, one call per function.
  CKV_AWS_258: >-
    aws_lambda_function_url has no stock resource, and lambda:ListFunctionUrlConfigs
    requires FunctionName (confirmed in the botocore model), so it cannot
    enumerate an account.
  CKV_AWS_301: >-
    aws_lambda_permissions requires function_name and therefore cannot enumerate
    an account. The permission set is also a resource policy, read per function.
  CKV_AWS_363: >-
    A forbidden-list check (25 deprecated runtimes). The schema has no
    not_in_list, and inverting it into an allow-list would mean inventing and
    then maintaining the set of currently-supported runtimes, which drifts every
    time AWS adds one.
  CKV_AWS_364: >-
    Same enumeration block as CKV_AWS_301, plus a conjunction (service principal
    AND source_arn-or-source_account).
  CKV_AWS_45: >-
    Entropy and pattern matching over environment-variable VALUES. Not a field
    assertion, and GetFunctionConfiguration returns the variables only to callers
    with lambda:GetFunctionConfiguration on the function.

  # --- CodeBuild -------------------------------------------------------------
  # One blocker covers all five: no stock resource, and codebuild:ListProjects
  # returns a list of NAMES only (botocore codebuild/ListProjects: projects is a
  # list of string). Everything these checks read lives in BatchGetProjects,
  # which requires the names argument, so no single no-argument list call can
  # feed an api spec.
  CKV_AWS_78: >-
    No stock aws_codebuild_project resource; ListProjects returns only names and
    the artifacts block is in BatchGetProjects, which requires `names`.
  CKV_AWS_147: Same as CKV_AWS_78 — artifacts/encryption_key needs BatchGetProjects.
  CKV_AWS_311: Same as CKV_AWS_78 — logs_config.s3_logs needs BatchGetProjects.
  CKV_AWS_314: Same as CKV_AWS_78 — logs_config needs BatchGetProjects.
  CKV_AWS_316: Same as CKV_AWS_78 — environment.privileged_mode needs BatchGetProjects.

  # --- EKS, remainder --------------------------------------------------------
  CKV_AWS_38: >-
    A disjunction: PASS if endpoint_public_access is false OR public_access_cidrs
    excludes 0.0.0.0/0. The schema has no not-includes matcher over a list, and
    asserting endpoint_public_access == false instead would fail every cluster
    whose public endpoint is correctly restricted to a corporate CIDR — a
    different rule (CKV_AWS_39) wearing this one's id.
  CKV_AWS_100: >-
    aws_eks_node_group has no resource in the vendored pack at all, and
    eks:ListNodegroups requires clusterName, so no no-argument list call
    enumerates node groups.

  # --- AMI -------------------------------------------------------------------
  CKV_AWS_204: >-
    aws_amis requires the `all_amis` parameter and so cannot enumerate. The
    underlying ec2:DescribeImages takes no required arguments but without an
    Owners filter returns every public AMI in the region, which the api spec
    schema has no way to constrain.
  CKV_AWS_205: >-
    aws_ami_launch_permission has no deployed identity of its own; launch
    permissions are read with DescribeImageAttribute(ImageId, Attribute), one
    call per AMI, on top of the enumeration problem above.
  CKV_AWS_235: >-
    aws_ami_copy has no deployed identity: a copied AMI is indistinguishable from
    any other AMI in DescribeImages, so there is nothing to scope the check to —
    plus the aws_amis enumeration blocker.
  CKV_AWS_236: Same as CKV_AWS_235 — a copy is not identifiable in the deployed state.

  # --- SSM -------------------------------------------------------------------
  CKV_AWS_112: >-
    Parses the JSON/YAML CONTENT of the SSM-SessionManagerRunShell document for
    inputs.kmsKeyId. DescribeDocument returns metadata only; the content comes
    from GetDocument, and the assertion is a parse of that document rather than a
    field.
  CKV_AWS_113: >-
    Same document-content parse as CKV_AWS_112, and a disjunction over four
    inputs (s3BucketName+s3EncryptionEnabled OR cloudWatchLogGroupName+
    cloudWatchEncryptionEnabled).
  CKV_AWS_303: >-
    Document sharing is read with DescribeDocumentPermission(Name,
    PermissionType), a per-document call with required arguments that
    aws_ssm_document does not make and neither schema can issue.

  # --- Athena ----------------------------------------------------------------
  CKV_AWS_77: >-
    aws_athena_database has no stock resource, and athena:ListDatabases requires
    CatalogName, so there is no account-wide enumeration. The Glue catalog is the
    real backing store and its per-database encryption is a separate shape.

  # --- DMS -------------------------------------------------------------------
  # All three fail the same way: the DMS API returns a KmsKeyId whether or not a
  # customer key was chosen, because the field defaults to the DMS service key.
  # `not_empty` on it would pass every endpoint and instance in the account while
  # reporting that CMK use had been verified.
  CKV_AWS_212: >-
    Terraform's kms_key_arn maps to the API's KmsKeyId (confirmed by
    aws_dms_replication_instances' register_column(:kms_key_ids, field:
    :kms_key_id)), but DMS populates it with the service default key when none is
    given, so not_empty cannot discriminate a CMK and would always pass.
  CKV_AWS_296: >-
    Same non-discriminating KmsKeyId as CKV_AWS_212, plus a branch on
    engine_name == "s3" that reads s3_settings.server_side_encryption_kms_key_id
    instead — a conditional the schema cannot express.
  CKV_AWS_298: >-
    aws_dms_s3_endpoint has no stock resource of its own; it is the same
    DescribeEndpoints row with engine_name "s3", and selecting those rows
    requires a filter the schema has no field for.

  # --- EBS / ElastiCache / load balancers -----------------------------------
  CKV_AWS_106: >-
    ec2:GetEbsEncryptionByDefault takes no arguments but returns a single boolean
    for the account+region, not a collection. The api spec schema requires
    collection/id, and the stock schema requires a plural to enumerate; this is a
    third shape (an account-scoped scalar).
  CKV_AWS_183: >-
    aws_ebs_snapshot_copy has no deployed identity — DescribeSnapshots does not
    distinguish a copied snapshot from an original — so there is nothing to scope
    the check to.
  CKV_AWS_196: >-
    scan_resource_conf returns FAILED unconditionally: the rule is "no
    aws_elasticache_security_group exists". Like CKV_AWS_273 this is an
    empty-collection claim, which the per-asset render shape cannot make. (These
    are EC2-Classic only, which AWS has retired.)
  CKV_AWS_31: >-
    A conjunction: transit_encryption_enabled AND (auth_token OR user_group_ids).
    Asserting only transit_encryption_enabled would pass a group with encryption
    but no authentication, which is precisely the state the rule exists to catch.
  CKV_AWS_261: >-
    Conditional on protocol: Checkov returns UNKNOWN for anything that is not
    HTTP/HTTPS. Asserting health_check_path on every target group would fail
    every TCP, TLS and UDP group, where HealthCheckPath is legitimately absent.
  CKV_AWS_328: >-
    desync_mitigation_mode is a load-balancer ATTRIBUTE
    (routing.http.desync_mitigation_mode), returned by
    DescribeLoadBalancerAttributes(LoadBalancerArn). aws_alb fetches it only
    through the private alb_attributes method and exposes no reader for it, so
    there is no property to name.

  # --- Bedrock / Timestream / MemoryDB / Batch / Secrets / Global Accelerator -
  CKV_AWS_373: >-
    customerEncryptionKeyArn is not in the ListAgents summary (confirmed against
    the botocore bedrock-agent model); it is only in GetAgent, which requires
    agentId. No no-argument list call carries the field.
  CKV_AWS_160: >-
    timestream:ListDatabases returns KmsKeyId for every database, including ones
    using the AWS-managed default key, so not_empty cannot discriminate a CMK.
    Same class as the DMS checks.
  CKV_AWS_210: >-
    containerProperties.privileged is optional in the DescribeJobDefinitions
    response, and an omitted member becomes NullResponse, which is not == false.
    `equals false` would therefore fail every job definition that never set
    privileged at all — the compliant majority. A negative assertion needs a
    satisfies that treats absent as passing.
  CKV_AWS_304: >-
    The assertion is rotation_rules.automatically_after_days <= 90 (or a rate()
    schedule under 90 days). The schema has greater_than but no less_than, and
    the schedule_expression branch needs parsing.
  CKV_AWS_75: >-
    Flow logs are an accelerator ATTRIBUTE, read with
    DescribeAcceleratorAttributes(AcceleratorArn) — a per-accelerator call.
    ListAccelerators, the only no-argument list call, does not carry the field.
