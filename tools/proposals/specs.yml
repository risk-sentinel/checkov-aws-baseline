# Drafted 2026-08-31 against tools/checkov_catalog.yml, tools/resource_map.yml,
# tools/resource_map_derived.yml and tools/api_specs.yml as they stood at
# 05:47 (resource_map.yml was being edited by a parallel session mid-pass).
#
# Population considered: every check NOT in either resource map, whose kind is
# `value` or `negative`, and whose Terraform type has no stock inspec-aws
# resource (89 checks at the time of the last re-scan).
#
# Every field below was read out of
# ~/.venvs/checkov-3.3.16/lib/python3.12/site-packages/botocore/data/<svc>/*/service-2.json
# in this session. Nothing is from memory.
#
# NOTE on `satisfies`: two entries use `not_equals` and `not_in_list`, which are
# outside the five-value vocabulary given in the task but ARE implemented in
# tools/render_controls.py:matcher_for (lines 626-630). A negative check with a
# forbidden value cannot be expressed with equals/in_list without inverting the
# check's meaning, so the renderer's real vocabulary is used and flagged here.

api_specs:

  # CKV_AWS_252. DescribeTrails takes no required arguments (botocore
  # cloudtrail/DescribeTrailsRequest required=[]), returns trailList as a list of
  # Trail STRUCTURES, and SnsTopicARN / SnsTopicName are both members of Trail on
  # that list response — no per-trail GetTrail is needed.
  #
  # Caveat worth carrying into the note: includeShadowTrails defaults to true, so
  # a multi-region trail is returned once per region and produces one row per
  # region with the same id. The rows all answer the same way; the count is
  # inflated, the verdict is not.
  #
  # This type has no stock resource under the Terraform name, but inspec-aws DOES
  # ship aws_cloudtrail_trail/aws_cloudtrail_trails under a different name. That
  # singular exposes kms_key_id, s3_bucket_name, cloud_watch_logs_* and friends
  # via attr_reader — but NOT sns_topic_arn, which is why this goes through the
  # API reader rather than a stock mapping.
  aws_cloudtrail:
    gem: aws-sdk-cloudtrail
    client: Aws::CloudTrail::Client
    list: describe_trails
    collection: trail_list
    id: name
    arn: trail_arn
    scope: regional
    fields:
      sns_topic_arn: sns_topic_arn          # botocore Trail.SnsTopicARN
      sns_topic_name: sns_topic_name        # botocore Trail.SnsTopicName (deprecated by AWS)
      kms_key_id: kms_key_id
      is_multi_region_trail: is_multi_region_trail
      log_file_validation_enabled: log_file_validation_enabled

  # CKV_AWS_298. DescribeEndpoints takes no required arguments (botocore
  # dms/DescribeEndpointsMessage required=[]) and returns Endpoints as a list of
  # Endpoint structures. S3Settings is a member of Endpoint on the list response.
  #
  # DescribeEndpoints returns EVERY endpoint, not only S3 ones. That is safe here
  # because a non-S3 endpoint omits S3Settings entirely, dig_path yields nil, and
  # render_controls' nil filter drops nil rows for any satisfies other than
  # not_empty/empty. The mapping below deliberately asserts encryption_mode
  # (always populated on a real S3 endpoint) rather than the KMS key id (nil when
  # the endpoint uses SSE_S3, which the nil filter would silently drop —
  # silence-as-success).
  aws_dms_s3_endpoint:
    gem: aws-sdk-databasemigrationservice
    client: Aws::DatabaseMigrationService::Client
    list: describe_endpoints
    collection: endpoints
    id: endpoint_identifier
    arn: endpoint_arn
    scope: regional
    fields:
      engine_name: engine_name                                        # botocore Endpoint.EngineName
      endpoint_type: endpoint_type                                    # botocore Endpoint.EndpointType
      s3_encryption_mode: s3_settings.encryption_mode                 # botocore S3Settings.EncryptionMode
      s3_kms_key_arn: s3_settings.server_side_encryption_kms_key_id   # botocore S3Settings.ServerSideEncryptionKmsKeyId

  # CKV_AWS_329 and CKV_AWS_330. DescribeAccessPoints takes no required arguments
  # (botocore efs/DescribeAccessPointsRequest required=[]; AccessPointId and
  # FileSystemId are optional filters) and returns AccessPoints as a list of
  # AccessPointDescription structures. PosixUser{Uid,Gid,SecondaryGids} and
  # RootDirectory{Path,CreationInfo} are both members of that list item.
  aws_efs_access_point:
    gem: aws-sdk-efs
    client: Aws::EFS::Client
    list: describe_access_points
    collection: access_points
    id: access_point_id
    arn: access_point_arn
    scope: regional
    fields:
      file_system_id: file_system_id                  # botocore AccessPointDescription.FileSystemId
      life_cycle_state: life_cycle_state              # botocore AccessPointDescription.LifeCycleState
      root_directory_path: root_directory.path        # botocore RootDirectory.Path
      posix_user_uid: posix_user.uid                  # botocore PosixUser.Uid
      posix_user_gid: posix_user.gid                  # botocore PosixUser.Gid

mappings:

  # --- new specs -----------------------------------------------------------

  CKV_AWS_252:
    aws_cloudtrail:
      reader: api
      field: sns_topic_arn
      satisfies: not_empty
      note: >-
        Checkov reads the Terraform argument `sns_topic_name`; the API member that
        actually resolves is Trail.SnsTopicARN (Trail.SnsTopicName is present but
        AWS documents it as deprecated and it is not reliably populated), confirmed
        from botocore cloudtrail/DescribeTrails. TF-vs-API divergence: name -> ARN.
        `not_empty` is correct here rather than merely convenient — a trail with no
        SNS topic returns no SnsTopicARN at all, and nil is exactly the failing
        state, which is why not_empty (which does NOT nil-filter) is used.
        DescribeTrails defaults to includeShadowTrails=true, so a multi-region
        trail yields one row per region; the rows agree, the count is inflated.

  CKV_AWS_298:
    aws_dms_s3_endpoint:
      reader: api
      field: s3_encryption_mode
      satisfies: equals
      value: "SSE_KMS"
      note: >-
        TF-vs-API divergence: Checkov inspects `kms_key_arn`; the API member is
        S3Settings.ServerSideEncryptionKmsKeyId (botocore dms/S3Settings), and it
        is nested one level below the endpoint, not on it. The mapping deliberately
        does NOT assert that field. It is nil on an SSE_S3 endpoint, and for any
        satisfies other than not_empty/empty render_controls drops nil rows, so
        asserting it would make the exact failing population disappear rather than
        fail. S3Settings.EncryptionMode is populated on every S3 endpoint, and DMS
        requires ServerSideEncryptionKmsKeyId whenever EncryptionMode is SSE_KMS,
        so SSE_KMS is equivalent to "a KMS key is in use". Non-S3 endpoints return
        no S3Settings, so they nil-out and fall out of scope, which is right —
        the Checkov check only applies to aws_dms_s3_endpoint.

  CKV_AWS_329:
    aws_efs_access_point:
      reader: api
      field: root_directory_path
      satisfies: not_equals
      value: "/"
      note: >-
        Checkov is a negative check with a single forbidden value ("/") and
        missing_attribute_result=FAILED. `not_equals` is used because inverting it
        into equals/in_list would require enumerating every acceptable path.
        EFS always returns RootDirectory.Path — an access point created without a
        root_directory block reports "/" rather than omitting the member — so the
        nil filter that not_equals triggers should never fire in practice. If it
        ever does, the row is dropped rather than failed; that is the one soft spot
        in this mapping and it is stated rather than hidden.

  CKV_AWS_330:
    aws_efs_access_point:
      reader: api
      field: posix_user_gid
      satisfies: not_empty
      note: >-
        Checkov inspects posix_user/[0]/gid with expected ANY_VALUE. PosixUser is
        omitted from AccessPointDescription entirely when no user identity is
        enforced, so the field is nil and nil is the failing state — which is why
        not_empty (no nil filtering) is the right satisfies. Gid is a Long, and the
        not_empty matcher guards with respond_to?(:empty?), so an Integer 0 passes
        as "set" rather than raising or reading as unset.

  # --- specs already in tools/api_specs.yml; mapping only ------------------
  #
  # These four need no api_specs change: the field they assert is already
  # declared. Flagging one thing the reviewer should settle first — aws-sdk-docdb,
  # aws-sdk-neptune, aws-sdk-dax, aws-sdk-route53domains and aws-sdk-bedrockagent
  # all appear in tools/api_specs.yml but are NOT in the runtime gem list I was
  # given. Either the list is incomplete or those five specs are already dead at
  # exec. These mappings do not make that worse (aws_api_assets#client raises
  # ArgumentError on LoadError, which rows_for records as an unreadable region),
  # but they do depend on the answer.

  CKV_AWS_182:
    aws_docdb_cluster:
      reader: api
      field: kms_key_id
      satisfies: not_empty
      note: >-
        Confirmed against botocore docdb/DescribeDBClusters -> DBCluster.KmsKeyId
        (no TF/API divergence; DescribeDBClusters takes no required arguments).
        DocumentDB returns KmsKeyId only when StorageEncrypted is true, so
        not_empty does discriminate. It does NOT separate a customer-managed key
        from the AWS-managed aws/rds key — and neither does Checkov, whose whole
        assertion is that kms_key_id is set. Same basis as the shipped
        CKV_AWS_266 and CKV_AWS_278 mappings.

  CKV_AWS_280:
    aws_neptune_cluster_snapshot:
      reader: api
      field: kms_key_id
      satisfies: not_empty
      note: >-
        Confirmed against botocore neptune/DescribeDBClusterSnapshots ->
        DBClusterSnapshot.KmsKeyId (no required arguments on the list call).
        KmsKeyId is returned only for an encrypted snapshot, so not_empty is the
        encrypted/not-encrypted discriminator, on the same basis as CKV_AWS_266.

  CKV_AWS_347:
    aws_neptune_cluster:
      reader: api
      field: kms_key_id
      satisfies: not_empty
      note: >-
        TF-vs-API divergence: Checkov inspects `kms_key_arn`; the API member is
        DBCluster.KmsKeyId (botocore neptune/DescribeDBClusters). The spec already
        declares it under the API name. KmsKeyId is present only when
        StorageEncrypted is true, so not_empty discriminates.

  CKV_AWS_363:
    aws_lambda_function:
      reader: api
      field: runtime
      satisfies: not_in_list
      value:
        - dotnetcore3.1
        - nodejs12.x
        - python3.6
        - python2.7
        - dotnet5.0
        - dotnetcore2.1
        - ruby2.5
        - nodejs10.x
        - nodejs8.10
        - nodejs4.3
        - nodejs6.10
        - dotnetcore1.0
        - dotnetcore2.0
        - nodejs4.3-edge
        - nodejs
        - java8
        - python3.7
        - go1.x
        - provided
        - ruby2.7
        - nodejs14.x
        - nodejs16.x
        - python3.9
        - dotnet7
        - dotnet6
      note: >-
        Runtime IS on the ListFunctions response (botocore lambda/FunctionList ->
        FunctionConfiguration.Runtime), so no GetFunction is needed. The forbidden
        list is copied verbatim from checkov 3.3.16
        DeprecatedLambdaRuntime.get_forbidden_values(); nodejs18.x and
        provided.al2 are commented out in that source and are therefore NOT
        included. `not_in_list` is outside the five-value vocabulary in the brief
        but is implemented in matcher_for. Container-image functions declare no
        Runtime member, so they nil-out and are dropped as out of scope, which
        matches Checkov (it only inspects a declared `runtime`).

metadata:

  CKV_AWS_182:
    severity: high
    impact: 0.7
    nist: [SC-28, "SC-28 (1)"]
    nist_r4: [SC-28, "SC-28 (1)"]
    cci: [CCI-001199, CCI-002475]
    ksi: [KSI-SVC-CER, KSI-SVC-KMG]
    nist_source: agent-drafted
    rationale: >-
      An unencrypted DocumentDB cluster stores its data and its automated backups
      in plaintext on AWS-managed storage, and encryption cannot be turned on
      after the cluster exists. Reading the deployed cluster is the only way to
      know whether the storage that actually holds the data is encrypted, because
      a cluster restored or created outside Terraform carries no record of it.

  CKV_AWS_252:
    severity: low
    impact: 0.3
    nist: [SI-4, AU-12]
    nist_r4: [SI-4, AU-12]
    cci: [CCI-002664, CCI-000172]
    ksi: [KSI-MLA-LOG]
    nist_source: agent-drafted
    rationale: >-
      Without an SNS topic on the trail, nothing announces that a new log file has
      been delivered, so any detection built on CloudTrail has to poll the bucket
      and finds out late. The deployed trail is what matters here: the topic
      association can be removed with a single UpdateTrail call that leaves the
      Terraform unchanged.

  CKV_AWS_280:
    severity: medium
    impact: 0.5
    nist: [SC-28, "SC-28 (1)"]
    nist_r4: [SC-28, "SC-28 (1)"]
    cci: [CCI-001199, CCI-002475]
    ksi: [KSI-SVC-CER, KSI-SVC-KMG]
    nist_source: agent-drafted
    rationale: >-
      A Neptune cluster snapshot holds the full graph and outlives the cluster it
      came from. If the snapshot is unencrypted, the data survives in plaintext
      after the cluster is deleted, and it can be shared or copied to another
      region with nothing standing between the copy and its reader.

  CKV_AWS_298:
    severity: medium
    impact: 0.5
    nist: [SC-28, "SC-28 (1)"]
    nist_r4: [SC-28, "SC-28 (1)"]
    cci: [CCI-001199, CCI-002475]
    ksi: [KSI-SVC-CER, KSI-SVC-KMG]
    nist_source: agent-drafted
    rationale: >-
      A DMS S3 endpoint writes whole tables of migrated source data into a bucket.
      Under SSE_S3 the objects are readable by anyone who can read the bucket;
      under SSE_KMS reading them additionally requires a decrypt grant on the key,
      so bucket access alone does not disclose the migrated records.

  CKV_AWS_329:
    severity: medium
    impact: 0.5
    nist: [AC-3, AC-6]
    nist_r4: [AC-3, AC-6]
    cci: [CCI-000213, CCI-002233]
    ksi: [KSI-IAM-CTL]
    nist_source: agent-drafted
    rationale: >-
      An access point whose root directory is "/" exposes the entire file system
      to every client that mounts through it, which defeats the reason access
      points exist. Because the root directory is fixed at creation, a deployed
      access point pointing at "/" is a standing grant that no later Terraform
      edit will narrow.

  CKV_AWS_330:
    severity: medium
    impact: 0.5
    nist: [AC-3, AC-6]
    nist_r4: [AC-3, AC-6]
    cci: [CCI-000213, CCI-002233]
    ksi: [KSI-IAM-CTL]
    nist_source: agent-drafted
    rationale: >-
      With no POSIX user enforced, the access point uses whatever uid and gid the
      NFS client presents, so file ownership on the shared file system is decided
      by the caller rather than by the account. Enforcing a uid and gid is what
      makes per-workload separation on one EFS file system actually hold.

  CKV_AWS_347:
    severity: high
    impact: 0.7
    nist: [SC-28, "SC-28 (1)"]
    nist_r4: [SC-28, "SC-28 (1)"]
    cci: [CCI-001199, CCI-002475]
    ksi: [KSI-SVC-CER, KSI-SVC-KMG]
    nist_source: agent-drafted
    rationale: >-
      Neptune storage encryption can only be set when the cluster is created, so
      an unencrypted cluster stays unencrypted for its whole life and every
      snapshot taken from it inherits that. Checking the deployed cluster catches
      the case where the encrypted definition was written after a cluster had
      already been created without it.

  CKV_AWS_363:
    severity: medium
    impact: 0.5
    nist: [SI-2, "SI-2 (5)"]
    nist_r4: [SI-2, "SI-2 (5)"]
    cci: [CCI-001227, CCI-002605]
    ksi: [KSI-CMT-VTD]
    nist_source: agent-drafted
    rationale: >-
      A deprecated Lambda runtime stops receiving security patches for the
      language runtime and the underlying OS packages, and AWS eventually blocks
      updates and then invocations. The deployed runtime is the one that matters:
      a function created before the runtime was deprecated keeps running on it
      until someone changes it.

fixes:

  CKV_AWS_182:
    aws_docdb_cluster:
      terraform: |
        resource "aws_kms_key" "docdb" {
          description         = "DocumentDB cluster storage"
          enable_key_rotation = true
        }

        resource "aws_docdb_cluster" "example" {
          cluster_identifier        = "docdb-example"
          engine                    = "docdb"
          master_username           = "docdbadmin"
          master_password           = var.docdb_master_password
          backup_retention_period   = 7
          skip_final_snapshot       = false
          final_snapshot_identifier = "docdb-example-final"
          storage_encrypted         = true
          kms_key_id                = aws_kms_key.docdb.arn
        }
      cli: |
        aws docdb create-db-cluster-snapshot --db-cluster-identifier docdb-example --db-cluster-snapshot-identifier docdb-example-snap
        aws docdb copy-db-cluster-snapshot --source-db-cluster-snapshot-identifier docdb-example-snap --target-db-cluster-snapshot-identifier docdb-example-snap-cmk --kms-key-id <key-arn>
        aws docdb restore-db-cluster-from-snapshot --db-cluster-identifier docdb-example-cmk --snapshot-identifier docdb-example-snap-cmk --engine docdb --kms-key-id <key-arn>
      note: >-
        There is no in-place fix. DocumentDB storage encryption is fixed at
        cluster creation, so the path is snapshot, copy the snapshot under the
        customer-managed key, restore into a new cluster, cut traffic over, then
        delete the old cluster and the unencrypted snapshot.

  CKV_AWS_252:
    aws_cloudtrail:
      terraform: |
        resource "aws_sns_topic" "cloudtrail" {
          name              = "cloudtrail-notifications"
          kms_master_key_id = aws_kms_key.sns.id
        }

        data "aws_iam_policy_document" "cloudtrail_sns" {
          statement {
            sid     = "AllowCloudTrailPublish"
            actions = ["SNS:Publish"]
            effect  = "Allow"
            principals {
              type        = "Service"
              identifiers = ["cloudtrail.amazonaws.com"]
            }
            resources = [aws_sns_topic.cloudtrail.arn]
          }
        }

        resource "aws_sns_topic_policy" "cloudtrail" {
          arn    = aws_sns_topic.cloudtrail.arn
          policy = data.aws_iam_policy_document.cloudtrail_sns.json
        }

        resource "aws_cloudtrail" "example" {
          name                          = "org-trail"
          s3_bucket_name                = aws_s3_bucket.trail.id
          sns_topic_name                = aws_sns_topic.cloudtrail.name
          include_global_service_events = true
          is_multi_region_trail         = true
          enable_log_file_validation    = true
          kms_key_id                    = aws_kms_key.cloudtrail.arn
        }
      cli: |
        aws cloudtrail update-trail --name org-trail --sns-topic-name cloudtrail-notifications
      note: >-
        The topic policy must allow cloudtrail.amazonaws.com to SNS:Publish before
        the trail is updated, or UpdateTrail fails with InsufficientSnsTopicPolicy.

  CKV_AWS_280:
    aws_neptune_cluster_snapshot:
      terraform: |
        resource "aws_kms_key" "neptune" {
          description         = "Neptune cluster storage"
          enable_key_rotation = true
        }

        resource "aws_neptune_cluster" "example" {
          cluster_identifier        = "neptune-example"
          engine                    = "neptune"
          storage_encrypted         = true
          kms_key_arn               = aws_kms_key.neptune.arn
          skip_final_snapshot       = false
          final_snapshot_identifier = "neptune-example-final"
        }

        resource "aws_neptune_cluster_snapshot" "example" {
          db_cluster_identifier          = aws_neptune_cluster.example.id
          db_cluster_snapshot_identifier = "neptune-example-snapshot"
        }
      cli: |
        aws neptune copy-db-cluster-snapshot --source-db-cluster-snapshot-identifier neptune-example-snapshot --target-db-cluster-snapshot-identifier neptune-example-snapshot-cmk --kms-key-id <key-arn>
        aws neptune delete-db-cluster-snapshot --db-cluster-snapshot-identifier neptune-example-snapshot
      note: >-
        aws_neptune_cluster_snapshot has no kms_key_id argument — a snapshot
        inherits the key of the cluster it was taken from, so the Terraform fix is
        on the cluster. An existing unencrypted snapshot cannot be encrypted in
        place; copy it under the customer-managed key and delete the original.

  CKV_AWS_298:
    aws_dms_s3_endpoint:
      terraform: |
        resource "aws_kms_key" "dms" {
          description         = "DMS S3 target encryption"
          enable_key_rotation = true
        }

        resource "aws_dms_s3_endpoint" "target" {
          endpoint_id             = "s3-target"
          endpoint_type           = "target"
          bucket_name             = aws_s3_bucket.dms.id
          service_access_role_arn = aws_iam_role.dms.arn
          encryption_mode         = "SSE_KMS"
          kms_key_arn             = aws_kms_key.dms.arn
        }
      cli: |
        aws dms modify-endpoint --endpoint-arn <endpoint-arn> --s3-settings BucketName=<bucket>,ServiceAccessRoleArn=<role-arn>,EncryptionMode=SSE_KMS,ServerSideEncryptionKmsKeyId=<key-arn>
      note: >-
        modify-endpoint replaces the whole S3Settings structure rather than
        merging into it, so every setting the endpoint already has must be resent
        in the same call or it is silently reset to its default.

  CKV_AWS_329:
    aws_efs_access_point:
      terraform: |
        resource "aws_efs_access_point" "example" {
          file_system_id = aws_efs_file_system.example.id

          root_directory {
            path = "/app-data"

            creation_info {
              owner_uid   = 1000
              owner_gid   = 1000
              permissions = "0750"
            }
          }

          posix_user {
            uid = 1000
            gid = 1000
          }
        }
      cli: |
        aws efs create-access-point --file-system-id <fs-id> --root-directory 'Path=/app-data,CreationInfo={OwnerUid=1000,OwnerGid=1000,Permissions=0750}' --posix-user Uid=1000,Gid=1000
        aws efs delete-access-point --access-point-id <old-access-point-id>
      note: >-
        There is no in-place fix. An access point's root directory is immutable,
        so the fix is a replacement access point plus repointing every mount
        (ECS volume configuration, EKS PV, or /etc/fstab) at the new id before the
        old one is deleted.

  CKV_AWS_330:
    aws_efs_access_point:
      terraform: |
        resource "aws_efs_access_point" "example" {
          file_system_id = aws_efs_file_system.example.id

          posix_user {
            uid            = 1000
            gid            = 1000
            secondary_gids = [1001]
          }

          root_directory {
            path = "/app-data"

            creation_info {
              owner_uid   = 1000
              owner_gid   = 1000
              permissions = "0750"
            }
          }
        }
      cli: |
        aws efs create-access-point --file-system-id <fs-id> --posix-user Uid=1000,Gid=1000 --root-directory 'Path=/app-data,CreationInfo={OwnerUid=1000,OwnerGid=1000,Permissions=0750}'
        aws efs delete-access-point --access-point-id <old-access-point-id>
      note: >-
        There is no in-place fix. PosixUser is fixed at creation, so enforcing an
        identity on an existing access point means creating a replacement and
        repointing the mounts at it.

  CKV_AWS_347:
    aws_neptune_cluster:
      terraform: |
        resource "aws_kms_key" "neptune" {
          description         = "Neptune cluster storage"
          enable_key_rotation = true
        }

        resource "aws_neptune_cluster" "example" {
          cluster_identifier                  = "neptune-example"
          engine                              = "neptune"
          storage_encrypted                   = true
          kms_key_arn                         = aws_kms_key.neptune.arn
          iam_database_authentication_enabled = true
          backup_retention_period             = 7
          skip_final_snapshot                 = false
          final_snapshot_identifier           = "neptune-example-final"
        }
      cli: |
        aws neptune create-db-cluster-snapshot --db-cluster-identifier neptune-example --db-cluster-snapshot-identifier neptune-example-snap
        aws neptune restore-db-cluster-from-snapshot --db-cluster-identifier neptune-example-cmk --snapshot-identifier neptune-example-snap --engine neptune --kms-key-id <key-arn>
      note: >-
        There is no in-place fix. Neptune storage encryption is set at cluster
        creation only, so the path is snapshot, restore into a new encrypted
        cluster, repoint the application at the new endpoint, then delete the old
        cluster and the unencrypted snapshot.

  CKV_AWS_363:
    aws_lambda_function:
      terraform: |
        resource "aws_lambda_function" "example" {
          function_name = "example"
          role          = aws_iam_role.lambda.arn
          handler       = "index.handler"
          runtime       = "python3.12"
          filename      = "function.zip"
          architectures = ["arm64"]

          tracing_config {
