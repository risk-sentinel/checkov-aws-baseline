        aws s3api put-bucket-replication --bucket <source-bucket> --replication-configuration file://replication.json

  CKV2_AWS_38:
    aws_route53_zone:
      note: >-
        DNSSEC signing needs an asymmetric ECC_NIST_P256 KMS key in us-east-1, and the
        DS record must be published at the registrar. Enabling signing without the DS
        record is harmless; publishing a DS record without working signing takes the
        domain offline.
      terraform: |
        resource "aws_kms_key" "dnssec" {
          customer_master_key_spec = "ECC_NIST_P256"
          key_usage                = "SIGN_VERIFY"
          deletion_window_in_days  = 7
        }

        resource "aws_route53_key_signing_key" "example" {
          hosted_zone_id             = aws_route53_zone.example.id
          key_management_service_arn = aws_kms_key.dnssec.arn
          name                       = "example-ksk"
        }

        resource "aws_route53_hosted_zone_dnssec" "example" {
          depends_on     = [aws_route53_key_signing_key.example]
          hosted_zone_id = aws_route53_key_signing_key.example.hosted_zone_id
        }
      cli: |
        aws route53 enable-hosted-zone-dnssec --hosted-zone-id <zone-id>

