  CKV_AWS_332: >-
    ECS service platform version needs ListClusters -> ListServices(cluster) ->
    DescribeServices(cluster, services): three levels, and the third takes two
    arguments.
  CKV_AWS_265: >-
    Keyspaces table encryption needs ListKeyspaces -> ListTables(keyspaceName) ->
    GetTable(keyspaceName, tableName): three levels, and encryptionSpecification
    is only on the third.
  CKV2_AWS_29: >-
    API Gateway protected by WAF. GetStages does return webAclArn, so the data is
    reachable, but the graph check exempts PRIVATE endpoint types and WAF cannot
    be attached to a private REST API at all. Asserting web_acl_arn is set would
    fail every private API. Scoping it needs the parent RestApi's
    endpointConfiguration.types alongside the child's webAclArn, which is a
    parent-field-in-the-child-row capability the schema does not have.

  # -- the child returns a policy document or another JSON blob -------------
  CKV_AWS_301: >-
    lambda.GetPolicy(FunctionName) returns `Policy`, a JSON string. The two-step
    shape is right (ListFunctions -> GetPolicy) but every assertion here is
    "does any statement have Principal *", which is policy-document parsing, not
    field extraction. Needs a policy-document reader, not this one.
  CKV_AWS_364: Same lambda.GetPolicy JSON-string problem as CKV_AWS_301.
  CKV_AWS_32: >-
    ecr.GetRepositoryPolicy(repositoryName) returns `policyText`, a JSON string.
    Parent DescribeRepositories is fine; the assertion is policy parsing.
  CKV_AWS_33: kms.GetKeyPolicy(KeyId) returns `Policy`, a JSON string.
  CKV_AWS_169: sns.GetTopicAttributes returns the policy as the Attributes["Policy"] JSON string.
  CKV_AWS_385: Same sns.GetTopicAttributes policy-string problem as CKV_AWS_169.
  CKV_AWS_168: sqs.GetQueueAttributes returns the policy as Attributes["Policy"], a JSON string.
  CKV_AWS_171: >-
    emr.DescribeSecurityConfiguration(Name) returns `SecurityConfiguration` as a
    JSON STRING, not a structure. Matching EnableAtRestEncryption inside it with a
    regex would be a brittle control that looks precise.
