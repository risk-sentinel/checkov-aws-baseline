    That is the silence-as-success shape, not coverage.
  CKV_AWS_147: >-
    "CodeBuild project encrypted using CMK". BatchGetProjects always returns
    encryptionKey -- it defaults to the account's alias/aws/s3 key -- so
    not_empty always passes. The real assertion is "not the AWS-managed default",
    which is an account- and partition-specific ARN with no portable literal.
  CKV_AWS_224: >-
    "ECS Exec logging encrypted with CMK". kmsKeyId is absent on every cluster
    that does not use ECS Exec, and nil is the failing state for a presence
    check, so every ordinary cluster would fail. It is only meaningful where
    CKV_AWS_223 already applies -- conditional scope again.

  # -- constant child argument the schema cannot carry ----------------------
  CKV_AWS_27: >-
    SQS encryption. ListQueues -> GetQueueAttributes(QueueUrl) is the right pair,
    and Attributes is a string-keyed hash the reader's dig_path could walk, but
    GetQueueAttributes returns NOTHING unless AttributeNames is passed. The
    schema has no slot for that constant. Same blocker for CKV2_AWS_73.
  CKV_AWS_112: >-
    "SSM document is not public". ListDocuments -> DescribeDocumentPermission
    requires PermissionType="Share" as well as Name -- a constant second
    argument. Same for CKV_AWS_113 and CKV_AWS_303.

  # -- gem not in the image -------------------------------------------------
  CKV_AWS_22: aws-sdk-sagemaker is not in the image's gem list. Same for CKV_AWS_98, 122, 187, 306, 307, 367, 368, 369, 370, 371, 372.
  CKV_AWS_193: aws-sdk-appsync is not in the image's gem list. Same for CKV_AWS_194, 214, 215.
  CKV_AWS_242: aws-sdk-mwaa is not in the image's gem list. Same for CKV_AWS_243 and CKV_AWS_244.
  CKV_AWS_253: aws-sdk-dlm is not in the image's gem list. Same for CKV_AWS_254, 255, 256.
  CKV_AWS_90: aws-sdk-docdb is not in the declared gem list, so docdb parameter groups are out of reach. Same for CKV_AWS_104.
  CKV_AWS_170: aws-sdk-qldb is not in the image's gem list. Same for CKV_AWS_172.
  CKV_AWS_262: aws-sdk-kendra is not in the image's gem list.
  CKV_AWS_263: aws-sdk-appflow is not in the image's gem list. Same for CKV_AWS_264.
  CKV_AWS_267: aws-sdk-comprehend is not in the image's gem list. Same for CKV_AWS_268.
  CKV_AWS_269: aws-sdk-connect is not in the image's gem list. Same for CKV_AWS_270.

  # -- reachable in one call, so it does not belong in this tranche ---------
  CKV_AWS_23: >-
    ec2.DescribeSecurityGroupRules takes no required arguments and returns every
    rule in the region with Description, CidrIpv4, FromPort and ToPort. This and
    CKV_AWS_24/25/260/277/382 are single-call work for tools/api_specs.yml, not
    parent/child work.
  CKV_AWS_229: >-
    ec2.DescribeNetworkAcls takes no required arguments and embeds Entries.
    Single-call, like CKV_AWS_230/231/232/352.
  CKV_AWS_261: >-
    elbv2.DescribeTargetGroups takes no required arguments. Single-call, like
    CKV_AWS_378.
  CKV_AWS_210: batch.DescribeJobDefinitions takes no required arguments. Single-call.
  CKV_AWS_329: efs.DescribeAccessPoints takes no required arguments. Single-call, like CKV_AWS_330.
  CKV_AWS_94: glue.GetDataCatalogEncryptionSettings takes no required arguments. Single-call.
  CKV_AWS_99: glue.GetSecurityConfigurations takes no required arguments. Single-call.
  CKV_AWS_9_note: >-
    NOT SKIPPED, RESOLVED ELSEWHERE. iam.GetAccountPasswordPolicy takes no
    arguments and returns one structure -- an account singleton, neither
    single-call-list nor parent/child. A concurrent branch in this working tree
    (commit fa0ba45, "eight comparison verbs and a singleton reader") added a
    `singleton` reader and mapped CKV_AWS_9/10/11/12/13/14/15 with it while this
    file was being drafted. Recorded here only so a reviewer does not re-open it
    as a parent/child candidate.
  CKV_AWS_62: >-
    iam.GetAccountAuthorizationDetails takes no required arguments and returns
    every policy document in the account in one paginated call. That is the right
    tool for the whole IAM policy-document tranche
    (CKV_AWS_62/63/286/287/288/289/290/355, CKV2_AWS_40) and it is single-call
    plus a policy parser, not parent/child.

  # -- other -----------------------------------------------------------------
  CKV_AWS_208: >-
    MQ broker version currency. mq.ListBrokers -> mq.DescribeBroker(BrokerId)
    works and DescribeBroker carries EngineVersion, but the assertion is a
    per-engine table of currently-supported versions that AWS moves every few
    months, and the comparison is semver, not membership. A stale in_list here
    fails brokers that are in fact current.
  CKV_AWS_175: >-
    wafv2.ListWebACLs requires `Scope` (REGIONAL|CLOUDFRONT) -- not a parent id
    but a constant -- and GetWebACL then needs Name, Scope AND Id together. Three
    arguments on the child. Same for CKV_AWS_192 and CKV_AWS_342.
  CKV_AWS_392: >-
    s3control.ListAccessPoints requires AccountId. It is not a parent resource
    id, it is the caller's own account, which the reader already knows -- but the
    schema has no way to say "pass the account id here".

# ---------------------------------------------------------------------------
notes:

  sentinels:
    summary: >-
      Three sentinel values appear in the specs above because the two-step shape
      needs to say things the one-step schema never had to. They are proposals,
      not existing conventions. A reader that treats them as literal field names
      will silently produce rows of nils.
    _self: >-
      `parent.id: _self`. The parent's collection is a list of SCALARS, not
      structures, so the item itself is the argument. Used by
      ecs.ListTaskDefinitions (taskDefinitionArns), ecs.ListClusters
      (clusterArns), eks.ListClusters (clusters), guardduty.ListDetectors
      (detectorIds), codebuild.ListProjects (projects), and
      firehose.ListDeliveryStreams (deliveryStreamNames). Six of twenty-two specs
      -- common enough that it is not an edge case.
    _parent: >-
      `id: _parent`. The child item carries no identifier of its own, so the row's
      id is the parent id that produced it. Used by s3 GetPublicAccessBlock and
      GetBucketReplication (the response describes a bucket but never names it),
      route53 GetDNSSEC, and guardduty GetDetector.
    _response: >-
      `collection: _response`. The child response has NO wrapper member -- the
      fields are top-level members of the response itself. Used by
      guardduty.GetDetector and cloudtrail.GetEventDataStore. Distinct from the
      structure case below, where there is a wrapper.

  reader_requirements:
    collection_may_be_a_structure: >-
      Today libraries/aws_api_assets.rb does `Array(page.public_send(collection))`
      and iterates. Eleven of the twenty-two specs point `collection` at a single
      STRUCTURE rather than a list: transfer `server`, eks `cluster`, es
      `domain_status`, ecs `task_definition`, acm `certificate`, athena
      `work_group`, firehose `delivery_stream_description`, codepipeline
      `pipeline`, s3 `public_access_block_configuration` and
      `replication_configuration`, route53 `status`. `Array()` on an Aws::Structure
      does NOT return [struct] -- Aws structs are Struct subclasses and respond to
      to_a, so Array() flattens them into their member VALUES. The reader must
      branch on the response member's type, and it must do so explicitly rather
      than relying on Array().
    absent_is_not_unreadable: >-
      Several child calls raise rather than returning an empty answer when the
      thing is not configured, and in most of those cases "not configured" IS the
      finding. These must produce a row with nil fields, not an entry in
      unreadable_regions -- otherwise the failing population renders as Not
      Applicable, which is this repo's documented silence-as-success failure mode.
      The concrete error classes: s3 NoSuchPublicAccessBlockConfiguration
      (CKV_AWS_53/54/55/56 -- the whole point of those four controls),
      s3 ReplicationConfigurationNotFoundError (CKV_AWS_144), route53
      DNSSECNotFound / InvalidArgument on a private zone (CKV2_AWS_38, out of
      scope rather than failing), lambda ResourceNotFoundException from
      ListFunctionUrlConfigs, transfer/eks/athena ResourceNotFoundException from a
      parent deleted between the two calls. Everything else -- AccessDenied,
      throttling, networking -- stays an unreadable region.
    parent_child_race: >-
      A parent can be deleted between the list and the describe. That is a
      not-found on the child and must be dropped from the row set, not recorded
      as unreadable: it is neither a finding nor a permission problem.
    pagination_on_both_calls: >-
      Both legs paginate. The parent legs that matter: ecs.ListTaskDefinitions
      (100/page), lambda.ListFunctions (50/page), s3.ListBuckets (1000/page since
      the 2024 pagination change -- the old unpaginated behaviour is gone),
      iam.ListRoles (100/page). The child legs that paginate:
      elbv2.DescribeListeners, iam.ListAttachedRolePolicies,
      lambda.ListFunctionUrlConfigs, redshift/rds DescribeParameters. The aws-sdk
      response is enumerable when the operation has a paginator, and the existing
      reader already relies on that; the child call must do the same rather than
      reading page one and stopping.
    parent_id_forms: >-
      route53's HostedZone.Id comes back as "/hostedzone/Z0123..." and GetDNSSEC
      accepts that form, so no stripping is needed -- but the ROW id will contain
      the prefix, which matters for exemption matching. ecs.ListClusters and
      ecs.ListTaskDefinitions return full ARNs; DescribeClusters and
      DescribeTaskDefinition accept ARNs. lambda.ListFunctions returns bare
      function names, which ListFunctionUrlConfigs accepts.

  schema_gaps:
    constant_args: >-
      The schema has `arg` for the parent id and nothing else. Three specs need a
      constant alongside it: ecs.DescribeClusters needs
      include: ['CONFIGURATIONS','SETTINGS'] or configuration and settings are
      simply absent from the response (this silently voids CKV_AWS_223);
      sqs.GetQueueAttributes needs AttributeNames: ['All'] or the Attributes map
      comes back empty; ssm.DescribeDocumentPermission needs
      PermissionType: 'Share'. A `args:` map of literal extra parameters would
      cover all three and would have unblocked CKV_AWS_27, CKV2_AWS_73,
      CKV_AWS_112, CKV_AWS_113 and CKV_AWS_303 as well.
    batch_args: >-
      Two children take a LIST where the schema implies a scalar:
      ecs.DescribeClusters(clusters:) and codebuild.BatchGetProjects(names:).
      Both accept up to 100 ids per call, which turns N calls into N/100. The
      reader needs to know that `arg` is batchable for these two, and how large a
      batch the operation allows. Expressing it as `batch: 100` on the spec would
      be enough. Without it these still work one id at a time, just 100x more
      expensively.
    row_selector: >-
      Parameter-group checks are the cleanest possible fit for the parent/child
      shape and are still unmappable, because each child row is one parameter and
      the control must assert only on the row whose parameterName matches. A
      `where: {parameter_name: require_ssl}` on the MAPPING would unlock
      CKV_AWS_105, CKV2_AWS_27, CKV2_AWS_30 and CKV2_AWS_69 with no reader change
      beyond a filter. The same mechanism would handle
      ecs settings[name=containerInsights] (CKV_AWS_65) and beanstalk
      OptionSettings (CKV_AWS_312, CKV_AWS_340).
    conditional_scope: >-
      Several checks are only meaningful when a SECOND field has a particular
      value: CKV_AWS_240/241 do not apply to a KinesisStreamAsSource firehose;
      CKV_AWS_224 only applies where ECS Exec logging is on; CKV_AWS_38 only
      applies where the EKS public endpoint is enabled; CKV2_AWS_29 only applies
      to non-PRIVATE API endpoints. Today the only scoping mechanism is the nil
      filter, which happens to do the right thing surprisingly often (see
      CKV_AWS_103, CKV_AWS_223, CKV_AWS_318, CKV_AWS_234) but cannot express
      "skip this row when field X equals Y". CKV_AWS_240 is mapped above WITH a
      known false positive precisely so the gap is visible rather than quietly
      dropped.
    list_fan_out: >-
      dig_path walks hashes only. Nine checks are blocked purely on "assert
      something about every element of a list of structures": CKV_AWS_334, 336,
      97, 37, 57, 145, 300, CKV2_AWS_20, CKV2_AWS_71. A `[]` segment in the field
      path -- container_definitions[].readonly_root_filesystem yielding an array
      of values -- plus an `all_equal` / `none_equal` satisfies would clear all
      nine. It is the single highest-yield extension in this file and it is
      deliberately NOT used above, because half-implementing it would ship
      controls that look finished.
    map_keyed: >-
      Distinct from list fan-out: LogPublishingOptions (es), Attributes (sqs/sns),
      RouteSettings (apigatewayv2) and artifactStores (codepipeline) are MAPS
      keyed by a meaningful string. dig_path already falls back from symbol to
      string keys, so `attributes.KmsMasterKeyId` would in fact resolve -- but
      only for maps whose keys are known constants. Where the key set is open
      (artifactStores keyed by region) no path works.
    two_field_comparison: >-
      Every `satisfies` compares one field to a literal. CKV_AWS_249 (task role
      must differ from execution role) needs field-to-field, which is one more
      matcher (`not_equals_field`) and no reader change.

  call_volume:
    summary: >-
      Six of these specs multiply cleanly by region count. At 17 commercial
      regions with an unfiltered region walk, the numbers below are per SCAN, and
      several of them are large enough to matter for both runtime and API
      throttling. Every one of them is correct; three of them are also expensive
      enough to want an input to bound them.
    worst_ecs_task_definitions: >-
      THE PROBLEM CASE. ListTaskDefinitions returns every ACTIVE REVISION of every
      family, not one per family. A team deploying ten services several times a
      day accumulates thousands of active revisions within months, and the spec as
      written issues one DescribeTaskDefinition per revision per region. A
      realistic mid-size account is 2,000-20,000 calls. ECS DescribeTaskDefinition
      is not a high-limit API. Two mitigations, neither expressible in the schema
      today: (a) list_task_definition_families -> one ListTaskDefinitions per
      family with sort=DESC, max_results=1 -> one DescribeTaskDefinition, which is
      three levels but bounded by family count; (b) an input capping revisions per
      family. RECOMMENDATION: do not ship the aws_ecs_task_definition spec without
      one of these, or accept that CKV_AWS_335 costs more than every other control
      in the profile combined.
    lambda_function_urls: >-
      One ListFunctionUrlConfigs per function per region. A few hundred functions
      x 17 regions is a few thousand calls, and the great majority return an empty
      list because most functions have no URL. There is no cheaper path --
      ListFunctions does not indicate whether a URL exists. Bounding the region
      list is the only real lever.
    s3_per_bucket_calls: >-
      TWO specs both walk every bucket: GetPublicAccessBlock and
      GetBucketReplication. 500 buckets is 1,000 calls. Worse, both are declared
      scope: global because ListBuckets is global -- but each per-bucket call must
      be issued against the BUCKET's region or S3 answers with a 301
      PermanentRedirect. ListBuckets now returns Bucket.BucketRegion (confirmed in
      the botocore s3 Buckets shape), so the reader can build the right regional
      client per bucket. It must actually do that; the global-scope reader as it
      stands builds one client and would 301 on most buckets. If further S3
      sub-resource specs are added later (ACL, encryption, lifecycle, policy) they
      should share ONE bucket walk rather than each re-listing.
    iam_roles: >-
      One ListAttachedRolePolicies per role, IAM being global so no region
      multiplier. A mature account has 200-800 roles once service-linked roles are
      counted, so 200-800 calls. IAM's rate limit is low; this is the one spec
      most likely to see throttling, and the reader needs retry-with-backoff
      rather than treating a throttle as an unreadable region.
    cheap_ones: >-
      codebuild.BatchGetProjects takes 100 names per call -- ceil(projects/100)
      per region. ecs.DescribeClusters takes 100 cluster arns per call. Both are
      effectively free. apigateway/apigatewayv2 stages, eks clusters, es domains,
      transfer servers, athena workgroups, firehose streams, guardduty detectors,
      cloudtrail event data stores, codepipeline pipelines and elbv2 listeners are
      all one call per parent with parent counts that are small by nature
      (typically single or low double digits per region).

  divergences:
    summary: Where the API member name or shape is not what the Terraform argument name suggests. All confirmed against botocore.
    items:
      - "ECS pidMode: Checkov reads it from container_definitions; the botocore TaskDefinition shape puts pidMode at task level, alongside family and networkMode. It is not a ContainerDefinition member at all, so Checkov's CKV_AWS_335 cannot fire. The deployed control can."
      - "ECS privileged: Checkov's CKV_AWS_334 reads a key called `privilege`. The ContainerDefinition member is `privileged`. Another check that cannot fire as written."
      - "API Gateway GetStages returns its collection in the SINGULAR member `item`, while GetRestApis uses `items`. Getting this backwards yields an empty row set and a green control."
      - "Lambda function URL: Terraform's argument is authorization_type; the API member is AuthType."
      - "Elasticsearch: Terraform's encrypt_at_rest maps to EncryptionAtRestOptions; cluster_config maps to ElasticsearchClusterConfig (note the Elasticsearch prefix even for OpenSearch-engine domains)."
      - "CodeBuild: Terraform's logs_config { s3_logs { encryption_disabled } } maps to Project.LogsConfig.S3Logs.EncryptionDisabled; the Ruby SDK snake_cases cloudWatchLogs to cloud_watch_logs, not cloudwatch_logs."
      - "ACM: CertificateSummary (ListCertificates) has InUse, a boolean; CertificateDetail (DescribeCertificate) has InUseBy, a list of ARNs. Different member, different type, same idea."
      - "Transfer: ListedServer and DescribedServer share EndpointType and IdentityProviderType, but Protocols and SecurityPolicyName exist only on DescribedServer."
      - "CloudTrail: the EventDataStore summary from ListEventDataStores omits KmsKeyId entirely; only GetEventDataStore returns it."
      - "GuardDuty and CloudTrail GetEventDataStore both return FLAT responses with no wrapper member, unlike every other describe in this file."
      - "elbv2.DescribeListeners marks neither LoadBalancerArn nor ListenerArns as required in botocore, but the API rejects a call with neither. Botocore's `required` list is not a complete statement of what the API demands -- the Elastic Beanstalk case (CKV_AWS_312) is the same trap and there it kills the spec."

  replacements:
    summary: >-
      tools/render_controls.py derives the api spec key from the mapping's
      terraform type, so a spec key must equal a terraform resource type and there
      can be only one spec per type. Three specs above therefore REPLACE an
      existing single-call entry in tools/api_specs.yml rather than sitting
      beside it. Each was checked against every mapping that reads it.
    aws_transfer_server: >-
      SAFE. The existing spec declares endpoint_type and identity_provider_type;
      both are members of DescribedServer as well. The only mapping that reads
      them is CKV_AWS_164 (endpoint_type, in_list), which is unaffected.
    aws_athena_workgroup: >-
      SAFE. The existing spec declares only `state`, which is a WorkGroup member
      too. No mapping reads the api spec at all -- CKV_AWS_82 uses the stock
      reader.
    aws_acm_certificate: >-
      CHECK BEFORE MERGING. No mapping reads this spec today, so nothing breaks
      now, but the field `in_use` disappears: CertificateDetail has no boolean
      InUse, only InUseBy (a list). Anything written against `in_use` in the
      future would need `in_use_by` with a not_empty instead.
    duplicated_specs: >-
      aws_elasticsearch_domain / aws_opensearch_domain and aws_lb_listener /
      aws_alb_listener are byte-identical pairs, for the same key-equals-type
      reason. If the renderer ever learns an `alias_of:` key, four specs become
      two. Until then the duplication is load-bearing, and the two halves of each
      pair must be edited together.
