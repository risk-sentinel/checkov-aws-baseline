  # -- parent needs a parent, or a third level ------------------------------
  CKV_AWS_59: >-
    aws_api_gateway_method authorization. Reaching a method is GetRestApis ->
    GetResources(restApiId) -> GetMethod(restApiId, resourceId, httpMethod): three
    levels, and the third call takes two arguments. GetResources can inline
    resourceMethods but only when `embed=["methods"]` is passed, which is a
    constant argument the schema has no slot for.
