  # -- the assertion needs to cross a list of structures --------------------
  CKV_AWS_334: >-
    ECS container privileged. The field is
    taskDefinition.containerDefinitions[].privileged -- one value per container.
    dig_path walks hashes only, so there is no path expression for "no element of
    this list has privileged true". (Also worth recording: Checkov reads
    `privilege`, which is not a member of ContainerDefinition at all; the API
    member is `privileged`.)
  CKV_AWS_336: >-
    ECS readonlyRootFilesystem, same containerDefinitions[] fan-out as CKV_AWS_334.
  CKV_AWS_97: >-
    ECS EFS transit encryption lives at
    taskDefinition.volumes[].efsVolumeConfiguration.transitEncryption -- same
    list fan-out.
  CKV_AWS_37: >-
    EKS control-plane logging is cluster.logging.clusterLogging[], a list of
    {types:[...], enabled:bool}. "All five log types enabled" is a fan-out over a
    list of structures whose own member is a list.
  CKV_AWS_38: >-
    EKS public access CIDRs. cluster.resourcesVpcConfig.publicAccessCidrs is a
    list of strings and the assertion is "does not contain 0.0.0.0/0". `excludes`
