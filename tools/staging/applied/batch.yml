  # ---- DAX and Bedrock: gem absent, and no vendored resource at all ----------

  CKV_AWS_47: >-
    aws-sdk-dax is not in the auditor image, so merge_proposals refuses the
    aws_dax_cluster api spec -- and it is named in the lint_api_specs.py docstring.
    inspec-aws ships no DAX resource either (no vendor/**/libraries/ file is named for
    it and no vendored file mentions the service), so there is no stock fallback and no
    api_specs_pending_gems.yml entry yet. Unblocks with the gem; the spec needed is
    Aws::DAX::Client#describe_clusters -> clusters, scope regional, id cluster_name, arn
    cluster_arn, field sse_status = sse_description.status, `satisfies: in_list, value:
    [ENABLED]`. Confirmed against botocore: Cluster carries ClusterName, ClusterArn and
    SSEDescription, SSEDescription's only member is Status, and its enum is
    ENABLING/ENABLED/DISABLING/DISABLED -- so ENABLED is the right literal, and note that
    the API field is an enum STRING while Checkov's inspected_key
    (server_side_encryption/[0]/enabled) is a Terraform boolean. ONE THING THE NEXT PASS
    MUST CONFIRM BEFORE SHIPPING THIS: SSEDescription is an optional structure, and
    `in_list` is a value comparison, so nil_filter_for REJECTS nil rows. If DAX omits
    SSEDescription entirely on a cluster with SSE off, the failing population is filtered
    out of scope and the control becomes structurally unfailable -- the exact defect
    nil_filter_for's docstring records. The presence of a DISABLED enum member is
    evidence that the struct is returned when SSE is off, but that is inference from the
    model, not an observation; confirm against a real unencrypted DAX cluster.

