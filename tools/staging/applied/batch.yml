  CKV_AWS_383: >-
    aws-sdk-bedrockagent is not in the auditor image, so merge_proposals refuses the
    aws_bedrockagent_agent api spec -- named in the lint_api_specs.py docstring
    alongside neptune, docdb and dax. inspec-aws ships no Bedrock resource, so there is
    no stock fallback. THE GEM IS THE ONLY BLOCKER: the question the batch1 note left
    open is now settled in the mapping's favour. botocore 1.43.24's bedrock-agent model
    puts guardrailConfiguration on the ListAgents AgentSummary itself, not only on
    GetAgent, with members guardrailIdentifier and guardrailVersion -- so aws_api_assets,
    which makes no per-item call, can express this check exactly as drafted. Note also
    that AgentSummary has NO agentArn (GetAgent's Agent shape does), which is why the
    batch1 spec correctly omits `arn:`; per-check exemptions for this type must therefore
    be written as ids, not arns. Correcting the other half of that note as well: it
    claimed a nil field would empty the population and render Not Applicable. That is
    backwards for this mapping. The proposed verb is `not_empty`, and nil_filter_for
    deliberately does NOT filter nils for not_empty/empty precisely because filtering
    them made presence checks structurally unfailable -- so a nil guardrail_identifier is
    the FAILING state, which is the correct behaviour here since guardrailConfiguration
    is genuinely optional and absent exactly when no guardrail is attached. Unblocks with
    the gem, as Aws::BedrockAgent::Client#list_agents -> agent_summaries, scope regional,
    id agent_id, no arn, field guardrail_identifier =
    guardrail_configuration.guardrail_identifier, `satisfies: not_empty`.
