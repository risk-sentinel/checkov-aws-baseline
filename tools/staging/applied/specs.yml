    model says DescribeDBClusters shares operational technology with RDS and
    Neptune and tells the caller to "use the filterName=engine,Values=docdb
    filter parameter to return only Amazon DocumentDB clusters"; neptune's says
    the same in reverse. The api-spec schema cannot pass that filter —
    aws_api_assets#collect invokes the list operation with no arguments — and
    `fields:` extracts values without restricting rows, so the control would
    assert a DocumentDB rule against every Aurora and Neptune cluster in the
    account. That is the identical defect that rules out the aws-sdk-rds route,
    so swapping SDKs solves nothing. Unblocking this needs BOTH the gem
    (container-build-sign#283) AND a row-filter capability in the api-spec
    schema, e.g. `where: {engine: docdb}` applied in row_for. Correction to the
    obvious next step: aws_docdb_cluster is ALREADY parked in
    tools/api_specs_pending_gems.yml, so there is nothing to park — what that
    entry lacks is `kms_key_id: kms_key_id` in `fields`. Field itself confirmed
    for that day: botocore docdb DescribeDBClusters (required=None) -> DBClusters
    -> DBCluster.KmsKeyId. Note when it is written that not_empty on KmsKeyId
    cannot separate a customer-managed key from the AWS-managed aws/docdb key —
    neither can Checkov, whose assertion is only that kms_key_id is set, so that
