  CKV2_AWS_58: >-
    Neptune deletion protection has no reader available to a data-only change.
    inspec-aws ships no aws_neptune_* resource (confirmed by listing the vendored
    pack), api_specs.yml has no aws_neptune_cluster entry, and aws-sdk-neptune is
    NOT in tools/image_gems.txt — an api spec naming it would be refused, and if
    it were not the LoadError would be rescued into unreadable_regions and read as
    Not Applicable. Reading Neptune clusters through aws_rds_clusters was rejected:
    DescribeDBClusters returns Aurora and DocumentDB clusters as well, the mapping
    schema has no `where engine == neptune`, and the control would silently assert
    against every RDS cluster in the account. Needs the gem in the image plus an
    api spec, or a stock resource upstream.

  CKV2_AWS_60: >-
    The mapping itself is sound — aws_rds_instances.db_instance_identifiers ->
    aws_rds_instance(db_instance_identifier:).copy_tags_to_snapshot — but the
    CATALOGUE entry cannot be rendered. checkov_catalog.yml gives CKV2_AWS_60
    `resources: []` and `tf_docs: null`, and render_controls.render_fix does
    `list(entry['tf_docs'].values())[0]` whenever no fixes matched a declared
    resource type, which raises AttributeError on None. Since resources is empty,
    no fixes entry can ever match, so the crash is unavoidable from data alone and
    it would abort the whole render, leaving controls/ half-written. Blocked on a
    one-line guard in render_fix/render_stock (or on the catalogue learning this
    check's resource types). Same blocker as CKV2_AWS_65 and CKV2_AWS_66.

  CKV2_AWS_62: >-
    S3 event notifications need a new predicate on aws_s3_bucket. The vendored
    resource exposes no notification reader at all (its methods are bucket_acl,
    bucket_ownership_controls, public?, has_access_logging_enabled?,
    prevent_public_access?, has_default_encryption_enabled?,
    has_versioning_enabled?, has_secure_transport_enabled?, bucket_policy,
    bucket_lifecycle_rules, tags), and this slice writes data, not library code.
    GetBucketNotificationConfiguration answers it in one call per bucket and
    returns 200 with an empty body when there are none, so the predicate must
    treat empty as false rather than nil.

  CKV2_AWS_65: >-
    Blocked exactly as CKV2_AWS_60 is: `resources: []` and `tf_docs: null` in
    checkov_catalog.yml make render_fix raise AttributeError on None. The reader
    side is confirmed ready — aws_s3_bucket#bucket_ownership_controls exists and
    returns OwnershipControls.Rules[0].ObjectOwnership as a String, so
    `equals BucketOwnerEnforced` with `scope: global` would be correct the moment
    the renderer stops crashing. Note for whoever lands it: that reader indexes
    [0] unguarded, so a bucket that never had ownership controls set raises
    OwnershipControlsNotFoundError, which catch_aws_errors turns into a failed
    resource — a visible failure, not a false pass.

  CKV2_AWS_66: >-
    Two independent blockers. (1) Same catalogue defect as CKV2_AWS_60/65:
    `resources: []` and `tf_docs: null`, so render_fix raises. (2) There is no
    reader. mwaa ListEnvironments returns NAMES ONLY and WebserverAccessMode lives
    on GetEnvironment(Name).Environment, which api_specs cannot express — the spec
    reader makes one list call and extracts fields, it never follows up per row —
    and inspec-aws ships no aws_mwaa_* resource. Needs a small singular resource
    written upstream or in libraries/.

  CKV2_AWS_71: >-
    WITHDRAWN IN ADVERSARIAL REVIEW. The assertion itself is sound — the live
    aws_acm_certificate api spec declares `id: domain_name`, so AwsApiAssets#row_for
    sets row[:id] to the domain name as a never-nil String and `excludes '*'` is a
    correct substring test on it. What is NOT sound is the population it runs over.
    AwsApiAssets#collect invokes the spec's list call with NO arguments, and botocore
    acm documents the default for ListCertificates' `Includes.keyTypes` filter as
    "Default filtering returns only RSA_1024 and RSA_2048 certificates that have at
    least one domain." So every EC certificate (EC_prime256v1, EC_secp384r1,
    EC_secp521r1) and every RSA_3072/RSA_4096 certificate is invisible to the
    enumeration — permanently, in every account, regardless of size. A wildcard
    certificate on an EC key is exactly the modern ALB/CloudFront default, and it
    would render as a clean pass; an account whose certificates are ALL EC renders
    the control NOT APPLICABLE — "this rule does not apply here" for an account full
    of certificates. That is the failure mode the api reader's unreadable_regions
    guard exists to prevent, and this one walks past it because the list call
    SUCCEEDS. Fixing it means teaching api_specs to carry list arguments (or adding
    a keyTypes-complete spec), which is a change to a LIVE spec and to the reader —
    library work this slice cannot do, and merge_proposals correctly refuses a
    staging file that redefines a live spec. Two notes for whoever lands it: (1) the
    same defect makes the live spec's `key_algorithm` field near-vacuous, since it
    can only ever report RSA_1024 or RSA_2048; (2) once the enumeration is complete,
    CertificateSummary already carries SubjectAlternativeNameSummaries, so the SAN
    half of this rule needs no DescribeCertificate call — only the any-element verb
    named in the CKV2_AWS_72 entry below. The Terraform fix example is retained in
    `fixes:` so it is not lost; an unreferenced fix entry is precedented here.

  CKV2_AWS_72: >-
    Needs a verb that does not exist. @custom_origin_protocol_policies is an ARRAY
    with one entry per custom origin, and the requirement is "no element of this
    array is in [http-only, match-viewer]". `not_in_list` compares a SCALAR against
    a list — it renders `should_not be_in [...]`, and an Array is never `in` a list
    of Strings, so the assertion passes for every distribution including the
    non-compliant ones: a control that cannot fail. Needs an any-element /
    set-intersection verb (`excludes_any`, or `not_in_list` taught to distribute
    over an array subject) in matcher_for. The same verb closes the
    subject_alternative_names half of CKV2_AWS_71.

  CKV_AWS_57: >-
    Public-WRITE ACL needs a new predicate on aws_s3_bucket. The honest read is
    GetBucketAcl grants — exposed as `bucket_acl`, an Array of Aws::S3::Types::Grant
    — failing when a grant's Grantee.URI is the AllUsers group AND its Permission
    is WRITE, WRITE_ACP or FULL_CONTROL. No verb expresses a two-field predicate
    over an array of structs, and this slice cannot add the library method.
    Explicitly NOT mapped to the existing `public?` property that CKV_AWS_20 uses:
    that wraps GetBucketPolicyStatus plus an any-AllUsers-grant test, so it reports
    on the bucket POLICY and on READ grants too — shipping it here would produce a
    second control asserting a different fact under this rule's id.

  CKV_AWS_144: >-
    S3 cross-region replication needs a new predicate on aws_s3_bucket; no
    replication reader exists on the vendored resource. GetBucketReplication ->
    ReplicationConfiguration.Rules[].Status == "Enabled" answers it, and the
    predicate must rescue ReplicationConfigurationNotFoundError to false — the API
    raises rather than returning empty when replication was never configured, and
    an unrescued raise turns "no replication", which IS the finding, into an
    errored control.

  CKV_AWS_145: >-
    Needs a new reader on aws_s3_bucket that returns the ALGORITHM, not a boolean.
    The vendored has_default_encryption_enabled? answers only "is any default
    encryption set", which since 2023 is true for every bucket — mapping to it
    would ship a control that can never fail. The rule is specifically KMS versus
    SSE-S3, which is
    GetBucketEncryption -> ServerSideEncryptionConfiguration.Rules[0]
    .ApplyServerSideEncryptionByDefault.SSEAlgorithm as a String. There is a real
    failing population here (AES256 is the default), so it is worth writing; it
    just is not a data change.
