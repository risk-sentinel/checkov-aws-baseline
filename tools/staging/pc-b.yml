  CKV_AWS_335: 'ECS task definitions -- correct on the API side, refused on cost. The divergence in the
    proposal is real and checks out: pidMode is a TASK-level member of the TaskDefinition shape, sitting
    next to family and networkMode, and is not a ContainerDefinition member at all, so Checkov''s own
    CKV_AWS_335 (which reads it inside container_definitions) cannot fire while a deployed control could.
    What blocks it is the parent population: ListTaskDefinitions returns every ACTIVE REVISION of every
    family, not one per family, so the spec issues one DescribeTaskDefinition per revision per region
    -- thousands of calls on a mid-size account, against an API with no generous limit. libraries/aws_api_assets.rb''s
    own header names ECS task definition revisions as THE example of a parent population not to add. The
    fix is ListTaskDefinitionFamilies -> one ListTaskDefinitions per family (sort DESC, max_results 1)
    -> one DescribeTaskDefinition, which is parents: plus args:, or an input capping revisions per family.'
  CKV_AWS_53: 'S3 sub-resource, and blocked on TWO unimplemented reader features at once. (1) region_field:
    ListBuckets is global but every per-bucket call must be issued against the bucket''s OWN region or
    S3 answers 301 PermanentRedirect; a scope: global spec builds one client and would 301 on most buckets,
    landing every one in parent_failures. (2) absent_errors: s3.GetPublicAccessBlock''s NoSuchPublicAccessBlockConfiguration
    is raised exactly when the bucket is NON-COMPLIANT, and children_of records a raising child as a parent_failure,
    so the entire failing population would arrive as an error list instead of as findings. The member
    itself (BlockPublicAcls) is confirmed on PublicAccessBlockConfiguration and matches the Terraform
    argument name exactly; the spec is not the problem. Spec drafted in tools/proposals/parentchild.yml;
    do not stage it until both features exist, because a half-implemented version reads as a clean scan.'
