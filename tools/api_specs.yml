aws_elb:
  # Classic ELB. inspec-aws ships aws_elb, but it keeps load_balancer_description
  # as a raw Aws struct, so the listener array is not reachable by dotted path.
  # Enumerated here instead because a collection roll-up needs the response as
  # plain nested hashes, and elb:DescribeLoadBalancers takes no required
  # arguments so one call per region answers the whole account.
  client: Aws::ElasticLoadBalancing::Client
  collection: load_balancer_descriptions
  fields:
    listener_descriptions: listener_descriptions
  gem: aws-sdk-elasticloadbalancing
  id: load_balancer_name
  list: describe_load_balancers
  scope: regional
