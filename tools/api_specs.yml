# How to enumerate a resource type inspec-aws does not ship.
#
# Four facts per type: which SDK gem, which client, which list call, which field
# is the identifier. Plus the fields a control needs, by dotted path into the
# response item.
#
# gem        the require, not the gem name on disk — 'aws-sdk-lambda'
# client     the client constant
# list       the operation that enumerates. It must take NO required arguments:
#            an operation needing a parent id cannot enumerate an account, and
#            that is the defect class that produced 16 exec errors when the
#            stock mappings were derived without checking.
# collection the response field holding the items
# id         the item field that identifies it
# arn        the item field holding an ARN, where the API returns one
# scope      regional (default) or global
# fields     name -> dotted path, extracted onto every row
#
# Adding a type is four lines plus its fields. tools/lint_api_specs.py checks
# the gem is present in the image before anything trusts it.

aws_lambda_function:
  gem: aws-sdk-lambda
  client: Aws::Lambda::Client
  list: list_functions
  collection: functions
  id: function_name
  arn: function_arn
  fields:
    tracing_mode: tracing_config.mode
    kms_key_arn: kms_key_arn
    runtime: runtime
    vpc_subnet_ids: vpc_config.subnet_ids
    code_signing_config_arn: code_signing_config_arn

aws_cloudwatch_log_group:
  gem: aws-sdk-cloudwatchlogs
  client: Aws::CloudWatchLogs::Client
  list: describe_log_groups
  collection: log_groups
  id: log_group_name
  arn: arn
  fields:
    kms_key_id: kms_key_id
    retention_in_days: retention_in_days

aws_ecr_repository:
  gem: aws-sdk-ecr
  client: Aws::ECR::Client
  list: describe_repositories
  collection: repositories
  id: repository_name
  arn: repository_arn
  fields:
    scan_on_push: image_scanning_configuration.scan_on_push
    image_tag_mutability: image_tag_mutability
    encryption_type: encryption_configuration.encryption_type
    kms_key: encryption_configuration.kms_key

aws_efs_file_system:
