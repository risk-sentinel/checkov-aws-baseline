aws_security_group:
  # inspec-aws ships aws_security_group, and its allow_in?(port:, ipv4_range:)
  # answers the unrestricted-ingress checks — but it is a predicate TAKING
  # ARGUMENTS and the mapping schema's `property` is a bare method name, so it
  # is unreachable from data. It also re-describes one group per call.
  # ec2:DescribeSecurityGroups takes no required arguments and returns
  # IpPermissions inline, so one paginated call per region enumerates every
  # group WITH its rules, and the rules arrive as plain nested hashes a
  # collection roll-up can walk.
  arn: security_group_arn
  client: Aws::EC2::Client
  collection: security_groups
  fields:
    ip_permissions: ip_permissions
    ip_permissions_egress: ip_permissions_egress
  gem: aws-sdk-ec2
  id: group_id
  list: describe_security_groups
  scope: regional
