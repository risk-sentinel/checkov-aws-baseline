# How to enumerate a resource type inspec-aws does not ship.
# Every `gem` here must exist in the auditor image: a missing gem is rescued
# into unreadable_regions, which now fails the control rather than rendering
# Not Applicable — but the spec is still dead weight.
# Removed for absent gems: aws-sdk-neptune, aws-sdk-docdb, aws-sdk-dax,
# aws-sdk-bedrockagent. Neptune and DocDB are reachable through aws-sdk-rds,
# but DescribeDBClusters returns Aurora too and the schema cannot filter by
# engine — that needs a spec-level filter or the gems added to the image.
#
# ONE-STEP SCHEMA (the original, and still the majority)
#   gem:        the SDK gem to require. Must be in tools/image_gems.txt.
#   client:     the client class name, resolved with const_get.
#   list:       a no-argument list/describe call on that client.
#   collection: the response member holding the items.
#   id:         the member on each item that identifies it.
#   arn:        optional; the member holding its ARN, used for exemptions.
#   scope:      `global` to read once, anything else to walk regions.
#   fields:     name -> dotted path into the item, read by dig_path.
#
# TWO-STEP SCHEMA (`parent:`) — for a child list call AWS refuses to run
# without a parent id (GetStages needs a restApiId; DescribeCluster needs a
# name). Adds:
#   parent.list:       the no-argument call that enumerates parents.
#   parent.collection: the response member holding the parents.
#   parent.id:         the member on each parent that is its id, or the
#                      sentinel `_self` when that collection is a list of
#                      SCALARS and the item itself is the id.
#   arg:               the parameter the child call takes the parent id in.
#                      Required with `parent:`, meaningless without it.
# and two sentinels on the existing keys:
#   collection: _response  — the child response has no wrapper member; its
#                            fields are top-level members of the response.
#   id: _parent            — the child carries no identifier of its own, so
#                            the parent id is the row's identity.
# Rows from a two-step spec carry `parent_id` in addition to the usual keys.
#
# Cost: one child call per parent per region. A 200-parent account is 201 calls
# per region and nothing bounds it — `scan_regions` is the only lever. Read
# tools/proposals/parentchild.yml's `call_volume` before adding a spec whose
# parent population is unbounded; ECS task definition REVISIONS are the case
# that costs more than the rest of the profile combined.
#
# NOT IMPLEMENTED, and refused by tools/lint_api_specs.py rather than silently
# ignored — each was drafted in tools/proposals/parentchild.yml and each one,
# ignored, produces a field that is always nil, which the control's nil filter
# removes, which renders Not Applicable:
#   args:          literal extra params on the child call. Needed by ECS
#                  DescribeClusters (include: [CONFIGURATIONS, SETTINGS]),
#                  SQS GetQueueAttributes and SSM DescribeDocumentPermission.
#   batch:         a child `arg` that takes up to N ids per call. Needed by ECS
#                  DescribeClusters and CodeBuild BatchGetProjects; without it
#                  they work, 100x more expensively.
#   absent_errors: errors meaning "not configured", to yield a row of nils
#                  rather than a recorded failure. Needed before any S3
#                  sub-resource spec, and it needs a verb rule with it: a row
#                  of nils is filtered straight back out by a value check.
#   parent region routing: S3's per-bucket calls must be issued against the
#                  bucket's own region or S3 answers 301. Until that exists an
#                  S3 two-step spec will record a parent failure per bucket —
#                  loud and wrong, which is the safe direction, but do not ship
#                  it that way.
#   a third level: rest api -> resource -> method. Deliberately not built: every
#                  three-level check (CKV_AWS_59, CKV2_AWS_53, CKV2_AWS_70,
#                  CKV_AWS_332, CKV_AWS_265) is ALSO blocked on a child call
#                  taking two arguments, so depth alone unlocks nothing, and
#                  depth-3 call volume multiplies a cost that already needs a
#                  bound.
aws_acm_certificate:
  arn: certificate_arn
  client: Aws::ACM::Client
  collection: certificate_summary_list
  fields:
    in_use: in_use
    key_algorithm: key_algorithm
  gem: aws-sdk-acm
  id: domain_name
  list: list_certificates
# TWO-STEP. apigateway.GetStages requires restApiId, so a stage cannot be
# enumerated account-wide at all. Confirmed against botocore apigateway
# 2015-07-09: GetRestApis has no required input and returns `items` (ListOfRestApi,
# RestApi.id); GetStages requires `restApiId` and returns its list in the SINGULAR
# member `item` (ListOfStage) — reading that as `items` yields an empty row set
# and a green control. GetRestApis paginates; GetStages does not.
aws_api_gateway_stage:
  client: Aws::APIGateway::Client
  gem: aws-sdk-apigateway
  parent:
    collection: items
    id: id
    list: get_rest_apis
  arg: rest_api_id
  list: get_stages
  collection: item
  id: stage_name
  scope: regional
  fields:
    access_log_destination_arn: access_log_settings.destination_arn
    cache_cluster_enabled: cache_cluster_enabled
    client_certificate_id: client_certificate_id
    tracing_enabled: tracing_enabled
    web_acl_arn: web_acl_arn
