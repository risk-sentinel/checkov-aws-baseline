# TWO-STEP, and the case that exercises both parent-side and child-side
# sentinels. Confirmed against botocore eks 2017-11-01: ListClusters has no
# required input and returns `clusters` as a StringList — a list of SCALARS,
# hence parent.id: _self — while DescribeCluster requires `name` and returns
# `cluster` as a SINGLE Cluster structure, not a list. Array() on that structure
# would return its 28 member values; the reader branches on the type instead.
# endpointPublicAccess is a member of resourcesVpcConfig (VpcConfigResponse).
#
# Also the repair for four mappings resource_map_derived.yml had to delete
# (CKV_AWS_37/39/58/339): the stock aws_eks_clusters.names yields nil rows in an
# account with no clusters and the singular then rejects a nil cluster_name. A
# reader that enumerates parents itself never constructs that nil.
aws_eks_cluster:
  arn: arn
  client: Aws::EKS::Client
  gem: aws-sdk-eks
  parent:
    collection: clusters
    id: _self
    list: list_clusters
  arg: name
  list: describe_cluster
  collection: cluster
  id: name
  scope: regional
  fields:
    encryption_config: encryption_config
    endpoint_private_access: resources_vpc_config.endpoint_private_access
    endpoint_public_access: resources_vpc_config.endpoint_public_access
    public_access_cidrs: resources_vpc_config.public_access_cidrs
    status: status
    version: version
