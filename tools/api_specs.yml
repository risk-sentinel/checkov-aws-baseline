  arn: cluster_arn
  client: Aws::EMR::Client
  collection: clusters
  fields:
    status: status.state
  gem: aws-sdk-emr
  id: id
  list: list_clusters
aws_glue_crawler:
  client: Aws::Glue::Client
  collection: crawlers
  fields:
    security_configuration: crawler_security_configuration
  gem: aws-sdk-glue
  id: name
  list: get_crawlers
# TWO-STEP, and the case that exercises the remaining two sentinels. Confirmed
# against botocore guardduty 2017-11-28: ListDetectors has no required input and
# returns `DetectorIds` as a list of scalars (parent.id: _self); GetDetector
# requires `DetectorId` and its output shape is FLAT — Status,
# FindingPublishingFrequency and DataSources are top-level response members with
# no wrapper at all (collection: _response), and nothing in it names the detector
# (id: _parent). DetectorStatus enum is [ENABLED, DISABLED].
#
# Also the repair for CKV_AWS_238, which resource_map_derived.yml deleted because
# the stock aws_guardduty_detectors yields non-String ids.
aws_guardduty_detector:
  client: Aws::GuardDuty::Client
  gem: aws-sdk-guardduty
  parent:
    collection: detector_ids
    id: _self
    list: list_detectors
  arg: detector_id
  list: get_detector
  collection: _response
  id: _parent
  scope: regional
  fields:
    cloudtrail_status: data_sources.cloud_trail.status
    finding_publishing_frequency: finding_publishing_frequency
    s3_logs_status: data_sources.s3_logs.status
    status: status
