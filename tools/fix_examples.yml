CKV_AWS_146:
  aws_db_cluster_snapshot:
    cli: 'There is no in-place fix. A snapshot''s encryption is fixed at creation and

      so is the cluster''s. Copy the snapshot to an encrypted one, then restore

      a new cluster from the copy and cut over:

      aws rds copy-db-cluster-snapshot --source-db-cluster-snapshot-identifier app-aurora-2026-08-30 --target-db-cluster-snapshot-identifier
      app-aurora-2026-08-30-enc --kms-key-id <key-arn>

      '
    note: Encryption cannot be turned on for an existing cluster or an existing snapshot. The remediation
      is a copy-and-restore, and the unencrypted original should be deleted once the replacement is verified.
    terraform: "# A cluster snapshot inherits encryption from the cluster; it cannot be\n# encrypted on\
      \ its own. Encrypt the cluster and every snapshot follows.\nresource \"aws_rds_cluster\" \"app\"\
      \ {\n  cluster_identifier = \"app-aurora\"\n  engine             = \"aurora-postgresql\"\n  engine_version\
      \     = \"15.4\"\n  master_username    = \"app\"\n  manage_master_user_password = true\n\n  storage_encrypted\
      \ = true\n  kms_key_id        = aws_kms_key.rds.arn\n}\n\nresource \"aws_db_cluster_snapshot\" \"\
      app\" {\n  db_cluster_identifier          = aws_rds_cluster.app.id\n  db_cluster_snapshot_identifier\
      \ = \"app-aurora-2026-08-30\"\n}\n"
CKV_AWS_148:
  aws_default_vpc:
    cli: 'aws ec2 delete-vpc --vpc-id <default-vpc-id> --region <region>

      '
    note: Delete the default VPC in every enabled region, not just the one you work in, and detach or
      delete its internet gateway, subnets and route tables first. Anything already launched into it must
      be moved before the delete will succeed.
    terraform: "# There is no Terraform that removes a default VPC: `aws_default_vpc`\n# ADOPTS the existing\
      \ one, and destroying that resource only drops it\n# from state. Manage the workload's own VPC instead,\
      \ and delete the\n# default out of band.\nresource \"aws_vpc\" \"app\" {\n  cidr_block         \
      \  = \"10.0.0.0/16\"\n  enable_dns_hostnames = true\n\n  tags = {\n    Name = \"app\"\n  }\n}\n"
