CKV_AWS_24:
  aws_security_group:
    cli: "aws ec2 revoke-security-group-ingress --group-id <sg-id> --protocol tcp --port 22 --cidr 0.0.0.0/0\n\
      aws ec2 revoke-security-group-ingress --group-id <sg-id> --ip-permissions IpProtocol=tcp,FromPort=22,ToPort=22,Ipv6Ranges=[{CidrIpv6=::/0}]\n"
    note: The revoke closes the exposure now and the next terraform apply reopens it if the HCL still
      carries the rule, so the CLI is the containment step and the Terraform change is the fix. A permission
      whose port range merely SPANS 22 — 0-65535, or an IpProtocol of "-1", which AWS stores with no ports
      at all — has to be revoked with the range it was created with, not with --port 22.
    terraform: "resource \"aws_security_group\" \"example\" {\n  name   = \"example\"\n  vpc_id = aws_vpc.example.id\n\
      \n  # SSH arrives from the bastion's security group, never from a CIDR.\n  # There is no ingress\
      \ block carrying cidr_blocks = [\"0.0.0.0/0\"] at all —\n  # narrowing it to a corporate range would\
      \ still be a CIDR rule, and the\n  # range changes without the security group changing with it.\n\
      \  ingress {\n    description     = \"SSH from the bastion\"\n    from_port       = 22\n    to_port\
      \         = 22\n    protocol        = \"tcp\"\n    security_groups = [aws_security_group.bastion.id]\n\
      \  }\n}\n"
  aws_security_group_rule:
    note: aws_security_group_rule is deprecated in favour of aws_vpc_security_group_ingress_rule; both
      land on the same API and both are assessed here, because the deployed rule carries no record of
      which one wrote it.
    terraform: "resource \"aws_security_group_rule\" \"ssh_from_bastion\" {\n  type                  \
      \   = \"ingress\"\n  security_group_id        = aws_security_group.example.id\n  source_security_group_id\
      \ = aws_security_group.bastion.id\n  from_port                = 22\n  to_port                  =\
      \ 22\n  protocol                 = \"tcp\"\n  description              = \"SSH from the bastion\"\
      \n}\n"
  aws_vpc_security_group_ingress_rule:
    terraform: "resource \"aws_vpc_security_group_ingress_rule\" \"ssh_from_bastion\" {\n  security_group_id\
      \            = aws_security_group.example.id\n  referenced_security_group_id = aws_security_group.bastion.id\n\
      \  from_port                    = 22\n  to_port                      = 22\n  ip_protocol       \
      \           = \"tcp\"\n  description                  = \"SSH from the bastion\"\n}\n"
CKV_AWS_248:
  aws_elasticsearch_domain:
    cli: "aws es update-elasticsearch-domain-config --domain-name <name> --vpc-options SecurityGroupIds=<sg-id>,SubnetIds=<subnet-ids>\n"
