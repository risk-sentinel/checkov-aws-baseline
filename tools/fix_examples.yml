CKV_AWS_99:
  aws_glue_security_configuration:
    cli: "aws glue create-security-configuration --name glue-encrypted --encryption-configuration file://enc.json\n\
      aws glue update-job --job-name <job> --job-update SecurityConfiguration=glue-encrypted\naws glue\
      \ delete-security-configuration --name <old-configuration>\n"
    note: 'There is no in-place fix. Glue security configurations are IMMUTABLE — the API has create and
      delete and no update — so remediation is create a new one, repoint every job that referenced the
      old one, then delete it. Terraform does the same thing under the covers and will destroy and recreate,
      which detaches jobs mid-flight if the update ordering is not forced. Two further traps: the KMS
      key policy must allow the Glue service principal and the job''s role, or jobs fail at start with
      an opaque access-denied; and CSE-KMS is the only accepted mode for job bookmarks, so copying SSE-KMS
      across all three blocks is rejected.'
    terraform: "resource \"aws_glue_security_configuration\" \"encrypted\" {\n  name = \"glue-encrypted\"\
      \n\n  encryption_configuration {\n    cloudwatch_encryption {\n      cloudwatch_encryption_mode\
      \ = \"SSE-KMS\"\n      kms_key_arn                = aws_kms_key.glue.arn\n    }\n\n    job_bookmarks_encryption\
      \ {\n      job_bookmarks_encryption_mode = \"CSE-KMS\"\n      kms_key_arn                   = aws_kms_key.glue.arn\n\
      \    }\n\n    s3_encryption {\n      s3_encryption_mode = \"SSE-KMS\"\n      kms_key_arn       \
      \ = aws_kms_key.glue.arn\n    }\n  }\n}\n"
