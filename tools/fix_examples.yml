CKV_AWS_116:
  aws_lambda_function:
    cli: 'aws lambda update-function-configuration --function-name <name> --dead-letter-config TargetArn=<queue-or-topic-arn>

      '
    note: The function's execution role also needs sqs:SendMessage (or sns:Publish) on the target; without
      it the delivery fails silently and the check still passes, because the configuration is present.
    terraform: "resource \"aws_sqs_queue\" \"dlq\" {\n  name = \"app-dlq\"\n}\n\nresource \"aws_lambda_function\"\
      \ \"app\" {\n  function_name = \"app\"\n  role          = aws_iam_role.app.arn\n  handler      \
      \ = \"index.handler\"\n  runtime       = \"python3.12\"\n  filename      = \"app.zip\"\n\n  dead_letter_config\
      \ {\n    target_arn = aws_sqs_queue.dlq.arn\n  }\n}\n"
