CKV_AWS_133:
  aws_db_instance:
    cli: 'aws rds modify-db-instance --db-instance-identifier app-db --backup-retention-period 30 --apply-immediately

      '
    note: 'Raising the retention period from 0 restarts automated backups but does not create history:
      the first recoverable point is the backup taken after the change, so there is a gap equal to the
      time the setting was 0.'
    terraform: "resource \"aws_db_instance\" \"app\" {\n  identifier           = \"app-db\"\n  engine\
      \               = \"postgres\"\n  engine_version       = \"16.4\"\n  instance_class       = \"db.t4g.medium\"\
      \n  allocated_storage    = 50\n  username             = \"app\"\n  manage_master_user_password =\
      \ true\n  storage_encrypted    = true\n  skip_final_snapshot  = false\n  final_snapshot_identifier\
      \ = \"app-db-final\"\n\n  backup_retention_period = 30            # 1-35; 0 disables backups\n \
      \ backup_window           = \"03:00-04:00\"\n  copy_tags_to_snapshot   = true\n}\n"
  aws_rds_cluster:
    cli: 'aws rds modify-db-cluster --db-cluster-identifier app-aurora --backup-retention-period 30 --apply-immediately

      '
    terraform: "resource \"aws_rds_cluster\" \"app\" {\n  cluster_identifier  = \"app-aurora\"\n  engine\
      \              = \"aurora-postgresql\"\n  engine_version      = \"15.4\"\n  master_username    \
      \ = \"app\"\n  manage_master_user_password = true\n  storage_encrypted   = true\n  skip_final_snapshot\
      \ = false\n  final_snapshot_identifier = \"app-aurora-final\"\n\n  backup_retention_period     \
      \ = 30\n  preferred_backup_window      = \"03:00-04:00\"\n  copy_tags_to_snapshot        = true\n\
      }\n"
