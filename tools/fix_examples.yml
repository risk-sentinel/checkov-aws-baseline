    note: The volume ARN is arn:<partition>:ec2:<region>:<account>:volume/<volume-id>. DescribeVolumes
      does not return it, which is exactly the identifier mismatch this control has to translate across.
    terraform: "resource \"aws_backup_selection\" \"volumes\" {\n  iam_role_arn = aws_iam_role.backup.arn\n\
      \  name         = \"ebs-volumes\"\n  plan_id      = aws_backup_plan.daily.id\n\n  selection_tag\
      \ {\n    type  = \"STRINGEQUALS\"\n    key   = \"backup\"\n    value = \"true\"\n  }\n}\n"
