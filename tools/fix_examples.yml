  aws_rds_cluster:
    cli: "aws rds modify-db-cluster --db-cluster-identifier <id> \\\n  --cloudwatch-logs-export-configuration\
      \ EnableLogTypes=audit,error --apply-immediately\n"
    terraform: "resource \"aws_rds_cluster\" \"example\" {\n  enabled_cloudwatch_logs_exports = [\"audit\"\
      , \"error\", \"general\", \"slowquery\"]\n}\n"
CKV_AWS_326:
  aws_rds_cluster:
    cli: "aws rds modify-db-cluster --db-cluster-identifier <id> --backtrack-window 259200 --apply-immediately\n"
    terraform: "resource \"aws_rds_cluster\" \"example\" {\n  backtrack_window = 72   # hours\n}\n"
CKV_AWS_327:
  aws_rds_cluster:
    cli: "Set at creation: the key cannot be changed on an existing cluster.\n"
    terraform: "resource \"aws_rds_cluster\" \"example\" {\n  storage_encrypted = true\n  kms_key_id \
      \       = aws_kms_key.rds.arn\n}\n"
CKV_AWS_329:
  aws_efs_access_point:
    cli: "aws efs create-access-point --file-system-id <fs-id> --root-directory 'Path=/app-data,CreationInfo={OwnerUid=1000,OwnerGid=1000,Permissions=0750}'\
      \ --posix-user Uid=1000,Gid=1000\naws efs delete-access-point --access-point-id <old-access-point-id>\n"
    note: 'There is no in-place fix: an access point''s root directory is fixed at creation. The path
      is a replacement access point plus repointing every mount — ECS volume configuration, EKS persistent
      volume, or /etc/fstab — at the new id before the old one is deleted. CreationInfo must be supplied
      or EFS will not create the directory, and mounts then fail.'
    terraform: "resource \"aws_efs_access_point\" \"example\" {\n  file_system_id = aws_efs_file_system.example.id\n\
      \n  root_directory {\n    path = \"/app-data\"\n\n    creation_info {\n      owner_uid   = 1000\n\
      \      owner_gid   = 1000\n      permissions = \"0750\"\n    }\n  }\n\n  posix_user {\n    uid =\
      \ 1000\n    gid = 1000\n  }\n}\n"
CKV_AWS_33:
  aws_kms_key:
    cli: "aws kms put-key-policy --key-id <key-id> --policy-name default --policy file://key-policy.json\n"
    note: 'put-key-policy REPLACES the whole document, so read the current one with `aws kms get-key-policy
      --key-id <key-id> --policy-name default --query Policy --output text` and edit that rather than
      writing a new file from scratch. Do not remove the account-root administration statement while narrowing
      the others: a key whose policy delegates to nobody cannot be managed by IAM at all, and recovering
      one takes an AWS support case. If the wildcard principal is genuinely required — a key a partner
      account must use — constrain it instead of removing it: a Condition on kms:CallerAccount, aws:PrincipalOrgID
      or kms:ViaService takes the statement out of this control''s scope, which is the same allowance
      Checkov makes.'
    terraform: "resource \"aws_kms_key\" \"app\" {\n  description = \"Application data key\"\n\n  policy\
      \ = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [\n      {\n        Sid       =\
      \ \"AllowAccountAdministration\"\n        Effect    = \"Allow\"\n        Principal = { AWS = \"\
      arn:aws:iam::${data.aws_caller_identity.current.account_id}:root\" }\n        Action    = \"kms:*\"\
      \n        Resource  = \"*\"\n      },\n      {\n        Sid       = \"AllowApplicationUse\"\n  \
      \      Effect    = \"Allow\"\n        Principal = { AWS = aws_iam_role.app.arn }\n        Action\
      \    = [\"kms:Encrypt\", \"kms:Decrypt\", \"kms:GenerateDataKey*\", \"kms:DescribeKey\"]\n     \
      \   Resource  = \"*\"\n      },\n    ]\n  })\n}\n"
CKV_AWS_330:
  aws_efs_access_point:
    cli: "aws efs create-access-point --file-system-id <fs-id> --posix-user Uid=1000,Gid=1000 --root-directory\
      \ 'Path=/app-data,CreationInfo={OwnerUid=1000,OwnerGid=1000,Permissions=0750}'\naws efs delete-access-point\
      \ --access-point-id <old-access-point-id>\n"
    note: There is no in-place fix. PosixUser is fixed at creation, so enforcing an identity on an existing
      access point means creating a replacement and repointing the mounts at it.
    terraform: "resource \"aws_efs_access_point\" \"example\" {\n  file_system_id = aws_efs_file_system.example.id\n\
      \n  posix_user {\n    uid            = 1000\n    gid            = 1000\n    secondary_gids = [1001]\n\
      \  }\n\n  root_directory {\n    path = \"/app-data\"\n\n    creation_info {\n      owner_uid   =\
      \ 1000\n      owner_gid   = 1000\n      permissions = \"0750\"\n    }\n  }\n}\n"
CKV_AWS_331:
  aws_ec2_transit_gateway:
    cli: "aws ec2 modify-transit-gateway --transit-gateway-id <tgw-id> --options AutoAcceptSharedAttachments=disable\n"
    note: Turning auto-accept off does not detach anything already attached. Review the existing attachments
      with describe-transit-gateway-attachments and remove the ones that were never approved.
    terraform: "resource \"aws_ec2_transit_gateway\" \"main\" {\n  description                     = \"\
      main\"\n  auto_accept_shared_attachments  = \"disable\"\n  default_route_table_association = \"\
      disable\"\n  default_route_table_propagation = \"disable\"\n  dns_support                     =\
      \ \"enable\"\n}\n"
CKV_AWS_336:
  aws_ecs_task_definition:
    cli: "aws ecs register-task-definition --cli-input-json file://task-definition.json\n"
    note: 'A task definition revision is immutable, so there is no in-place fix — the change is a new
      revision plus an update of every service that references the family, and running tasks keep the
      old revision until they are replaced. Expect the first attempt to crash: application servers, language
      runtimes and agents write to paths nobody documents, and the way to find them is to run the read-only
      revision in a non-production environment and add a declared volume for each path that fails, rather
      than reverting the flag.'
    terraform: "resource \"aws_ecs_task_definition\" \"example\" {\n  family = \"example\"\n\n  container_definitions\
      \ = jsonencode([\n    {\n      name                   = \"app\"\n      image                  =\
      \ var.image\n      essential              = true\n      readonlyRootFilesystem = true\n\n      #\
      \ Everything the process needs to write goes in a declared mount,\n      # so the writes are visible\
      \ in the task definition instead of\n      # landing anywhere in the container's filesystem.\n \
      \     mountPoints = [\n        { sourceVolume = \"tmp\", containerPath = \"/tmp\", readOnly = false\
      \ },\n      ]\n    },\n  ])\n\n  volume {\n    name = \"tmp\"\n  }\n}\n"
CKV_AWS_338:
  aws_cloudwatch_log_group:
    cli: "aws logs put-retention-policy --log-group-name /aws/app/api --retention-in-days 365\n"
    note: Raising retention does not bring back events already aged out; it only governs what is kept
      from now on. CloudWatch Logs accepts a fixed set of values -- 365 and 400 are the ones at or just
      above a year.
    terraform: "resource \"aws_cloudwatch_log_group\" \"app\" {\n  name              = \"/aws/app/api\"\
      \n  retention_in_days = 365        # 0 means never expire, also acceptable\n  kms_key_id       \
      \ = aws_kms_key.logs.arn\n}\n"
CKV_AWS_339:
  aws_eks_cluster:
    cli: "aws eks update-cluster-version --name <cluster> --kubernetes-version 1.31\nOne minor version\
      \ at a time, and the control plane upgrade must be followed by the node groups and the add-ons.\n"
    note: The supported range moves with every EKS release, so this control's expected list is pinned
      to the Checkov version in tools/checkov_catalog.yml, not to what AWS supports today. A cluster on
      a version AWS has dropped from standard support keeps running and stops receiving patches.
    terraform: "resource \"aws_eks_cluster\" \"main\" {\n  name     = \"main\"\n  role_arn = aws_iam_role.cluster.arn\n\
      \  version  = \"1.31\"\n\n  vpc_config {\n    subnet_ids = var.private_subnet_ids\n  }\n}\n"
CKV_AWS_34:
  aws_cloudfront_distribution:
    cli: "There is no single-field CloudFront update. Fetch the current config,\nchange every viewer_protocol_policy,\
      \ and put it back with the ETag:\naws cloudfront get-distribution-config --id <id> > dist.json\n\
      aws cloudfront update-distribution --id <id> --distribution-config file://config.json --if-match\
      \ <etag>\n"
    terraform: "resource \"aws_cloudfront_distribution\" \"site\" {\n  enabled             = true\n  default_root_object\
      \ = \"index.html\"\n\n  origin {\n    domain_name              = aws_s3_bucket.site.bucket_regional_domain_name\n\
      \    origin_id                = \"s3-site\"\n    origin_access_control_id = aws_cloudfront_origin_access_control.site.id\n\
      \  }\n\n  default_cache_behavior {\n    target_origin_id       = \"s3-site\"\n    viewer_protocol_policy\
      \ = \"redirect-to-https\"   # never allow-all\n    allowed_methods        = [\"GET\", \"HEAD\"]\n\
      \    cached_methods         = [\"GET\", \"HEAD\"]\n    cache_policy_id        = data.aws_cloudfront_cache_policy.optimized.id\n\
      \  }\n\n  ordered_cache_behavior {\n    path_pattern           = \"/api/*\"\n    target_origin_id\
      \       = \"s3-site\"\n    viewer_protocol_policy = \"https-only\"\n    allowed_methods        =\
      \ [\"GET\", \"HEAD\", \"OPTIONS\"]\n    cached_methods         = [\"GET\", \"HEAD\"]\n    cache_policy_id\
      \        = data.aws_cloudfront_cache_policy.disabled.id\n  }\n\n  restrictions {\n    geo_restriction\
      \ { restriction_type = \"none\" }\n  }\n\n  viewer_certificate {\n    acm_certificate_arn      =\
      \ aws_acm_certificate.site.arn\n    ssl_support_method       = \"sni-only\"\n    minimum_protocol_version\
      \ = \"TLSv1.2_2021\"\n  }\n}\n"
CKV_AWS_343:
  aws_redshift_cluster:
    cli: "aws redshift modify-cluster --cluster-identifier <id> --automated-snapshot-retention-period\
      \ 7\n"
    terraform: "resource \"aws_redshift_cluster\" \"example\" {\n  automated_snapshot_retention_period\
      \ = 7\n}\n"
CKV_AWS_344:
  aws_networkfirewall_firewall:
    cli: "aws network-firewall update-firewall-delete-protection --firewall-name edge --delete-protection\n"
    terraform: "resource \"aws_networkfirewall_firewall\" \"edge\" {\n  name                = \"edge\"\
      \n  firewall_policy_arn = aws_networkfirewall_firewall_policy.edge.arn\n  vpc_id              =\
      \ aws_vpc.app.id\n  delete_protection   = true\n\n  subnet_mapping {\n    subnet_id = aws_subnet.firewall.id\n\
      \  }\n}\n"
CKV_AWS_345:
  aws_networkfirewall_firewall:
    cli: "aws network-firewall associate-firewall-policy --firewall-name edge --encryption-configuration\
      \ KeyId=<key-arn>,Type=CUSTOMER_KMS\n"
    terraform: "resource \"aws_kms_key\" \"nfw\" {\n  description         = \"Network Firewall configuration\
      \ encryption\"\n  enable_key_rotation = true\n}\n\nresource \"aws_networkfirewall_firewall\" \"\
      edge\" {\n  name                = \"edge\"\n  firewall_policy_arn = aws_networkfirewall_firewall_policy.edge.arn\n\
      \  vpc_id              = aws_vpc.app.id\n\n  encryption_configuration {\n    key_id = aws_kms_key.nfw.arn\n\
      \    type   = \"CUSTOMER_KMS\"\n  }\n\n  subnet_mapping {\n    subnet_id = aws_subnet.firewall.id\n\
      \  }\n}\n"
  aws_networkfirewall_rule_group:
    cli: "aws network-firewall update-rule-group --rule-group-name block --type STATEFUL --encryption-configuration\
      \ KeyId=<key-arn>,Type=CUSTOMER_KMS --update-token <token>\n"
    note: 'This profile assesses the firewall, not the rule group: the renderer emits one resource type
      per control. The rule-group half needs its own control before it is claimed.'
    terraform: "resource \"aws_networkfirewall_rule_group\" \"block\" {\n  name     = \"block\"\n  type\
      \     = \"STATEFUL\"\n  capacity = 100\n\n  encryption_configuration {\n    key_id = aws_kms_key.nfw.arn\n\
      \    type   = \"CUSTOMER_KMS\"\n  }\n\n  rule_group {\n    rules_source {\n      rules_string =\
      \ \"drop tcp any any -> any 23 (msg:\\\"telnet\\\"; sid:1;)\"\n    }\n  }\n}\n"
CKV_AWS_346:
  aws_networkfirewall_firewall_policy:
    cli: "aws network-firewall update-firewall-policy --firewall-policy-name edge --encryption-configuration\
      \ KeyId=<key-arn>,Type=CUSTOMER_KMS --update-token <token>\n"
    terraform: "resource \"aws_networkfirewall_firewall_policy\" \"edge\" {\n  name = \"edge\"\n\n  encryption_configuration\
      \ {\n    key_id = aws_kms_key.nfw.arn\n    type   = \"CUSTOMER_KMS\"\n  }\n\n  firewall_policy {\n\
      \    stateless_default_actions          = [\"aws:forward_to_sfe\"]\n    stateless_fragment_default_actions\
      \ = [\"aws:forward_to_sfe\"]\n\n    stateful_rule_group_reference {\n      resource_arn = aws_networkfirewall_rule_group.block.arn\n\
      \    }\n  }\n}\n"
CKV_AWS_349:
  aws_emr_security_configuration:
    cli: "There is no in-place fix. An EMR security configuration is immutable:\ncreate a replacement\
      \ and point new clusters at it.\naws emr create-security-configuration --name app-emr-sec-v2 --security-configuration\
      \ file://sec.json\n"
    note: A running cluster keeps the configuration it launched with. Changing this requires launching
      a replacement cluster against the new configuration.
    terraform: "resource \"aws_emr_security_configuration\" \"app\" {\n  name = \"app-emr-sec\"\n\n  configuration\
      \ = jsonencode({\n    EncryptionConfiguration = {\n      EnableAtRestEncryption = true\n      AtRestEncryptionConfiguration\
      \ = {\n        LocalDiskEncryptionConfiguration = {\n          EncryptionKeyProviderType = \"AwsKms\"\
      \n          AwsKmsKey                 = aws_kms_key.emr.arn\n          EnableEbsEncryption     \
      \  = true\n        }\n        S3EncryptionConfiguration = {\n          EncryptionMode = \"SSE-KMS\"\
      \n          AwsKmsKey      = aws_kms_key.emr.arn\n        }\n      }\n      EnableInTransitEncryption\
      \ = true\n      InTransitEncryptionConfiguration = {\n        TLSCertificateConfiguration = {\n\
      \          CertificateProviderType = \"PEM\"\n          S3Object                = \"s3://${aws_s3_bucket.emr.id}/certs.zip\"\
      \n        }\n      }\n    }\n  })\n}\n"
CKV_AWS_35:
  aws_cloudtrail:
    cli: "aws cloudtrail update-trail --name org-trail --kms-key-id <key-arn>\n"
    note: The key policy must let cloudtrail.amazonaws.com call GenerateDataKey* for this trail's ARN,
      or delivery stops silently. Log files already delivered stay under whatever protection they were
      written with.
    terraform: "resource \"aws_kms_key\" \"trail\" {\n  description         = \"CloudTrail log encryption\"\
      \n  enable_key_rotation = true\n}\n\nresource \"aws_cloudtrail\" \"org\" {\n  name             \
      \             = \"org-trail\"\n  s3_bucket_name                = aws_s3_bucket.trail.id\n  kms_key_id\
      \                    = aws_kms_key.trail.arn\n  is_multi_region_trail         = true\n  enable_log_file_validation\
      \    = true\n  include_global_service_events = true\n}\n"
CKV_AWS_351:
  aws_emr_security_configuration:
    cli: "There is no in-place fix -- an EMR security configuration is immutable.\nCreate a replacement\
      \ and launch clusters against it.\n"
    terraform: "resource \"aws_emr_security_configuration\" \"app\" {\n  name = \"app-emr-sec\"\n\n  configuration\
      \ = jsonencode({\n    EncryptionConfiguration = {\n      EnableInTransitEncryption = true\n    \
      \  InTransitEncryptionConfiguration = {\n        TLSCertificateConfiguration = {\n          CertificateProviderType\
      \ = \"PEM\"\n          S3Object                = \"s3://${aws_s3_bucket.emr.id}/certs.zip\"\n  \
      \      }\n      }\n      EnableAtRestEncryption = true\n      AtRestEncryptionConfiguration = {\n\
      \        LocalDiskEncryptionConfiguration = {\n          EncryptionKeyProviderType = \"AwsKms\"\n\
      \          AwsKmsKey                 = aws_kms_key.emr.arn\n          EnableEbsEncryption      \
      \ = true\n        }\n      }\n    }\n  })\n}\n"
CKV_AWS_353:
  aws_db_instance:
    cli: "aws rds modify-db-instance --db-instance-identifier <id> --enable-performance-insights --apply-immediately\n"
    terraform: "resource \"aws_db_instance\" \"example\" {\n  performance_insights_enabled = true\n}\n"
CKV_AWS_354:
  aws_db_instance:
    cli: "Set at enable time: aws rds modify-db-instance --db-instance-identifier <id> \\\n  --enable-performance-insights\
      \ --performance-insights-kms-key-id <key-arn>\n"
    terraform: "resource \"aws_db_instance\" \"example\" {\n  performance_insights_enabled    = true\n\
      \  performance_insights_kms_key_id = aws_kms_key.rds.arn\n}\n"
CKV_AWS_359:
  aws_neptune_cluster:
    cli: "aws neptune modify-db-cluster --db-cluster-identifier graph --enable-iam-database-authentication\
