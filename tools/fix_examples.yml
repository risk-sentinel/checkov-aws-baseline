      '
    note: The execution role needs the AWSLambdaVPCAccessExecutionRole permissions to create the ENIs,
      and a VPC function reaches AWS APIs only through a NAT gateway or VPC endpoints.
    terraform: "resource \"aws_lambda_function\" \"app\" {\n  function_name = \"app\"\n  role        \
      \  = aws_iam_role.app.arn\n  handler       = \"index.handler\"\n  runtime       = \"python3.12\"\
      \n  filename      = \"app.zip\"\n\n  vpc_config {\n    subnet_ids         = var.private_subnet_ids\n\
      \    security_group_ids = [aws_security_group.lambda.id]\n  }\n}\n"
