      \  s3_bucket_name             = aws_s3_bucket.trail.id\n  enable_log_file_validation = true\n  is_multi_region_trail\
      \      = true\n}\n"
CKV_AWS_360:
  aws_docdb_cluster:
    cli: "aws docdb modify-db-cluster --db-cluster-identifier docs --backup-retention-period 7 --apply-immediately\n"
    terraform: "resource \"aws_docdb_cluster\" \"docs\" {\n  cluster_identifier      = \"docs\"\n  engine\
      \                  = \"docdb\"\n  master_username         = var.master_username\n  master_password\
      \         = var.master_password\n  backup_retention_period = 7\n  preferred_backup_window = \"03:00-04:00\"\
      \n}\n"
CKV_AWS_361:
  aws_neptune_cluster:
    cli: "aws neptune modify-db-cluster --db-cluster-identifier graph --backup-retention-period 7 --apply-immediately\n"
    terraform: "resource \"aws_neptune_cluster\" \"graph\" {\n  cluster_identifier      = \"graph\"\n\
      \  engine                  = \"neptune\"\n  backup_retention_period = 7\n  preferred_backup_window\
      \ = \"03:00-04:00\"\n}\n"
CKV_AWS_362:
  aws_neptune_cluster:
    cli: "aws neptune modify-db-cluster --db-cluster-identifier graph --copy-tags-to-snapshot --apply-immediately\n\
      Existing snapshots are not retagged; tag them directly with `aws neptune add-tags-to-resource`.\n"
    terraform: "resource \"aws_neptune_cluster\" \"graph\" {\n  cluster_identifier    = \"graph\"\n  engine\
      \                = \"neptune\"\n  copy_tags_to_snapshot = true\n\n  tags = {\n    Owner       =\
      \ \"platform\"\n    Environment = \"prod\"\n  }\n}\n"
CKV_AWS_363:
  aws_lambda_function:
    cli: "aws lambda list-functions --query 'Functions[?Runtime!=`null`].[FunctionName,Runtime]' --output\
      \ table\naws lambda update-function-configuration --function-name example --runtime python3.12\n"
    note: Changing the runtime is a configuration change, not a redeploy, but the deployment package has
      to be compatible with the new runtime first — update the code, then the runtime, or the function
      starts erroring on the next invocation. Container-image functions have no runtime setting and are
      out of scope for this check; their base image is what has to be rebuilt.
    terraform: "resource \"aws_lambda_function\" \"example\" {\n  function_name = \"example\"\n  role\
      \          = aws_iam_role.lambda.arn\n  handler       = \"index.handler\"\n  runtime       = \"\
      python3.12\"\n  filename      = \"function.zip\"\n\n  tracing_config {\n    mode = \"Active\"\n\
      \  }\n}\n"
CKV_AWS_37:
  aws_eks_cluster:
    cli: "aws eks update-cluster-config --name <cluster> --logging '{\"clusterLogging\":[{\"types\":[\"\
      api\",\"audit\",\"authenticator\",\"controllerManager\",\"scheduler\"],\"enabled\":true}]}'\n"
    terraform: "resource \"aws_eks_cluster\" \"main\" {\n  name     = \"main\"\n  role_arn = aws_iam_role.cluster.arn\n\
      \  version  = \"1.31\"\n\n  enabled_cluster_log_types = [\n    \"api\",\n    \"audit\",\n    \"\
      authenticator\",\n    \"controllerManager\",\n    \"scheduler\",\n  ]\n\n  vpc_config {\n    subnet_ids\
      \ = var.private_subnet_ids\n  }\n}\n"
CKV_AWS_376:
  aws_elb:
    cli: "aws elb create-load-balancer-listeners --load-balancer-name <name> --listeners Protocol=HTTPS,LoadBalancerPort=443,InstanceProtocol=HTTPS,InstancePort=8443,SSLCertificateId=<acm-arn>\n\
      aws elb delete-load-balancer-listeners --load-balancer-name <name> --load-balancer-ports 80\n"
    note: 'Create the HTTPS listener before deleting the cleartext one, and move clients over before the
      delete — deleting a listener drops every connection on that port immediately and there is no redirect
      to catch them. Classic Load Balancers cannot redirect at all, so a workload that needs an HTTP-to-HTTPS
      redirect is a migration to an Application Load Balancer, not a listener edit. Check the instance_protocol
      leg too: it is a separate setting, not covered by this control, and an HTTPS front end talking cleartext
      to the instances leaves the inside of the VPC unencrypted.'
    terraform: "resource \"aws_elb\" \"example\" {\n  name    = \"example\"\n  subnets = var.public_subnet_ids\n\
      \n  listener {\n    lb_port            = 443\n    lb_protocol        = \"https\"\n    instance_port\
      \      = 8443\n    instance_protocol  = \"https\"\n    ssl_certificate_id = aws_acm_certificate.example.arn\n\
      \  }\n\n  # There is no lb_protocol = \"http\" listener. A redirect from 80 is not\n  # expressible\
      \ on a Classic Load Balancer, so if one is needed the\n  # right move is an Application Load Balancer\
      \ with a redirect action,\n  # not an HTTP listener here.\n}\n"
CKV_AWS_377:
  aws_route53domains_registered_domain:
    cli: "aws route53domains enable-domain-transfer-lock --domain-name example.com --region us-east-1\n"
    note: The transfer lock cannot be set during the first 60 days after registration or after a transfer
      in; the API rejects it until the domain leaves that window.
    terraform: "resource \"aws_route53domains_registered_domain\" \"example\" {\n  domain_name   = \"\
      example.com\"\n  transfer_lock = true\n  auto_renew    = true\n}\n"
CKV_AWS_378:
  aws_alb_target_group:
    note: aws_alb_target_group is an alias of aws_lb_target_group; the same fix applies.
    terraform: "resource \"aws_alb_target_group\" \"example\" {\n  name     = \"example\"\n  port    \
      \ = 443\n  protocol = \"HTTPS\"\n  vpc_id   = aws_vpc.example.id\n}\n"
  aws_lb_target_group:
    cli: No in-place fix — a target group's protocol is immutable. Create a new HTTPS target group, register
      the targets, then update the listener's default action to forward to it.
    note: The targets must actually terminate TLS before the switch, which usually means a certificate
      on the instance or task. Where the target cannot serve TLS and the segment is accepted risk, exempt
      the target group rather than leaving the finding unexplained.
    terraform: "resource \"aws_lb_target_group\" \"example\" {\n  name     = \"example\"\n  port     =\
      \ 443\n  protocol = \"HTTPS\"\n  vpc_id   = aws_vpc.example.id\n\n  health_check {\n    protocol\
      \ = \"HTTPS\"\n    path     = \"/healthz\"\n  }\n}\n"
CKV_AWS_379:
  aws_s3_bucket:
    cli: "aws s3api put-bucket-policy --bucket <name> --policy file://tls-only.json\n"
    terraform: "data \"aws_iam_policy_document\" \"tls_only\" {\n  statement {\n    effect    = \"Deny\"\
      \n    actions   = [\"s3:*\"]\n    resources = [aws_s3_bucket.example.arn, \"${aws_s3_bucket.example.arn}/*\"\
      ]\n\n    principals {\n      type        = \"*\"\n      identifiers = [\"*\"]\n    }\n\n    condition\
      \ {\n      test     = \"Bool\"\n      variable = \"aws:SecureTransport\"\n      values   = [\"false\"\
      ]\n    }\n  }\n}\n"
CKV_AWS_382:
  aws_security_group:
    cli: "aws ec2 authorize-security-group-egress --group-id <sg-id> --ip-permissions IpProtocol=tcp,FromPort=443,ToPort=443,PrefixListIds=[{PrefixListId=<pl-id>}]\n\
      aws ec2 revoke-security-group-egress --group-id <sg-id> --ip-permissions IpProtocol=-1,IpRanges=[{CidrIp=0.0.0.0/0}]\n"
    note: Order matters here in a way it does not for ingress. Authorize the replacement egress FIRST
      and revoke the open default second — revoking first severs every outbound connection the workload
      has, including the ones to AWS APIs it needs to keep running. Egress narrowing is the change most
      likely to break a working system, so establish what the workload actually talks to from VPC flow
      logs before doing it, and expect to need endpoints or prefix lists for AWS services.
    terraform: "resource \"aws_security_group\" \"app\" {\n  name   = \"app\"\n  vpc_id = aws_vpc.example.id\n\
      \n  # An egress block MUST be present. A security group whose Terraform\n  # declares none is given\
      \ the open \"-1 to 0.0.0.0/0\" default by EC2, and\n  # the HCL looks clean while the deployed group\
      \ is wide open.\n  egress {\n    description     = \"to the database\"\n    from_port       = 5432\n\
      \    to_port         = 5432\n    protocol        = \"tcp\"\n    security_groups = [aws_security_group.db.id]\n\
      \  }\n\n  egress {\n    description     = \"to AWS APIs via the VPC endpoints\"\n    from_port \
      \      = 443\n    to_port         = 443\n    protocol        = \"tcp\"\n    prefix_list_ids = [aws_vpc_endpoint.s3.prefix_list_id]\n\
      \  }\n}\n"
CKV_AWS_383:
  aws_bedrockagent_agent:
    cli: "aws bedrock-agent update-agent --agent-id <id> --guardrail-configuration guardrailIdentifier=<guardrail-id>,guardrailVersion=<version>\n"
    note: update-agent replaces the whole agent configuration, so the call must repeat agent-name, agent-resource-role-arn
      and foundation-model or they are cleared. The agent must also be re-prepared before the change is
      live.
    terraform: "resource \"aws_bedrockagent_agent\" \"assistant\" {\n  agent_name              = \"assistant\"\
      \n  agent_resource_role_arn = aws_iam_role.bedrock_agent.arn\n  foundation_model        = \"anthropic.claude-3-5-sonnet-20241022-v2:0\"\
      \n  instruction             = var.agent_instruction\n\n  guardrail_configuration {\n    guardrail_identifier\
      \ = aws_bedrock_guardrail.assistant.guardrail_id\n    guardrail_version    = aws_bedrock_guardrail.assistant.version\n\
      \  }\n}\n"
CKV_AWS_385:
  aws_sns_topic_policy:
    cli: "aws sns set-topic-attributes --topic-arn <topic-arn> --attribute-name Policy --attribute-value\
      \ file://topic-policy.json\n"
    note: Either remove the cross-account statement or constrain it. aws:PrincipalOrgID is the usual constraint
      inside an organization and keeps working as accounts are added and removed; aws:SourceArn, aws:SourceAccount
      and aws:PrincipalArn are the alternatives when the far side is not an org member. Any Condition
      takes the statement out of this control's scope, which mirrors what Checkov allows — so write the
      condition that actually expresses the agreement rather than the shortest one that clears the check,
      because nothing downstream will re-examine it.
    terraform: "resource \"aws_sns_topic_policy\" \"app\" {\n  arn = aws_sns_topic.app.arn\n\n  policy\
      \ = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [\n      {\n        Sid       =\
      \ \"PartnerSubscribe\"\n        Effect    = \"Allow\"\n        Principal = { AWS = \"arn:aws:iam::${var.partner_account_id}:role/consumer\"\
      \ }\n        Action    = [\"SNS:Subscribe\", \"SNS:Receive\"]\n        Resource  = aws_sns_topic.app.arn\n\
      \        Condition = {\n          StringEquals = { \"aws:PrincipalOrgID\" = var.organization_id\
      \ }\n        }\n      },\n    ]\n  })\n}\n"
CKV_AWS_39:
  aws_eks_cluster:
    cli: "aws eks update-cluster-config --name <cluster> --resources-vpc-config endpointPublicAccess=false,endpointPrivateAccess=true\n"
    note: Turning the public endpoint off without turning the private one on leaves the API server unreachable,
      so both are set together. Reaching a private-only endpoint needs a path into the VPC — a bastion,
      a VPN or Direct Connect — and anything that talks to the cluster from outside it, CI included, breaks
      the moment this lands unless that path exists first. Where the public endpoint has to stay, public_access_cidrs
      narrows it to known ranges; that is a mitigation and not a pass, and this check still reports it.
    terraform: "resource \"aws_eks_cluster\" \"main\" {\n  name     = \"main\"\n  role_arn = aws_iam_role.cluster.arn\n\
      \  version  = \"1.31\"\n\n  vpc_config {\n    subnet_ids              = var.private_subnet_ids\n\
      \    endpoint_public_access  = false\n    endpoint_private_access = true\n  }\n}\n"
CKV_AWS_393:
  aws_iam_role:
    cli: "aws iam update-assume-role-policy --role-name <role-name> --policy-document file://trust-policy.json\n"
    note: 'The org and repository segments of the sub claim must carry no wildcard; everything after them
      may, so repo:acme/widgets:* still pins the repository and passes, while repo:acme/* does not — note
      that Checkov 3.3.16 accepts repo:acme/*, so this control is stricter than the rule it is derived
      from and a Terraform scan will not warn you about the org-wide form. Constrain the aud claim to
      sts.amazonaws.com as well — it is not what this control reads, but an unconstrained aud is the other
      half of the same misconfiguration. Do NOT use a Null condition on sub: it asserts only that the
      claim exists, which is true of every GitHub token ever minted, and this control rejects it for that
      reason. Where several repositories legitimately need the role, list each sub value explicitly rather
      than widening to the org.'
    terraform: "resource \"aws_iam_role\" \"gha_deploy\" {\n  name = \"gha-deploy\"\n\n  assume_role_policy\
      \ = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [\n      {\n        Effect    =\
      \ \"Allow\"\n        Principal = { Federated = aws_iam_openid_connect_provider.github.arn }\n  \
      \      Action    = \"sts:AssumeRoleWithWebIdentity\"\n        Condition = {\n          StringEquals\
      \ = {\n            \"token.actions.githubusercontent.com:aud\" = \"sts.amazonaws.com\"\n       \
      \   }\n          StringLike = {\n            \"token.actions.githubusercontent.com:sub\" = \"repo:acme/widgets:ref:refs/heads/main\"\
      \n          }\n        }\n      },\n    ]\n  })\n}\n"
CKV_AWS_44:
  aws_neptune_cluster:
    cli: "There is no in-place fix. Neptune storage encryption is set at creation\nonly. Take a snapshot,\
      \ restore it into a new encrypted cluster, then\ncut over and delete the original:\naws neptune\
      \ create-db-cluster-snapshot --db-cluster-identifier graph --db-cluster-snapshot-identifier graph-migrate\n\
      aws neptune restore-db-cluster-from-snapshot --db-cluster-identifier graph-enc --snapshot-identifier\
      \ graph-migrate --engine neptune --storage-encrypted --kms-key-id <key-arn>\n"
    terraform: "resource \"aws_neptune_cluster\" \"graph\" {\n  cluster_identifier                  =\
      \ \"graph\"\n  engine                              = \"neptune\"\n  storage_encrypted          \
      \         = true\n  kms_key_arn                         = aws_kms_key.neptune.arn\n  backup_retention_period\
      \             = 7\n  iam_database_authentication_enabled = true\n  copy_tags_to_snapshot       \
      \        = true\n  skip_final_snapshot                 = false\n  final_snapshot_identifier    \
      \       = \"graph-final\"\n}\n"
CKV_AWS_46:
  aws_instance:
    cli: "Rotate the exposed credential FIRST -- it is readable by anything that can\nreach the metadata\
      \ service. Then replace the instance with corrected user\ndata; user data can only be changed while\
      \ the instance is stopped, and the\nold value remains in any snapshot taken before the rotation.\n"
    terraform: "resource \"aws_instance\" \"app\" {\n  ami           = var.ami_id\n  instance_type = \"\
      t3.micro\"\n\n  # Fetch at boot with the instance role. Never interpolate a secret into\n  # user_data:\
      \ Terraform would also write it to state in cleartext.\n  user_data = <<-EOT\n    #!/bin/bash\n\
      \    TOKEN=$(aws secretsmanager get-secret-value \\\n      --secret-id app/db --query SecretString\
      \ --output text)\n  EOT\n\n  iam_instance_profile = aws_iam_instance_profile.app.name\n}\n"
  aws_launch_configuration:
    terraform: "resource \"aws_launch_configuration\" \"app\" {\n  name_prefix = \"app-\"\n  image_id\
      \    = var.ami_id\n\n  user_data = file(\"${path.module}/bootstrap.sh\")\n}\n"
  aws_launch_template:
    terraform: "resource \"aws_launch_template\" \"app\" {\n  name_prefix = \"app-\"\n  image_id    =\
      \ var.ami_id\n\n  user_data = base64encode(file(\"${path.module}/bootstrap.sh\"))\n}\n"
CKV_AWS_47:
  aws_dax_cluster:
    note: No in-place fix. Encryption at rest can only be enabled when the cluster is created, so the
      Terraform change replaces the cluster. The cache repopulates from DynamoDB, so no data is lost in
      the replacement.
    terraform: "resource \"aws_dax_cluster\" \"cache\" {\n  cluster_name       = \"cache\"\n  iam_role_arn\
      \       = aws_iam_role.dax.arn\n  node_type          = \"dax.r5.large\"\n  replication_factor =\
      \ 3\n\n  server_side_encryption {\n    enabled = true\n  }\n}\n"
CKV_AWS_5:
  aws_elasticsearch_domain:
    cli: "aws es update-elasticsearch-domain-config --domain-name <name> --encryption-at-rest-options\
      \ Enabled=true,KmsKeyId=<key-arn>\n"
    note: Encryption at rest cannot be turned on for an existing domain in every engine version; where
      the update is rejected the domain must be recreated and reindexed, so treat this as a migration
      rather than a setting change.
    terraform: "resource \"aws_elasticsearch_domain\" \"search\" {\n  domain_name           = \"search\"\
      \n  elasticsearch_version = \"7.10\"\n\n  encrypt_at_rest {\n    enabled    = true\n    kms_key_id\
      \ = aws_kms_key.search.arn\n  }\n}\n"
  aws_opensearch_domain:
    cli: "aws opensearch update-domain-config --domain-name <name> --encryption-at-rest-options Enabled=true,KmsKeyId=<key-arn>\n"
    terraform: "resource \"aws_opensearch_domain\" \"search\" {\n  domain_name    = \"search\"\n  engine_version\
      \ = \"OpenSearch_2.11\"\n\n  encrypt_at_rest {\n    enabled    = true\n    kms_key_id = aws_kms_key.search.arn\n\
      \  }\n}\n"
CKV_AWS_50:
  aws_lambda_function:
    cli: "aws lambda update-function-configuration --function-name <name> --tracing-config Mode=Active\n"
    terraform: "resource \"aws_lambda_function\" \"example\" {\n  tracing_config {\n    mode = \"Active\"\
      \n  }\n}\n"
CKV_AWS_51:
  aws_ecr_repository:
    cli: "aws ecr put-image-tag-mutability --repository-name <name> --image-tag-mutability IMMUTABLE\n"
    terraform: "resource \"aws_ecr_repository\" \"example\" {\n  image_tag_mutability = \"IMMUTABLE\"\n\
      }\n"
CKV_AWS_58:
  aws_eks_cluster:
    cli: "aws eks associate-encryption-config --cluster-name <cluster> --encryption-config '[{\"resources\"\
      :[\"secrets\"],\"provider\":{\"keyArn\":\"<key-arn>\"}}]'\n"
    note: Association is one-way and cannot be undone or repointed at another key, and existing Secrets
      are only re-encrypted when they are next written — run a rewrite of every Secret after associating.
    terraform: "resource \"aws_eks_cluster\" \"main\" {\n  name     = \"main\"\n  role_arn = aws_iam_role.cluster.arn\n\
      \  version  = \"1.31\"\n\n  encryption_config {\n    resources = [\"secrets\"]\n\n    provider {\n\
      \      key_arn = aws_kms_key.eks.arn\n    }\n  }\n\n  vpc_config {\n    subnet_ids = var.private_subnet_ids\n\
      \  }\n}\n"
CKV_AWS_6:
  aws_elasticsearch_domain:
    cli: "aws es update-elasticsearch-domain-config --domain-name <name> --node-to-node-encryption-options\
      \ Enabled=true\n"
    note: Enabling node-to-node encryption on a running domain triggers a blue/green deployment; on older
      engine versions it is only settable at creation.
    terraform: "resource \"aws_elasticsearch_domain\" \"search\" {\n  domain_name           = \"search\"\
      \n  elasticsearch_version = \"7.10\"\n\n  node_to_node_encryption {\n    enabled = true\n  }\n}\n"
  aws_opensearch_domain:
    cli: "aws opensearch update-domain-config --domain-name <name> --node-to-node-encryption-options Enabled=true\n"
    terraform: "resource \"aws_opensearch_domain\" \"search\" {\n  domain_name    = \"search\"\n  engine_version\
      \ = \"OpenSearch_2.11\"\n\n  node_to_node_encryption {\n    enabled = true\n  }\n}\n"
CKV_AWS_60:
  aws_iam_role:
    cli: "aws iam update-assume-role-policy --role-name <name> --policy-document file://trust.json\n"
    note: The deployed trust policy is what this control reads, so a role widened in the console shows
      the finding even when the Terraform is correct. Re-applying the Terraform is the fix in that case,
      and the control is what tells you it is needed.
    terraform: "# A trust policy names WHO may assume the role. `\"AWS\" = \"*\"` names\n# everyone with\
      \ an AWS account, so scope it to the principals that need\n# it — and where a wildcard is genuinely\
      \ required, constrain it with a\n# Condition (aws:PrincipalOrgID, aws:SourceAccount, sts:ExternalId).\n\
      resource \"aws_iam_role\" \"example\" {\n  name = \"example\"\n\n  assume_role_policy = jsonencode({\n\
      \    Version = \"2012-10-17\"\n    Statement = [{\n      Effect = \"Allow\"\n      Principal = {\n\
      \        Service = \"ecs-tasks.amazonaws.com\"\n      }\n      Action = \"sts:AssumeRole\"\n   \
      \   Condition = {\n        StringEquals = { \"aws:SourceAccount\" = data.aws_caller_identity.current.account_id\
      \ }\n      }\n    }]\n  })\n}\n"
CKV_AWS_61:
  aws_iam_role:
    cli: "aws iam update-assume-role-policy --role-name <role-name> --policy-document file://trust-policy.json\n"
    note: Name the role or user that actually assumes this role rather than the account it lives in. Where
      the far side genuinely cannot commit to a single principal ARN, keep the account-level trust but
      add sts:ExternalId (or aws:PrincipalOrgID for an organization member) — that is the documented AWS
      pattern for third-party access and it is what turns "anyone in that account" into "the integration
      we agreed to". This control reports an own-account root trust too, because the deployed document
      cannot say which account was intended; an own-account root trust is still the whole account and
      is still worth narrowing.
    terraform: "resource \"aws_iam_role\" \"app\" {\n  name = \"app\"\n\n  assume_role_policy = jsonencode({\n\
      \    Version = \"2012-10-17\"\n    Statement = [\n      {\n        Effect    = \"Allow\"\n     \
      \   Principal = { AWS = \"arn:aws:iam::${var.partner_account_id}:role/partner-integration\" }\n\
      \        Action    = \"sts:AssumeRole\"\n        Condition = {\n          StringEquals = { \"sts:ExternalId\"\
      \ = var.external_id }\n        }\n      },\n    ]\n  })\n}\n"
CKV_AWS_62:
  aws_iam_policy:
    cli: "aws iam create-policy-version --policy-arn <arn> --policy-document file://policy.json --set-as-default\n"
    note: A policy is versioned, and this control reads the DEFAULT version. Creating a scoped version
      without --set-as-default leaves the administrative version in force, and the finding correctly persists.
    terraform: "# Replace the wildcard with the actions the workload actually calls, and\n# the ARNs it\
      \ actually touches. Where the action list genuinely has to be\n# broad, the resource list must not\
      \ be — and vice versa; it is the\n# combination of both stars that this rule is about.\nresource\
      \ \"aws_iam_policy\" \"example\" {\n  name = \"example\"\n\n  policy = jsonencode({\n    Version\
      \ = \"2012-10-17\"\n    Statement = [{\n      Effect = \"Allow\"\n      Action = [\n        \"s3:GetObject\"\
      ,\n        \"s3:PutObject\",\n      ]\n      Resource = [\"${aws_s3_bucket.example.arn}/*\"]\n \
      \   }]\n  })\n}\n"
CKV_AWS_63:
  aws_iam_policy:
    cli: "aws iam create-policy-version --policy-arn <policy-arn> --policy-document file://policy.json\
      \ --set-as-default\n"
    note: 'A managed policy is versioned: create-policy-version with --set-as-default is the edit, and
      the old version stays until you delete it (five versions is the limit, so prune with delete-policy-version).
      Enumerate the actions the workload actually calls rather than guessing — IAM Access Analyzer''s
      policy generation reads CloudTrail and writes the least-privilege document for you (`aws accessanalyzer
      start-policy-generation`). A prefixed wildcard such as s3:Get* does NOT trip this control; only
      the bare ''*'' and ''*:*'' do.'
    terraform: "resource \"aws_iam_policy\" \"app_s3\" {\n  name = \"app-s3\"\n\n  policy = jsonencode({\n\
      \    Version = \"2012-10-17\"\n    Statement = [\n      {\n        Effect   = \"Allow\"\n      \
      \  Action   = [\"s3:GetObject\", \"s3:PutObject\", \"s3:DeleteObject\"]\n        Resource = \"${aws_s3_bucket.app.arn}/*\"\
      \n      },\n    ]\n  })\n}\n"
CKV_AWS_64:
  aws_redshift_cluster:
    cli: "aws redshift modify-cluster --cluster-identifier <id> --encrypted --kms-key-id <key-arn>\n"
    terraform: "resource \"aws_redshift_cluster\" \"example\" {\n  encrypted  = true\n  kms_key_id = aws_kms_key.redshift.arn\n\
      }\n"
CKV_AWS_66:
  aws_cloudwatch_log_group:
    cli: "aws logs put-retention-policy --log-group-name <name> --retention-in-days 365\n"
    terraform: "resource \"aws_cloudwatch_log_group\" \"example\" {\n  retention_in_days = 365\n}\n"
CKV_AWS_67:
  aws_cloudtrail:
    cli: "aws cloudtrail update-trail --name org-trail --is-multi-region-trail --include-global-service-events\n"
    terraform: "resource \"aws_cloudtrail\" \"org\" {\n  name                          = \"org-trail\"\
      \n  s3_bucket_name                = aws_s3_bucket.trail.id\n  is_multi_region_trail         = true\n\
      \  include_global_service_events = true\n  enable_log_file_validation    = true\n}\n"
CKV_AWS_73:
  aws_api_gateway_stage:
    cli: "aws apigateway update-stage --rest-api-id <api-id> --stage-name prod --patch-operations op=replace,path=/tracingEnabled,value=true\n"
    note: X-Ray sampling is billed per trace, so a high-traffic stage wants a sampling rule rather than
      the default 1 request/second plus 5%. The setting lives on the STAGE, so a new stage created by
      a deployment pipeline starts with tracing off unless the pipeline sets it.
    terraform: "resource \"aws_api_gateway_stage\" \"example\" {\n  rest_api_id          = aws_api_gateway_rest_api.example.id\n\
      \  deployment_id        = aws_api_gateway_deployment.example.id\n  stage_name           = \"prod\"\
      \n  xray_tracing_enabled = true\n}\n"
CKV_AWS_74:
  aws_docdb_cluster:
    cli: "There is no in-place fix. DocumentDB storage encryption is set at\ncreation only. Snapshot,\
      \ restore encrypted, cut over, delete the original:\naws docdb create-db-cluster-snapshot --db-cluster-identifier\
      \ docs --db-cluster-snapshot-identifier docs-migrate\naws docdb restore-db-cluster-from-snapshot\
      \ --db-cluster-identifier docs-enc --snapshot-identifier docs-migrate --engine docdb --storage-encrypted\
      \ --kms-key-id <key-arn>\n"
    terraform: "resource \"aws_docdb_cluster\" \"docs\" {\n  cluster_identifier      = \"docs\"\n  engine\
      \                  = \"docdb\"\n  master_username         = var.master_username\n  master_password\
      \         = var.master_password\n  storage_encrypted       = true\n  kms_key_id              = aws_kms_key.docdb.arn\n\
      \  backup_retention_period = 7\n  skip_final_snapshot     = false\n  final_snapshot_identifier =\
      \ \"docs-final\"\n}\n"
CKV_AWS_76:
  aws_api_gateway_stage:
    cli: "aws apigateway update-stage --rest-api-id <api-id> --stage-name prod --patch-operations op=replace,path=/accessLogSettings/destinationArn,value=<log-group-arn>\
      \ op=replace,path=/accessLogSettings/format,value='$context.requestId'\n"
    terraform: "resource \"aws_cloudwatch_log_group\" \"apigw\" {\n  name              = \"/aws/apigateway/example\"\
      \n  retention_in_days = 365\n}\n\nresource \"aws_api_gateway_stage\" \"example\" {\n  rest_api_id\
      \   = aws_api_gateway_rest_api.example.id\n  deployment_id = aws_api_gateway_deployment.example.id\n\
      \  stage_name    = \"prod\"\n\n  access_log_settings {\n    destination_arn = aws_cloudwatch_log_group.apigw.arn\n\
      \    format          = jsonencode({ requestId = \"$context.requestId\", ip = \"$context.identity.sourceIp\"\
      , status = \"$context.status\" })\n  }\n}\n"
  aws_apigatewayv2_stage:
    cli: "aws apigatewayv2 update-stage --api-id <api-id> --stage-name prod --access-log-settings DestinationArn=<log-group-arn>,Format='$context.requestId'\n"
    terraform: "resource \"aws_apigatewayv2_stage\" \"example\" {\n  api_id      = aws_apigatewayv2_api.example.id\n\
      \  name        = \"prod\"\n  auto_deploy = true\n\n  access_log_settings {\n    destination_arn\
      \ = aws_cloudwatch_log_group.apigw.arn\n    format          = jsonencode({ requestId = \"$context.requestId\"\
      , status = \"$context.status\" })\n  }\n}\n"
CKV_AWS_79:
  aws_instance:
    cli: "aws ec2 modify-instance-metadata-options \\\n  --instance-id <id> --http-tokens required --http-endpoint\
      \ enabled\n"
    terraform: "resource \"aws_instance\" \"app\" {\n  ami           = var.ami_id\n  instance_type = \"\
      t3.micro\"\n\n  metadata_options {\n    http_endpoint = \"enabled\"\n    http_tokens   = \"required\"\
      \   # IMDSv2 only\n  }\n}\n"
  aws_launch_configuration:
    note: Launch configurations are immutable and deprecated by AWS in favour of launch templates; the
      fix replaces the configuration rather than editing it.
    terraform: "resource \"aws_launch_configuration\" \"app\" {\n  name_prefix   = \"app-\"\n  image_id\
      \      = var.ami_id\n  instance_type = \"t3.micro\"\n\n  metadata_options {\n    http_endpoint =\
      \ \"enabled\"\n    http_tokens   = \"required\"\n  }\n}\n"
  aws_launch_template:
    cli: "Create a new launch template version with the corrected metadata_options\nand update the consumers\
      \ to $Latest -- a version is immutable once created.\n"
    terraform: "resource \"aws_launch_template\" \"app\" {\n  name_prefix   = \"app-\"\n  image_id   \
      \   = var.ami_id\n  instance_type = \"t3.micro\"\n\n  metadata_options {\n    http_endpoint = \"\
      enabled\"\n    http_tokens   = \"required\"\n  }\n}\n"
CKV_AWS_8:
  aws_instance:
    cli: "aws ec2 create-snapshot --volume-id <vol>\naws ec2 copy-snapshot --source-snapshot-id <snap>\
      \ --encrypted \\\n  --source-region <region>\naws ec2 create-volume --snapshot-id <encrypted-snap>\
      \ \\\n  --availability-zone <az>\n# then detach the old volume and attach the new one\n"
    note: An attached volume cannot be encrypted in place; both paths replace the volume. Setting `encrypted
      = true` in Terraform on an existing instance forces replacement -- plan before applying.
    terraform: "resource \"aws_instance\" \"app\" {\n  ami           = var.ami_id\n  instance_type = \"\
      t3.micro\"\n\n  root_block_device {\n    encrypted  = true\n    kms_key_id = aws_kms_key.ebs.arn\
      \   # omit for the AWS-managed key\n  }\n\n  ebs_block_device {\n    device_name = \"/dev/sdb\"\n\
      \    encrypted   = true\n  }\n}\n"
  aws_launch_configuration:
    note: 'Immutable: the fix replaces the launch configuration and the instances the ASG launches from
      it.'
    terraform: "resource \"aws_launch_configuration\" \"app\" {\n  name_prefix   = \"app-\"\n  image_id\
      \      = var.ami_id\n  instance_type = \"t3.micro\"\n\n  root_block_device {\n    encrypted = true\n\
      \  }\n}\n"
CKV_AWS_81:
  aws_msk_cluster:
    cli: "aws kafka update-security --cluster-arn <arn> --current-version <version> --encryption-info\
      \ '{\"EncryptionInTransit\":{\"ClientBroker\":\"TLS\",\"InCluster\":true}}'\n"
    note: UpdateSecurity performs a rolling broker restart. Any producer or consumer still connecting
      on the plaintext port stops working the moment it completes, so move the clients first.
    terraform: "resource \"aws_msk_cluster\" \"events\" {\n  cluster_name           = \"events\"\n  kafka_version\
      \          = \"3.6.0\"\n  number_of_broker_nodes = 3\n\n  broker_node_group_info {\n    instance_type\
      \   = \"kafka.m5.large\"\n    client_subnets  = var.private_subnet_ids\n    security_groups = [aws_security_group.msk.id]\n\
      \    storage_info {\n      ebs_storage_info { volume_size = 100 }\n    }\n  }\n\n  encryption_info\
      \ {\n    encryption_at_rest_kms_key_arn = aws_kms_key.msk.arn\n    encryption_in_transit {\n   \
      \   client_broker = \"TLS\"    # not TLS_PLAINTEXT, not PLAINTEXT\n      in_cluster    = true\n\
      \    }\n  }\n}\n"
CKV_AWS_82:
  aws_athena_workgroup:
    cli: "aws athena update-work-group --work-group <name> --configuration-updates EnforceWorkGroupConfiguration=true\n"
    note: Enforcing the configuration overrides any client-side result location, so confirm callers are
      not relying on writing results to their own bucket before applying it.
    terraform: "resource \"aws_athena_workgroup\" \"analytics\" {\n  name = \"analytics\"\n\n  configuration\
      \ {\n    enforce_workgroup_configuration    = true\n    publish_cloudwatch_metrics_enabled = true\n\
      \n    result_configuration {\n      output_location = \"s3://${aws_s3_bucket.results.bucket}/output/\"\
      \n\n      encryption_configuration {\n        encryption_option = \"SSE_KMS\"\n        kms_key_arn\
      \       = aws_kms_key.athena.arn\n      }\n    }\n  }\n}\n"
