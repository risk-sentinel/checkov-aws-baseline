CKV_AWS_137:
  aws_elasticsearch_domain:
    note: There is no in-place fix. A domain is created either public or VPC-bound and cannot be moved
      between the two; closing this finding means creating a VPC domain, reindexing into it and retiring
      the public one.
    terraform: "resource \"aws_elasticsearch_domain\" \"search\" {\n  domain_name           = \"search\"\
      \n  elasticsearch_version = \"7.10\"\n\n  vpc_options {\n    subnet_ids         = var.private_subnet_ids\n\
      \    security_group_ids = [aws_security_group.search.id]\n  }\n}\n"
  aws_opensearch_domain:
    note: 'Same constraint as the Elasticsearch resource: public-to-VPC is a migration, not an update.'
    terraform: "resource \"aws_opensearch_domain\" \"search\" {\n  domain_name    = \"search\"\n  engine_version\
      \ = \"OpenSearch_2.11\"\n\n  vpc_options {\n    subnet_ids         = var.private_subnet_ids\n  \
      \  security_group_ids = [aws_security_group.search.id]\n  }\n}\n"
