    terraform: "resource \"aws_rds_global_cluster\" \"app\" {\n  global_cluster_identifier = \"app-global\"\
      \n  engine                    = \"aurora-postgresql\"\n  engine_version            = \"15.17\"\n\
      \  database_name             = \"app\"\n  storage_encrypted         = true\n  deletion_protection\
