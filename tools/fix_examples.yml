CKV_AWS_274:
  aws_iam_policy_attachment:
    cli: "# Who holds it right now — roles, users and groups, in one call.\naws iam list-entities-for-policy\
      \ --policy-arn arn:aws:iam::aws:policy/AdministratorAccess\naws iam detach-role-policy --role-name\
      \ <role> --policy-arn arn:aws:iam::aws:policy/AdministratorAccess\naws iam detach-user-policy --user-name\
      \ <user> --policy-arn arn:aws:iam::aws:policy/AdministratorAccess\naws iam detach-group-policy --group-name\
      \ <group> --policy-arn arn:aws:iam::aws:policy/AdministratorAccess\n"
    note: 'Create and attach the replacement BEFORE detaching, and verify the principal can still do its
      job — a detach here can lock out the only identity able to repair the account. Check IAM Identity
      Center too: an attachment made through a permission set is re-provisioned onto the AWSReservedSSO_*
      role after any manual detach, so it must be removed at the permission set (aws_ssoadmin_managed_policy_attachment)
      or it returns on the next sync. This control counts attachments and cannot be exempted per principal,
      so a break-glass role that must keep the policy is an accepted risk to record, not a finding to
      suppress.'
    terraform: "# Replace the AWS-managed AdministratorAccess attachment with a\n# customer-managed policy\
      \ scoped to what the principal actually does.\n# There is no in-place \"narrow AdministratorAccess\"\
      \ — the managed policy\n# is owned by AWS and cannot be edited — so the fix is always a swap.\n\
      resource \"aws_iam_policy\" \"platform_operate\" {\n  name        = \"platform-operate\"\n  description\
      \ = \"Day-two operations for the platform team\"\n\n  policy = jsonencode({\n    Version = \"2012-10-17\"\
      \n    Statement = [{\n      Effect   = \"Allow\"\n      Action   = [\"ecs:*\", \"logs:*\", \"cloudwatch:*\"\
      , \"ssm:GetParameter*\"]\n      Resource = \"*\"\n      Condition = {\n        StringEquals = {\n\
      \          \"aws:RequestedRegion\" = [\"us-east-1\"]\n        }\n      }\n    }]\n  })\n}\n\nresource\
      \ \"aws_iam_role_policy_attachment\" \"platform_operate\" {\n  role       = aws_iam_role.platform.name\n\
      \  policy_arn = aws_iam_policy.platform_operate.arn\n}\n\n# If a break-glass administrator is genuinely\
      \ required, give it its own\n# role with a hard condition rather than leaving the managed policy\
      \ on a\n# day-to-day principal.\nresource \"aws_iam_role\" \"break_glass\" {\n  name = \"break-glass-admin\"\
      \n\n  assume_role_policy = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [{\n    \
      \  Effect    = \"Allow\"\n      Principal = { AWS = \"arn:${data.aws_partition.current.partition}:iam::${data.aws_caller_identity.current.account_id}:root\"\
      \ }\n      Action    = \"sts:AssumeRole\"\n      Condition = {\n        Bool           = { \"aws:MultiFactorAuthPresent\"\
      \ = \"true\" }\n        NumericLessThan = { \"aws:MultiFactorAuthAge\" = \"900\" }\n      }\n  \
      \  }]\n  })\n}\n"
CKV_AWS_277:
  aws_security_group:
    cli: "aws ec2 revoke-security-group-ingress --group-id <sg-id> --ip-permissions IpProtocol=-1,IpRanges=[{CidrIp=0.0.0.0/0}]\n\
      aws ec2 revoke-security-group-ingress --group-id <sg-id> --ip-permissions IpProtocol=-1,Ipv6Ranges=[{CidrIpv6=::/0}]\n"
    note: An IpProtocol of "-1" is revoked as a protocol, not as a port range — there are no FromPort
      or ToPort members on the stored permission to name. Revoke it before writing the replacement rules
      if the exposure is live; otherwise write the narrow rules first so nothing is interrupted, then
      revoke. Confirm what was actually reaching the instance (VPC flow logs, or the load balancer's target
      health) before assuming the narrow set is complete.
    terraform: "resource \"aws_security_group\" \"app\" {\n  name   = \"app\"\n  vpc_id = aws_vpc.example.id\n\
      \n  # No protocol = \"-1\" ingress block, and no cidr_blocks = [\"0.0.0.0/0\"].\n  # Every port\
      \ that must be reachable is named, with the source that is\n  # allowed to reach it.\n  ingress\
      \ {\n    description     = \"app traffic from the ALB\"\n    from_port       = 8443\n    to_port\
      \         = 8443\n    protocol        = \"tcp\"\n    security_groups = [aws_security_group.alb.id]\n\
      \  }\n}\n"
