CKV_AWS_105:
  aws_redshift_parameter_group:
    cli: "aws redshift modify-cluster-parameter-group --parameter-group-name <group> --parameters ParameterName=require_ssl,ParameterValue=true\n\
      aws redshift reboot-cluster --cluster-identifier <cluster>\n"
    note: 'require_ssl has apply-type static, so the parameter change is pending until the cluster is
      rebooted — the group reports the new value and the cluster keeps accepting cleartext until then.
      This control reads the group, so it will report compliant during that window. And default.redshift-1.0
      cannot be modified at all: a cluster sitting on the default group needs a new custom group plus
      `aws redshift modify-cluster --cluster-parameter-group-name <group>` and a reboot, not a parameter
      edit.'
    terraform: "resource \"aws_redshift_parameter_group\" \"tls\" {\n  name   = \"redshift-require-ssl\"\
      \n  family = \"redshift-1.0\"\n\n  parameter {\n    name  = \"require_ssl\"\n    value = \"true\"\
      \n  }\n}\n\nresource \"aws_redshift_cluster\" \"example\" {\n  # ...\n  cluster_parameter_group_name\
      \ = aws_redshift_parameter_group.tls.name\n}\n"
