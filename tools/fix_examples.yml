CKV_AWS_298:
  aws_dms_s3_endpoint:
    cli: "aws dms modify-endpoint --endpoint-arn <endpoint-arn> --s3-settings BucketName=<bucket>,ServiceAccessRoleArn=<role-arn>,EncryptionMode=SSE_KMS,ServerSideEncryptionKmsKeyId=<key-arn>\n"
    note: modify-endpoint REPLACES the whole S3Settings structure rather than merging into it, so every
      setting the endpoint already has must be resent in the same call or it is silently reset to its
      default. Note also that AWS allows changing EncryptionMode from SSE_KMS back to SSE_S3 but not from
