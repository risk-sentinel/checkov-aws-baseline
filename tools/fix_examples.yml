      aws neptune create-db-cluster-snapshot --db-cluster-identifier graph --db-cluster-snapshot-identifier
      graph-migrate

      aws neptune restore-db-cluster-from-snapshot --db-cluster-identifier graph-enc --snapshot-identifier
      graph-migrate --engine neptune --storage-encrypted --kms-key-id <key-arn>

      '
    terraform: "resource \"aws_neptune_cluster\" \"graph\" {\n  cluster_identifier                  =\
      \ \"graph\"\n  engine                              = \"neptune\"\n  storage_encrypted          \
      \         = true\n  kms_key_arn                         = aws_kms_key.neptune.arn\n  backup_retention_period\
      \             = 7\n  iam_database_authentication_enabled = true\n  copy_tags_to_snapshot       \
      \        = true\n  skip_final_snapshot                 = false\n  final_snapshot_identifier    \
      \       = \"graph-final\"\n}\n"
CKV_AWS_46:
  aws_instance:
    cli: 'Rotate the exposed credential FIRST -- it is readable by anything that can

      reach the metadata service. Then replace the instance with corrected user

      data; user data can only be changed while the instance is stopped, and the

      old value remains in any snapshot taken before the rotation.

      '
    terraform: "resource \"aws_instance\" \"app\" {\n  ami           = var.ami_id\n  instance_type = \"\
      t3.micro\"\n\n  # Fetch at boot with the instance role. Never interpolate a secret into\n  # user_data:\
      \ Terraform would also write it to state in cleartext.\n  user_data = <<-EOT\n    #!/bin/bash\n\
      \    TOKEN=$(aws secretsmanager get-secret-value \\\n      --secret-id app/db --query SecretString\
      \ --output text)\n  EOT\n\n  iam_instance_profile = aws_iam_instance_profile.app.name\n}\n"
  aws_launch_configuration:
    terraform: "resource \"aws_launch_configuration\" \"app\" {\n  name_prefix = \"app-\"\n  image_id\
      \    = var.ami_id\n\n  user_data = file(\"${path.module}/bootstrap.sh\")\n}\n"
  aws_launch_template:
    terraform: "resource \"aws_launch_template\" \"app\" {\n  name_prefix = \"app-\"\n  image_id    =\
      \ var.ami_id\n\n  user_data = base64encode(file(\"${path.module}/bootstrap.sh\"))\n}\n"
