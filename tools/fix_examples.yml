CKV2_AWS_8:
  aws_rds_cluster:
    cli: "aws backup start-backup-job --backup-vault-name <vault> --resource-arn <cluster-arn> --iam-role-arn\
      \ <role-arn>\n"
    note: The CLI line takes ONE on-demand backup and does not make the cluster covered going forward.
      Only a plan plus a selection does that, which is why the Terraform is the primary path here. Note
      also that this control asserts a recovery point EXISTS, so a newly-created selection stays failing
      until its plan first runs.
    terraform: "resource \"aws_backup_plan\" \"daily\" {\n  name = \"daily\"\n\n  rule {\n    rule_name\
      \         = \"daily\"\n    target_vault_name = aws_backup_vault.main.name\n    schedule        \
      \  = \"cron(0 5 * * ? *)\"\n\n    lifecycle {\n      delete_after = 35\n    }\n  }\n}\n\nresource\
      \ \"aws_backup_selection\" \"clusters\" {\n  iam_role_arn = aws_iam_role.backup.arn\n  name    \
      \     = \"rds-clusters\"\n  plan_id      = aws_backup_plan.daily.id\n  resources    = [aws_rds_cluster.main.arn]\n\
      }\n"
CKV2_AWS_9:
