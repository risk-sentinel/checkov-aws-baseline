CKV_AWS_92:
  aws_elb:
    cli: "aws elb modify-load-balancer-attributes --load-balancer-name app-elb --load-balancer-attributes\
      \ '{\"AccessLog\":{\"Enabled\":true,\"S3BucketName\":\"my-elb-logs\",\"EmitInterval\":60,\"S3BucketPrefix\"\
      :\"app-elb\"}}'\n"
    note: The log bucket needs a policy allowing the regional ELB account principal to PutObject, or the
