CKV_AWS_229:
  aws_network_acl:
    cli: "aws ec2 replace-network-acl-entry --network-acl-id <acl-id> --rule-number <n> --protocol tcp\
      \ --rule-action allow --ingress --cidr-block 10.0.0.0/16 --port-range From=443,To=443\naws ec2 delete-network-acl-entry\
      \ --network-acl-id <acl-id> --rule-number <n> --ingress\n"
    note: 'This control reads the ALLOW entries, so adding a deny rule at a lower number does not clear
      the finding — the offending entry has to be narrowed or deleted. Network ACLs are STATELESS: an
      ingress rule you tighten needs a matching egress rule for the ephemeral range (1024-65535) left
      in place or return traffic for every other connection breaks, which is why the egress block above
      is shown. And the entry this control most often reports is rule 100 on the VPC''s DEFAULT network
      ACL, which allows everything from 0.0.0.0/0 out of the box; Terraform manages that one as aws_default_network_acl,
      not aws_network_acl.'
    terraform: "resource \"aws_network_acl\" \"app\" {\n  vpc_id = aws_vpc.main.id\n\n  ingress {\n  \
      \  rule_no    = 100\n    protocol   = \"tcp\"\n    action     = \"allow\"\n    cidr_block = \"10.0.0.0/16\"\
      \n    from_port  = 443\n    to_port    = 443\n  }\n\n  egress {\n    rule_no    = 100\n    protocol\
      \   = \"tcp\"\n    action     = \"allow\"\n    cidr_block = \"0.0.0.0/0\"\n    from_port  = 1024\n\
      \    to_port    = 65535\n  }\n}\n"
CKV_AWS_23:
  aws_security_group_rule:
    cli: "aws ec2 modify-security-group-rules --group-id <sg-id> --security-group-rules 'SecurityGroupRuleId=<sgr-id>,SecurityGroupRule={Description=\"\
      HTTPS from the public ALB only\",IpProtocol=tcp,FromPort=443,ToPort=443,ReferencedGroupId=<sg-id>}'\n"
    note: modify-security-group-rules REPLACES the whole rule, so every field must be resupplied or it
      is reset. Read the rule with describe-security-group-rules first and echo its current values back
      with the description added. The inline ingress/egress blocks on aws_security_group also accept a
      description, so a group written that way is fixable in place too — but the inline blocks and the
      standalone rule resources cannot be mixed on one group.
    terraform: "resource \"aws_security_group_rule\" \"app_https\" {\n  security_group_id        = aws_security_group.app.id\n\
      \  description              = \"HTTPS from the public ALB only\"\n  type                     = \"\
      ingress\"\n  protocol                 = \"tcp\"\n  from_port                = 443\n  to_port   \
      \               = 443\n  source_security_group_id = aws_security_group.alb.id\n}\n"
  aws_vpc_security_group_ingress_rule:
    note: The aws_vpc_security_group_ingress_rule / _egress_rule pair is the current form and is what
      a new rule should use; aws_security_group_rule is retained by the provider but is no longer the
      recommended path. Both carry a per-rule description, and both land on the same SecurityGroupRule
      object this control reads, so either satisfies it.
    terraform: "resource \"aws_vpc_security_group_ingress_rule\" \"app_https\" {\n  security_group_id\
      \            = aws_security_group.app.id\n  description                  = \"HTTPS from the public\
      \ ALB only\"\n  ip_protocol                  = \"tcp\"\n  from_port                    = 443\n \
      \ to_port                      = 443\n  referenced_security_group_id = aws_security_group.alb.id\n\
      }\n"
CKV_AWS_230:
  aws_network_acl:
    cli: "aws ec2 replace-network-acl-entry --network-acl-id <acl-id> --rule-number <n> --protocol tcp\
      \ --rule-action allow --ingress --cidr-block 10.0.0.0/16 --port-range From=443,To=443\n"
    note: 'Same shape as the port 21 fix, and the same two traps: a deny rule at a lower number does not
      clear this finding because the control reads allow entries, and network ACLs are stateless so the
      ephemeral egress range must survive the edit. Closing 20 without closing 21 leaves FTP authentication
      exposed, so treat the pair together.'
    terraform: "resource \"aws_network_acl\" \"app\" {\n  vpc_id = aws_vpc.main.id\n\n  ingress {\n  \
      \  rule_no    = 100\n    protocol   = \"tcp\"\n    action     = \"allow\"\n    cidr_block = \"10.0.0.0/16\"\
      \n    from_port  = 443\n    to_port    = 443\n  }\n}\n"
CKV_AWS_231:
  aws_network_acl:
    cli: "aws ec2 replace-network-acl-entry --network-acl-id <acl-id> --rule-number <n> --protocol tcp\
      \ --rule-action allow --ingress --cidr-block 10.0.0.0/16 --port-range From=3389,To=3389\n"
    note: Narrowing the CIDR to the management network is the minimum. The better answer is to remove
      the entry entirely and reach Windows hosts through Systems Manager Session Manager, which needs
      no inbound rule at any layer and produces a session log; that also removes the bastion whose own
      ingress rule would otherwise inherit this finding. Network ACLs are stateless, so keep the ephemeral
      egress range when editing.
    terraform: "resource \"aws_network_acl\" \"app\" {\n  vpc_id = aws_vpc.main.id\n\n  ingress {\n  \
      \  rule_no    = 100\n    protocol   = \"tcp\"\n    action     = \"allow\"\n    cidr_block = \"10.0.0.0/16\"\
      \n    from_port  = 3389\n    to_port    = 3389\n  }\n}\n"
