CKV_AWS_319:
  aws_cloudwatch_metric_alarm:
    cli: "aws cloudwatch enable-alarm-actions --alarm-names app-high-5xx\n"
    note: Enabling actions on an alarm that has no alarm_actions changes nothing observable. Check that
      the action list is non-empty at the same time.
    terraform: "resource \"aws_cloudwatch_metric_alarm\" \"high_5xx\" {\n  alarm_name          = \"app-high-5xx\"\
      \n  namespace           = \"AWS/ApplicationELB\"\n  metric_name         = \"HTTPCode_Target_5XX_Count\"\
      \n  statistic           = \"Sum\"\n  period              = 300\n  evaluation_periods  = 2\n  threshold\
      \           = 10\n  comparison_operator = \"GreaterThanThreshold\"\n  treat_missing_data  = \"notBreaching\"\
      \n\n  actions_enabled = true                       # the default; state it\n  alarm_actions   =\
      \ [aws_sns_topic.alerts.arn]\n  ok_actions      = [aws_sns_topic.alerts.arn]\n}\n"
CKV_AWS_32:
  aws_ecr_repository_policy:
    cli: "aws ecr set-repository-policy --repository-name <name> --policy-text file://policy.json\n# Or,\
      \ where nothing outside the account should pull at all, remove it entirely:\naws ecr delete-repository-policy\
      \ --repository-name <name>\n"
    note: A repository with NO policy is not a finding — access then falls back to IAM, which is the safe
      default. Deleting the policy is a legitimate fix, not a workaround.
    terraform: "# Name the accounts and roles that may pull, and nothing else. Where the\n# images really\
      \ are public, use ECR Public (aws_ecrpublic_repository) —\n# a wildcard principal on a private repository\
      \ is an accident, not a\n# publishing decision.\nresource \"aws_ecr_repository_policy\" \"example\"\
      \ {\n  repository = aws_ecr_repository.example.name\n\n  policy = jsonencode({\n    Version = \"\
      2012-10-17\"\n    Statement = [{\n      Sid    = \"PullFromThisOrganisation\"\n      Effect = \"\
      Allow\"\n      Principal = {\n        AWS = [\"arn:aws:iam::111122223333:root\"]\n      }\n    \
      \  Action = [\n        \"ecr:GetDownloadUrlForLayer\",\n        \"ecr:BatchGetImage\",\n       \
      \ \"ecr:BatchCheckLayerAvailability\",\n      ]\n      Condition = {\n        StringEquals = { \"\
      aws:PrincipalOrgID\" = \"o-abcd1234\" }\n      }\n    }]\n  })\n}\n"
CKV_AWS_320:
  aws_redshift_cluster:
    cli: "Set at creation; renaming requires a new cluster.\n"
    terraform: "resource \"aws_redshift_cluster\" \"example\" {\n  database_name = \"analytics\"\n}\n"
