CKV_AWS_169:
  aws_sns_topic_policy:
    cli: "aws sns set-topic-attributes --topic-arn <topic-arn> --attribute-name Policy --attribute-value\
      \ file://topic-policy.json\n"
    note: 'set-topic-attributes REPLACES the Policy attribute, so start from the current one (`aws sns
      get-topic-attributes --topic-arn <arn> --query ''Attributes.Policy'' --output text`). Do not delete
      the AWS-written default statement while narrowing the others — it is the one that lets the account
      manage its own topic, and it is already conditioned on AWS:SourceOwner so this control does not
      report it. Where a wildcard principal is genuinely needed (an S3 bucket or an SES rule publishing
      to the topic), the fix is the Condition, not the Principal: aws:SourceArn plus aws:SourceAccount
      both scopes the grant and takes the statement out of scope here.'
    terraform: "resource \"aws_sns_topic_policy\" \"app\" {\n  arn = aws_sns_topic.app.arn\n\n  policy\
      \ = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [\n      {\n        Sid       =\
      \ \"AllowOwnerPublish\"\n        Effect    = \"Allow\"\n        Principal = { AWS = aws_iam_role.publisher.arn\
      \ }\n        Action    = \"SNS:Publish\"\n        Resource  = aws_sns_topic.app.arn\n      },\n\
      \      {\n        Sid       = \"AllowServicePublish\"\n        Effect    = \"Allow\"\n        Principal\
      \ = { Service = \"s3.amazonaws.com\" }\n        Action    = \"SNS:Publish\"\n        Resource  =\
      \ aws_sns_topic.app.arn\n        Condition = {\n          ArnLike      = { \"aws:SourceArn\" = aws_s3_bucket.app.arn\
      \ }\n          StringEquals = { \"aws:SourceAccount\" = data.aws_caller_identity.current.account_id\
      \ }\n        }\n      },\n    ]\n  })\n}\n"
