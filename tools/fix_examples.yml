CKV_AWS_260:
  aws_security_group:
    cli: "aws ec2 revoke-security-group-ingress --group-id <sg-id> --protocol tcp --port 80 --cidr 0.0.0.0/0\n\
      aws ec2 revoke-security-group-ingress --group-id <sg-id> --ip-permissions IpProtocol=tcp,FromPort=80,ToPort=80,Ipv6Ranges=[{CidrIpv6=::/0}]\n"
    note: The revoke closes the exposure now and the next terraform apply reopens it if the HCL still
      carries the rule, so the CLI is containment and the Terraform change is the fix. A permission whose
      range merely SPANS 80 — 0-65535, or an IpProtocol of "-1", which AWS stores with no ports at all
      — must be revoked with the range it was created with, not with --port 80. If the world genuinely
      must reach 80, put an ALB in front and move the rule to the ALB's security group rather than widening
      this one.
    terraform: "resource \"aws_security_group\" \"web\" {\n  name   = \"web\"\n  vpc_id = aws_vpc.example.id\n\
      \n  # HTTP arrives from the load balancer's security group, never from a\n  # CIDR. There is no\
      \ ingress block carrying cidr_blocks = [\"0.0.0.0/0\"];\n  # the public edge is the ALB, and it\
      \ is the only thing that should be\n  # able to reach 80 here.\n  ingress {\n    description   \
      \  = \"HTTP from the public ALB\"\n    from_port       = 80\n    to_port         = 80\n    protocol\
      \        = \"tcp\"\n    security_groups = [aws_security_group.alb.id]\n  }\n}\n"
