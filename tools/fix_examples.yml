    note: Shortening the interval takes effect from the NEXT rotation, so a secret that last rotated 300
      days ago is not brought current by this change alone — run `rotate-secret` once to force a rotation
      now. Secrets owned by another service (OwningService set, e.g. an RDS-managed master password) rotate
      under that service's schedule and should be exempted rather than given a second rotator.
    terraform: "resource \"aws_secretsmanager_secret\" \"db\" {\n  name = \"platform/db/master\"\n}\n\n\
      resource \"aws_secretsmanager_secret_rotation\" \"db\" {\n  secret_id           = aws_secretsmanager_secret.db.id\n\
      \  rotation_lambda_arn = aws_lambda_function.rotator.arn\n\n  rotation_rules {\n    # 90 is the\
      \ ceiling, not the target. Pick the shortest interval the\n    # consuming application can tolerate\
      \ a credential change at.\n    automatically_after_days = 30\n  }\n}\n"
