      \    instance_protocol  = \"https\"\n    lb_port            = 443\n    lb_protocol        = \"https\"\
      \n    ssl_certificate_id = aws_acm_certificate.app.arn\n  }\n\n  access_logs {\n    enabled    \
      \   = true\n    bucket        = aws_s3_bucket.elb_logs.id\n    bucket_prefix = \"app-elb\"\n   \
      \ interval      = 60\n  }\n}\n"
