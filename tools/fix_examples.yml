CKV_AWS_127:
  aws_elb:
    cli: "aws elb delete-load-balancer-listeners --load-balancer-name <name> --load-balancer-ports 80\n\
      aws elb create-load-balancer-listeners --load-balancer-name <name> --listeners Protocol=HTTPS,LoadBalancerPort=443,InstanceProtocol=HTTPS,InstancePort=8443,SSLCertificateId=<acm-arn>\n"
    note: There is no in-place fix for a plaintext listener. set-load-balancer-listener-ssl-certificate
      swaps the certificate on a listener that already speaks HTTPS or SSL and cannot promote an HTTP
      one, so the listener is deleted and recreated — which drops connections on that port. Classic ELB
      is also the legacy product; on anything still being developed the durable answer is an application
      or network load balancer, where the redirect is a listener rule rather than a second plaintext listener.
    terraform: "resource \"aws_elb\" \"example\" {\n  name    = \"example\"\n  subnets = [aws_subnet.example.id]\n\
      \n  # Every listener terminates TLS. A plaintext listener alongside these is\n  # what fails the\
      \ check, so the HTTP-to-HTTPS redirect belongs in the\n  # application or on an ALB, not as a second\
      \ listener here.\n  listener {\n    lb_port            = 443\n    lb_protocol        = \"https\"\
      \n    instance_port      = 8443\n    instance_protocol  = \"https\"\n    ssl_certificate_id = aws_acm_certificate.example.arn\n\
      \  }\n}\n"
