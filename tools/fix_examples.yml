CKV2_AWS_10:
  aws_cloudtrail:
    cli: "aws cloudtrail update-trail --name <trail> --cloud-watch-logs-log-group-arn <log-group-arn>:*\
      \ --cloud-watch-logs-role-arn <role-arn>\n"
    note: Two things bite here. The log group ARN must carry the trailing ":*" or CloudTrail rejects it,
      and the role in cloud_watch_logs_role_arn must trust cloudtrail.amazonaws.com and hold logs:CreateLogStream
      and logs:PutLogEvents on that group. Without the role the trail still reports the group and delivers
      nothing, which this control cannot see.
    terraform: "resource \"aws_cloudwatch_log_group\" \"trail\" {\n  name              = \"/aws/cloudtrail/org\"\
      \n  retention_in_days = 365\n}\n\nresource \"aws_cloudtrail\" \"org\" {\n  name                \
      \          = \"org-trail\"\n  s3_bucket_name                = aws_s3_bucket.trail.id\n  is_multi_region_trail\
      \         = true\n  enable_log_file_validation    = true\n  cloud_watch_logs_group_arn    = \"${aws_cloudwatch_log_group.trail.arn}:*\"\
      \n  cloud_watch_logs_role_arn     = aws_iam_role.trail_to_cwl.arn\n}\n"
CKV2_AWS_11:
  aws_vpc:
    cli: "aws ec2 create-flow-logs --resource-type VPC --resource-ids <vpc-id> --traffic-type ALL --log-destination-type\
      \ cloud-watch-logs --log-group-name <group> --deliver-logs-permission-arn <role-arn>\n"
    note: 'Use traffic_type = "ALL": REJECT alone hides successful lateral movement and ACCEPT alone hides
      the scanning that preceded it. An S3 or Data Firehose destination satisfies this control equally
      — it asserts that a flow log exists for the VPC, not where it lands.'
    terraform: "resource \"aws_flow_log\" \"main\" {\n  vpc_id                   = aws_vpc.main.id\n \
      \ traffic_type             = \"ALL\"\n  log_destination_type     = \"cloud-watch-logs\"\n  log_destination\
      \          = aws_cloudwatch_log_group.flow.arn\n  iam_role_arn             = aws_iam_role.flow_logs.arn\n\
      \  max_aggregation_interval = 60\n}\n"
CKV2_AWS_14:
  aws_iam_group_membership:
    cli: "aws iam add-user-to-group --group-name <group> --user-name <user>\n"
    note: Deleting the group is the other valid remediation and usually the right one. Note that aws_iam_group_membership
      is authoritative — it removes any user it does not list — whereas aws_iam_user_group_membership
      is not; mixing the two silently drops members on the next apply.
    terraform: "resource \"aws_iam_group_membership\" \"engineers\" {\n  name  = \"engineers-membership\"\
      \n  group = aws_iam_group.engineers.name\n  users = [aws_iam_user.alice.name]\n}\n"
CKV2_AWS_18:
  aws_backup_selection:
    cli: "aws backup start-backup-job --backup-vault-name <vault> --resource-arn <file-system-arn> --iam-role-arn\
      \ <role-arn>\n"
    note: EFS also has its own automatic backups, which write to an AWS-managed vault. Those do NOT appear
      as an AWS Backup protected resource in every case, so a file system relying on them alone can fail
      this control; confirm which mechanism is in use before treating a failure as a gap.
    terraform: "resource \"aws_backup_selection\" \"efs\" {\n  iam_role_arn = aws_iam_role.backup.arn\n\
      \  name         = \"efs-file-systems\"\n  plan_id      = aws_backup_plan.daily.id\n  resources \
      \   = [aws_efs_file_system.shared.arn]\n}\n"
CKV2_AWS_19:
  aws_eip_association:
    cli: "aws ec2 release-address --allocation-id <alloc-id>\n"
    note: The CLI shown is the release, not the association, because a dangling Elastic IP is far more
      often garbage than a missing wiring. Releasing is irreversible — the address returns to the pool
      and cannot be reclaimed — so confirm no DNS record or partner allow-list still names it. To keep
      it, associate it with `aws ec2 associate-address` instead.
    terraform: "resource \"aws_eip_association\" \"app\" {\n  allocation_id        = aws_eip.app.id\n\
      \  network_interface_id = aws_network_interface.app.id\n}\n"
CKV2_AWS_22:
  aws_iam_user:
    cli: "aws iam delete-login-profile --user-name <user>\n"
    note: Deleting the login profile removes console access only; the user's access keys still work, so
      audit those separately. If the user is a person rather than a service identity, the real remediation
      is to delete the IAM user and grant them a federated role.
    terraform: "# The fix is the ABSENCE of a login profile. Remove any\n# aws_iam_user_login_profile\
      \ for this user and let humans reach the\n# console through federation instead.\nresource \"aws_iam_user\"\
      \ \"svc\" {\n  name = \"svc-deploy\"\n  tags = { console_access = \"none\" }\n}\n"
CKV2_AWS_3:
  aws_guardduty_detector:
    cli: "aws guardduty create-detector --enable --finding-publishing-frequency FIFTEEN_MINUTES\n"
    note: GuardDuty is per-region; enable it in every region in use, not only the primary.
    terraform: "resource \"aws_guardduty_detector\" \"example\" {\n  enable                       = true\n\
      \  finding_publishing_frequency = \"FIFTEEN_MINUTES\"\n\n  datasources {\n    s3_logs { enable =\
      \ true }\n    kubernetes { audit_logs { enable = true } }\n    malware_protection {\n      scan_ec2_instance_with_findings\
      \ { ebs_volumes { enable = true } }\n    }\n  }\n}\n"
CKV2_AWS_32:
  aws_cloudfront_distribution:
    note: 'There is no single CLI call for this. The distribution config is read-modify-written whole:
      `aws cloudfront get-distribution-config --id <id>` gives the config and an ETag, the ResponseHeadersPolicyId
      is added to DefaultCacheBehavior, and `aws cloudfront update-distribution --id <id> --if-match <etag>
      --distribution-config file://…` puts it back. Every field must be resent; anything omitted is cleared.'
    terraform: "resource \"aws_cloudfront_response_headers_policy\" \"secure\" {\n  name = \"secure-defaults\"\
      \n\n  security_headers_config {\n    strict_transport_security {\n      access_control_max_age_sec\
      \ = 63072000\n      include_subdomains         = true\n      preload                    = true\n\
      \      override                   = true\n    }\n    content_type_options { override = true }\n\
      \    frame_options {\n      frame_option = \"DENY\"\n      override     = true\n    }\n    referrer_policy\
      \ {\n      referrer_policy = \"same-origin\"\n      override        = true\n    }\n  }\n}\n\nresource\
      \ \"aws_cloudfront_distribution\" \"site\" {\n  enabled = true\n\n  default_cache_behavior {\n \
      \   target_origin_id           = \"s3-origin\"\n    viewer_protocol_policy     = \"redirect-to-https\"\
      \n    allowed_methods            = [\"GET\", \"HEAD\"]\n    cached_methods             = [\"GET\"\
      , \"HEAD\"]\n    cache_policy_id            = data.aws_cloudfront_cache_policy.optimized.id\n  \
      \  response_headers_policy_id = aws_cloudfront_response_headers_policy.secure.id\n  }\n\n  # ...\
      \ origin, restrictions and viewer_certificate blocks omitted\n}\n"
CKV2_AWS_34:
  aws_ssm_parameter:
    cli: "aws ssm put-parameter --name <name> --type SecureString --key-id <key-arn> --value <value> --overwrite\n"
    note: 'A parameter''s type cannot be changed in place by Terraform without replacement, and the value
      was already exposed as plaintext, so treat the existing value as compromised and rotate it rather
      than re-storing it encrypted. Give key_id a customer-managed key: the default alias/aws/ssm key
      cannot carry a key policy that limits who may decrypt.'
    terraform: "resource \"aws_ssm_parameter\" \"db_password\" {\n  name   = \"/app/prod/db_password\"\
      \n  type   = \"SecureString\"\n  key_id = aws_kms_key.params.arn\n  value  = var.db_password\n}\n"
CKV2_AWS_41:
  aws_instance:
    cli: "aws ec2 associate-iam-instance-profile --instance-id <id> --iam-instance-profile Name=<profile>\n\
      This attaches in place, with no restart. Attaching a profile that contains no role satisfies the\
      \ association call and not this control: the role is the point.\n"
    note: An instance profile holds at most one role, and AWS allows an empty one. This control asserts
      the roles reachable through the attached profile, so creating the profile without `role = ...` still
      fails it.
    terraform: "resource \"aws_iam_role\" \"instance\" {\n  name               = \"app-instance\"\n  assume_role_policy\
      \ = data.aws_iam_policy_document.ec2_assume.json\n}\n\nresource \"aws_iam_instance_profile\" \"\
      instance\" {\n  name = \"app-instance\"\n  role = aws_iam_role.instance.name\n}\n\nresource \"aws_instance\"\
      \ \"app\" {\n  ami                  = data.aws_ami.al2023.id\n  instance_type        = \"t3.small\"\
      \n  iam_instance_profile = aws_iam_instance_profile.instance.name\n\n  metadata_options {\n    http_tokens\
      \   = \"required\"\n    http_endpoint = \"enabled\"\n  }\n}\n"
CKV2_AWS_42:
  aws_cloudfront_distribution:
    cli: "aws cloudfront get-distribution-config --id <dist-id> > dist.json\n"
    note: 'There is no single update call: CloudFront requires the full distribution config plus its ETag,
      so edit the ViewerCertificate block of the fetched JSON and send it back with `aws cloudfront update-distribution
      --if-match <etag>`. The ACM certificate must be issued in us-east-1 whatever region the rest of
      the stack lives in, and the distribution needs an `aliases` entry matching the certificate.'
    terraform: "resource \"aws_cloudfront_distribution\" \"site\" {\n  aliases = [\"www.example.com\"\
      ]\n\n  viewer_certificate {\n    acm_certificate_arn      = aws_acm_certificate.site.arn\n    ssl_support_method\
      \       = \"sni-only\"\n    minimum_protocol_version = \"TLSv1.2_2021\"\n  }\n}\n"
CKV2_AWS_49:
  aws_dms_endpoint:
    cli: aws dms modify-endpoint --endpoint-arn <arn> --ssl-mode verify-full --certificate-arn <cert-arn>
    note: verify-ca and verify-full need a certificate imported into DMS first (aws_dms_certificate /
      `aws dms import-certificate`); `require` encrypts without validating the server certificate and
      is the weakest setting that still satisfies the rule. Endpoints whose engine has no SSL concept
      (s3, dynamodb, kinesis, kafka, elasticsearch, neptune, redshift) cannot be fixed and belong in exempt_assets.
    terraform: "resource \"aws_dms_endpoint\" \"example\" {\n  endpoint_id   = \"source-postgres\"\n \
      \ endpoint_type = \"source\"\n  engine_name   = \"postgres\"\n\n  # none | require | verify-ca |\
      \ verify-full\n  ssl_mode        = \"verify-full\"\n  certificate_arn = aws_dms_certificate.example.certificate_arn\n\
      }\n"
CKV2_AWS_50:
  aws_elasticache_replication_group:
    cli: aws elasticache modify-replication-group --replication-group-id <id> --automatic-failover-enabled
      --multi-az-enabled --apply-immediately
    note: Automatic failover requires at least two nodes in the group and is not available on cache.t1.*
      node types. Applying immediately triggers a failover test; without --apply-immediately the change
      lands in the next maintenance window.
    terraform: "resource \"aws_elasticache_replication_group\" \"example\" {\n  replication_group_id =\
      \ \"example\"\n  description          = \"example\"\n  node_type            = \"cache.t4g.medium\"\
      \n\n  automatic_failover_enabled = true\n  multi_az_enabled           = true\n  num_cache_clusters\
      \         = 2\n}\n"
CKV2_AWS_51:
  aws_api_gateway_stage:
    cli: "aws apigateway update-stage --rest-api-id <api-id> --stage-name prod --patch-operations op=replace,path=/clientCertificateId,value=<client-cert-id>\n"
    terraform: "resource \"aws_api_gateway_client_certificate\" \"example\" {\n  description = \"backend\
      \ mTLS\"\n}\n\nresource \"aws_api_gateway_stage\" \"example\" {\n  rest_api_id           = aws_api_gateway_rest_api.example.id\n\
      \  deployment_id         = aws_api_gateway_deployment.example.id\n  stage_name            = \"prod\"\
      \n  client_certificate_id = aws_api_gateway_client_certificate.example.id\n}\n"
  aws_apigatewayv2_stage:
    cli: "aws apigatewayv2 update-stage --api-id <api-id> --stage-name prod --client-certificate-id <client-cert-id>\n"
    terraform: "resource \"aws_apigatewayv2_stage\" \"example\" {\n  api_id                = aws_apigatewayv2_api.example.id\n\
      \  name                  = \"prod\"\n  client_certificate_id = aws_api_gateway_client_certificate.example.id\n\
      }\n"
CKV2_AWS_52:
  aws_elasticsearch_domain:
    terraform: "resource \"aws_elasticsearch_domain\" \"example\" {\n  domain_name = \"example\"\n\n \
      \ advanced_security_options {\n    enabled                        = true\n    internal_user_database_enabled\
      \ = false\n  }\n\n  encrypt_at_rest { enabled = true }\n  node_to_node_encryption { enabled = true\
      \ }\n  domain_endpoint_options { enforce_https = true }\n}\n"
  aws_opensearch_domain:
    cli: aws opensearch update-domain-config --domain-name <name> --advanced-security-options Enabled=true
    note: Fine-grained access control cannot be enabled on an existing domain in place on older engine
      versions — check the engine version first; where it cannot, the domain must be recreated from a
      snapshot.
    terraform: "resource \"aws_opensearch_domain\" \"example\" {\n  domain_name = \"example\"\n\n  advanced_security_options\
      \ {\n    enabled                        = true\n    internal_user_database_enabled = false\n  }\n\
      \n  # FGAC requires all three of these\n  encrypt_at_rest { enabled = true }\n  node_to_node_encryption\
      \ { enabled = true }\n  domain_endpoint_options { enforce_https = true }\n}\n"
CKV2_AWS_54:
  aws_cloudfront_distribution:
    cli: aws cloudfront get-distribution-config --id <id> > dist.json, edit OriginSslProtocols to remove
      SSLv3, then aws cloudfront update-distribution --id <id> --distribution-config file://config.json
      --if-match <etag>
    note: CloudFront has no single-field update API — the whole distribution config must be read, edited
      and written back with the current ETag. Confirm the origin actually negotiates TLS 1.2 before removing
      the older protocols, or the origin becomes unreachable.
    terraform: "resource \"aws_cloudfront_distribution\" \"example\" {\n  origin {\n    domain_name =\
      \ \"origin.example.com\"\n    origin_id   = \"custom-origin\"\n\n    custom_origin_config {\n  \
      \    http_port              = 80\n      https_port             = 443\n      origin_protocol_policy\
      \ = \"https-only\"\n\n      # SSLv3 removed; TLSv1.2 only\n      origin_ssl_protocols = [\"TLSv1.2\"\
      ]\n    }\n  }\n}\n"
CKV2_AWS_55:
  aws_emr_cluster:
    note: 'No in-place fix: a cluster''s security configuration is fixed at launch and cannot be attached
      afterwards. The running cluster must be replaced. Terminated clusters still appear in ListClusters
      for roughly two months and should be exempted rather than remediated.'
    terraform: "resource \"aws_emr_security_configuration\" \"example\" {\n  name          = \"example\"\
      \n  configuration = jsonencode({\n    EncryptionConfiguration = {\n      EnableInTransitEncryption\
      \ = true\n      EnableAtRestEncryption    = true\n      AtRestEncryptionConfiguration = {\n    \
      \    S3EncryptionConfiguration  = { EncryptionMode = \"SSE-KMS\", AwsKmsKey = aws_kms_key.emr.arn\
      \ }\n        LocalDiskEncryptionConfiguration = { EncryptionKeyProviderType = \"AwsKms\", AwsKmsKey\
      \ = aws_kms_key.emr.arn }\n      }\n      InTransitEncryptionConfiguration = {\n        TLSCertificateConfiguration\
      \ = { CertificateProviderType = \"PEM\", S3Object = \"s3://example/certs.zip\" }\n      }\n    }\n\
      \  })\n}\n\nresource \"aws_emr_cluster\" \"example\" {\n  name                   = \"example\"\n\
      \  release_label          = \"emr-7.1.0\"\n  security_configuration = aws_emr_security_configuration.example.name\n\
      }\n"
CKV2_AWS_56:
  aws_iam_policy_attachment:
    cli: "# Find every principal holding it, then detach each one.\naws iam list-entities-for-policy --policy-arn\
      \ arn:aws:iam::aws:policy/IAMFullAccess\naws iam detach-role-policy --role-name <role> --policy-arn\
      \ arn:aws:iam::aws:policy/IAMFullAccess\naws iam detach-user-policy --user-name <user> --policy-arn\
      \ arn:aws:iam::aws:policy/IAMFullAccess\naws iam detach-group-policy --group-name <group> --policy-arn\
      \ arn:aws:iam::aws:policy/IAMFullAccess\n"
    note: 'Detach last, not first: a principal that administers IAM through this policy may be the only
      principal able to create its replacement. Also check permission sets — an attachment made through
      IAM Identity Center is re-provisioned onto the AWSReservedSSO_* role after any manual detach, so
      it must be removed at the permission set (aws_ssoadmin_managed_policy_attachment) or it comes straight
      back.'
    terraform: "# Replace the AWS-managed IAMFullAccess attachment with a customer-managed\n# policy scoped\
      \ to the paths and actions the principal actually needs.\nresource \"aws_iam_policy\" \"iam_admin_scoped\"\
      \ {\n  name        = \"iam-admin-scoped\"\n  description = \"IAM administration limited to the service-role\
      \ path\"\n\n  policy = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [{\n      Effect\
      \   = \"Allow\"\n      Action   = [\"iam:CreateRole\", \"iam:DeleteRole\", \"iam:AttachRolePolicy\"\
      ,\n                  \"iam:DetachRolePolicy\", \"iam:TagRole\"]\n      Resource = \"arn:${data.aws_partition.current.partition}:iam::${data.aws_caller_identity.current.account_id}:role/service-role/*\"\
      \n      Condition = {\n        ArnLike = {\n          \"iam:PolicyARN\" = \"arn:${data.aws_partition.current.partition}:iam::${data.aws_caller_identity.current.account_id}:policy/*\"\
      \n        }\n      }\n    }]\n  })\n}\n\nresource \"aws_iam_role_policy_attachment\" \"platform_iam_admin\"\
      \ {\n  role       = aws_iam_role.platform.name\n  policy_arn = aws_iam_policy.iam_admin_scoped.arn\n\
      }\n"
CKV2_AWS_57:
  aws_secretsmanager_secret:
    cli: aws secretsmanager rotate-secret --secret-id <name> --rotation-lambda-arn <arn> --rotation-rules
      AutomaticallyAfterDays=30
    note: Rotation needs a rotation Lambda that can reach both Secrets Manager and the credential's own
      service; AWS publishes templates per engine. Secrets owned by another service (OwningService set,
      e.g. RDS-managed master passwords) rotate under that service's control and should be exempted rather
      than given a second rotator.
    terraform: "resource \"aws_secretsmanager_secret\" \"example\" {\n  name = \"example\"\n}\n\nresource\
      \ \"aws_secretsmanager_secret_rotation\" \"example\" {\n  secret_id           = aws_secretsmanager_secret.example.id\n\
      \  rotation_lambda_arn = aws_lambda_function.rotator.arn\n\n  rotation_rules {\n    automatically_after_days\
      \ = 30\n  }\n}\n"
CKV2_AWS_59:
  aws_elasticsearch_domain:
    terraform: "resource \"aws_elasticsearch_domain\" \"example\" {\n  domain_name = \"example\"\n\n \
      \ cluster_config {\n    instance_count           = 3\n    dedicated_master_enabled = true\n    dedicated_master_type\
      \    = \"m5.large.elasticsearch\"\n    dedicated_master_count   = 3\n    zone_awareness_enabled\
      \   = true\n  }\n}\n"
  aws_opensearch_domain:
    cli: aws opensearch update-domain-config --domain-name <name> --cluster-config DedicatedMasterEnabled=true,DedicatedMasterType=m6g.large.search,DedicatedMasterCount=3
    note: Use three dedicated masters, not two — two cannot form a quorum, so a single master loss takes
      the cluster down anyway. The change is a blue/green deployment and the domain stays available but
      is briefly degraded.
    terraform: "resource \"aws_opensearch_domain\" \"example\" {\n  domain_name = \"example\"\n\n  cluster_config\
      \ {\n    instance_type            = \"r6g.large.search\"\n    instance_count           = 3\n   \
      \ dedicated_master_enabled = true\n    dedicated_master_type    = \"m6g.large.search\"\n    dedicated_master_count\
      \   = 3\n    zone_awareness_enabled   = true\n  }\n}\n"
CKV2_AWS_6:
  aws_s3_bucket:
    cli: "aws s3api put-public-access-block --bucket <name> \\\n  --public-access-block-configuration\
      \ \\\n  BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true\n"
    terraform: "resource \"aws_s3_bucket_public_access_block\" \"example\" {\n  bucket               \
      \   = aws_s3_bucket.example.id\n  block_public_acls       = true\n  ignore_public_acls      = true\n\
      \  block_public_policy     = true\n  restrict_public_buckets = true\n}\n"
CKV2_AWS_61:
  aws_s3_bucket:
    cli: "aws s3api put-bucket-lifecycle-configuration --bucket <name> \\\n  --lifecycle-configuration\
      \ file://lifecycle.json\n"
    terraform: "resource \"aws_s3_bucket_lifecycle_configuration\" \"example\" {\n  bucket = aws_s3_bucket.example.id\n\
      \n  rule {\n    id     = \"expire-noncurrent\"\n    status = \"Enabled\"\n\n    noncurrent_version_expiration\
      \ {\n      noncurrent_days = 90\n    }\n\n    abort_incomplete_multipart_upload {\n      days_after_initiation\
      \ = 7\n    }\n  }\n}\n"
CKV2_AWS_63:
  aws_networkfirewall_firewall:
    cli: aws network-firewall update-logging-configuration --firewall-name <name> --logging-configuration
      file://logging.json
    note: 'Configure both log types: ALERT records what the rule groups acted on, FLOW records the traffic
      they saw. Only one destination change is accepted per call, so adding both types out of band takes
      two calls.'
    terraform: "resource \"aws_networkfirewall_logging_configuration\" \"example\" {\n  firewall_arn =\
      \ aws_networkfirewall_firewall.example.arn\n\n  logging_configuration {\n    log_destination_config\
      \ {\n      log_destination_type = \"CloudWatchLogs\"\n      log_type             = \"FLOW\"\n  \
      \    log_destination = {\n        logGroup = aws_cloudwatch_log_group.firewall_flow.name\n     \
      \ }\n    }\n\n    log_destination_config {\n      log_destination_type = \"CloudWatchLogs\"\n  \
      \    log_type             = \"ALERT\"\n      log_destination = {\n        logGroup = aws_cloudwatch_log_group.firewall_alert.name\n\
      \      }\n    }\n  }\n}\n"
CKV2_AWS_71:
  aws_acm_certificate:
    note: 'No in-place fix: a certificate''s domain names are set at issuance. Issue a replacement naming
      the hosts explicitly, repoint every listener and distribution at it, then delete the wildcard. Certificates
      ACM issued for another service''s use (ManagedBy CLOUDFRONT) cannot be replaced this way.'
    terraform: "resource \"aws_acm_certificate\" \"example\" {\n  # Name each host explicitly rather than\
      \ \"*.example.com\"\n  domain_name = \"api.example.com\"\n\n  subject_alternative_names = [\n  \
      \  \"app.example.com\",\n    \"admin.example.com\",\n  ]\n\n  validation_method = \"DNS\"\n\n  lifecycle\
      \ {\n    create_before_destroy = true\n  }\n}\n"
CKV2_AWS_73:
  aws_sqs_queue:
    cli: aws sqs set-queue-attributes --queue-url <url> --attributes KmsMasterKeyId=<key-arn>
    note: Every producer and consumer principal needs kms:GenerateDataKey and kms:Decrypt on the new key,
      and cross-account senders need it in the key policy — switching the key before that grant exists
      silently breaks the queue. Messages already in flight stay under the old key.
    terraform: "resource \"aws_kms_key\" \"sqs\" {\n  description             = \"CMK for SQS payload\
      \ encryption\"\n  enable_key_rotation     = true\n  deletion_window_in_days = 30\n}\n\nresource\
      \ \"aws_sqs_queue\" \"example\" {\n  name                              = \"example\"\n  kms_master_key_id\
      \                 = aws_kms_key.sqs.arn\n  kms_data_key_reuse_period_seconds = 300\n}\n"
CKV2_AWS_74:
  aws_alb_listener:
    cli: "aws elbv2 modify-listener --listener-arn <listener-arn> --ssl-policy ELBSecurityPolicy-TLS13-1-2-Res-2021-06\n"
    terraform: "resource \"aws_alb_listener\" \"https\" {\n  load_balancer_arn = aws_alb.example.arn\n\
      \  port              = 443\n  protocol          = \"HTTPS\"\n  ssl_policy        = \"ELBSecurityPolicy-TLS13-1-2-Res-2021-06\"\
      \n  certificate_arn   = aws_acm_certificate.example.arn\n\n  default_action {\n    type        \
      \     = \"forward\"\n    target_group_arn = aws_alb_target_group.example.arn\n  }\n}\n"
  aws_lb_listener:
    cli: "aws elbv2 modify-listener --listener-arn <listener-arn> --ssl-policy ELBSecurityPolicy-TLS13-1-2-Res-2021-06\n"
